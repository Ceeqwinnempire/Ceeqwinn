<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<title>Article</title>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

<style>

body{
font-family:Arial,sans-serif;
max-width:800px;
margin:40px auto;
padding:20px;
line-height:1.8;
}

img{
width:100%;
max-width:100%;
display:block;
margin:0 auto 25px;
border-radius:12px;
}

</style>

</head>

<body>

<div id="content">
Loading...
</div>

<script>

const params = new URLSearchParams(window.location.search);
const file = params.get("file");

fetch(`content/articles/${file}.md`)
.then(r => r.text())
.then(md => {

    let title = "";
    let cover = "";
    let body = md;

    // Check for YAML front matter
    if(md.startsWith("---")){

        const end = md.indexOf("---",3);

        if(end !== -1){

            const frontMatter = md.substring(3,end).trim();

            body = md.substring(end+3).trim();

            frontMatter.split("\n").forEach(line=>{

                if(line.startsWith("title:")){
                    title = line.replace("title:","").trim();
                }

                if(line.startsWith("cover:")){
                    cover = line.replace("cover:","").trim();
                }

            });

        }

    }

    document.getElementById("content").innerHTML = `
        ${cover ? `<img src="${cover}" alt="${title}">` : ""}
        ${title ? `<h1>${title}</h1>` : ""}
        ${marked.parse(body)}
    `;

})
.catch(err => {
    document.getElementById("content").innerHTML =
    "<h2>Article not found.</h2>";
    console.error(err);
});

</script>

</body>
</html>
