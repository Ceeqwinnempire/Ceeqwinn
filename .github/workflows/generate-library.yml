name: Generate CEEQWINN Library

on:
  push:
    paths:
      - "content/articles/*.md"
      - ".github/workflows/generate-library.yml"

permissions:
  contents: write

jobs:
  generate-library:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate library index
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          articles_dir = Path("content/articles")
          index_file = articles_dir / "index.json"

          articles = []

          for file in sorted(articles_dir.glob("*.md")):
              text = file.read_text(encoding="utf-8")

              title_match = re.search(
                  r"^title:\s*[\"']?(.*?)[\"']?\s*$",
                  text,
                  re.MULTILINE
              )

              title = (
                  title_match.group(1).strip()
                  if title_match
                  else file.stem
              )

              articles.append({
                  "title": title,
                  "slug": file.stem
              })

          index_file.write_text(
              json.dumps(
                  articles,
                  indent=2,
                  ensure_ascii=False
              ) + "\n",
              encoding="utf-8"
          )

          print(
              f"Generated {index_file} "
              f"with {len(articles)} articles."
          )
          PY

      - name: Commit library index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add content/articles/index.json

          if git diff --cached --quiet; then
            echo "No library changes to commit."
          else
            git commit -m "Update automatic library"
            git push
          fi
