<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Lexis — Fashion Game</title>

<style>

body {
  margin: 0;
  background: #111;
  color: #fff;
  font-family: Arial, sans-serif;
  text-align: center;
}

.game {
  max-width: 700px;
  margin: auto;
  padding: 20px;
}

#lexis {
  width: 100%;
  max-width: 420px;
  height: auto;
  display: block;
  margin: 20px auto;
}

button {
  padding: 14px 22px;
  margin: 8px;
  border: 0;
  border-radius: 8px;
  cursor: pointer;
  font-size: 16px;
}

#message {
  margin: 15px 0;
  min-height: 24px;
}

</style>

</head>

<body>

<div class="game">

  <h1>Choose Lexis's Outfit</h1>

  <img
    id="lexis"
    src="../content/images/characters/lexis/outfits/lexis_default.png.jpeg"
    alt="Lexis"
  >

  <div id="message">
    Choose an outfit for Lexis.
  </div>

  <button onclick="chooseOutfit('lexis_red_dress')">
    Red Dress
  </button>

  <button onclick="chooseOutfit('lexis_black_dress')">
    Black Dress
  </button>

  <br>

  <button onclick="finishGame()">
    Continue Story
  </button>

  <button onclick="leaveGame()">
    Go Back
  </button>

</div>


<script>

/* =========================================================
   OUTFIT IMAGES
   ========================================================= */

var OUTFIT_IMAGES = {

  lexis_default:
    "../content/images/characters/lexis/outfits/lexis_default.png.jpeg",

  lexis_red_dress:
    "../content/images/characters/lexis/outfits/lexis_red_dress.png.jpeg",

  lexis_black_dress:
    "../content/images/characters/lexis/outfits/lexis_black_dress.png.jpeg"

};


/* =========================================================
   PLAYER STATE
   ========================================================= */

function getPlayerState() {

  var saved =
    localStorage.getItem(
      "ceeqwinn_player_state"
    );

  if (saved) {

    try {

      var parsed =
        JSON.parse(saved);

      /*
       * Make sure older saved player
       * states still receive the structures
       * this game needs.
       */

      if (!parsed.characters) {
        parsed.characters = {};
      }

      if (!parsed.characters.lexis) {
        parsed.characters.lexis = {};
      }

      if (!parsed.characters.lexis.currentOutfit) {
        parsed.characters.lexis.currentOutfit =
          "lexis_default";
      }

      if (!parsed.games) {
        parsed.games = {};
      }

      if (!parsed.games.fashion01) {
        parsed.games.fashion01 = {
          result: null,
          score: null
        };
      }

      return parsed;

    } catch (error) {

      console.log(
        "Could not read player state."
      );

    }

  }

  return {

    characters: {

      lexis: {

        currentOutfit:
          "lexis_default"

      }

    },

    games: {

      fashion01: {

        result: null,

        score: null

      }

    }

  };

}


/* =========================================================
   SAVE PLAYER STATE
   ========================================================= */

function savePlayerState(state) {

  localStorage.setItem(
    "ceeqwinn_player_state",
    JSON.stringify(state)
  );

}


/* =========================================================
   CHOOSE OUTFIT
   ========================================================= */

function chooseOutfit(outfitId) {

  var state =
    getPlayerState();


  state.characters.lexis.currentOutfit =
    outfitId;


  state.games.fashion01.result =
    outfitId;


  savePlayerState(
    state
  );


  document.getElementById(
    "lexis"
  ).src =
    OUTFIT_IMAGES[outfitId];


  document.getElementById(
    "message"
  ).textContent =
    "Lexis is now wearing this outfit.";

}


/* =========================================================
   FINISH GAME
   ========================================================= */

function finishGame() {

  var state =
    getPlayerState();


  /*
   * Keep the selected outfit as the
   * final result of the fashion game.
   */

  state.games.fashion01.result =
    state.characters.lexis.currentOutfit;


  savePlayerState(
    state
  );


  /*
   * Tell the story engine that
   * FASHION-01 has been completed.
   */

  var completedGames = {};


  try {

    completedGames =
      JSON.parse(
        localStorage.getItem(
          "ceeqwinn_completed_games"
        ) || "{}"
      );

  } catch (error) {

    completedGames = {};

  }


  completedGames["FASHION-01"] =
    true;


  localStorage.setItem(
    "ceeqwinn_completed_games",
    JSON.stringify(
      completedGames
    )
  );


  /*
   * Tell the returning Chapter 3 page
   * that this game was just completed.
   *
   * This is only a small resume signal.
   * The actual game completion remains
   * ceeqwinn_completed_games.
   */

  try {

    sessionStorage.setItem(
      "ceeqwinn_return_from_game",
      "FASHION-01"
    );

  } catch (error) {}


  /*
   * IMPORTANT:
   *
   * Do NOT reconstruct article.html.
   *
   * Go back to the already-loaded
   * Chapter 3 reader.
   */

  history.back();

}


/* =========================================================
   LEAVE GAME WITHOUT COMPLETING IT
   ========================================================= */

function leaveGame() {

  /*
   * No completion flag is written.
   *
   * Therefore Chapter 3 will still see
   * FASHION-01 as incomplete when we
   * return.
   */

  history.back();

}

</script>

</body>
</html>
