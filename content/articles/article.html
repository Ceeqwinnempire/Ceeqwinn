<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CEEQWINN Reader</title>

<style>
body{
    max-width:800px;
    margin:auto;
    padding:40px 20px;
    font-family:Arial, sans-serif;
    line-height:1.8;
    background:#fafafa;
    color:#222;
}

h1{
    font-size:2.2rem;
    margin-bottom:20px;
}

#content img{
    max-width:100%;
    border-radius:12px;
    margin:20px 0;
}

#content{
    white-space:pre-wrap;
}
</style>

</head>

<body>

<h1 id="title">Loading...</h1>

<div id="content"></div>

<script>
const params = new URLSearchParams(location.search);

const file = params.get("file");

fetch("content/articles/" + file + ".md")
.then(r=>r.text())
.then(text=>{

const lines=text.split("\n");

let title="";

let body=[];

for(const line of lines){

if(line.startsWith("title")){

title=line.replace("title","").replace(":","").trim();

}else{

body.push(line);

}

}

document.getElementById("title").textContent=title;

document.getElementById("content").textContent=body.join("\n");

});
</script>

</body>
</html>
