<!-- SEARCHABLE VIDEO GALLERY -->
<style>
  /* Gallery Styling */
  .video-gallery-container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 20px;
    font-family: sans-serif;
  }
  
  /* Search Bar Styling */
  #videoSearch {
    width: 100%;
    padding: 15px;
    margin-bottom: 30px;
    border: 2px solid #ddd;
    border-radius: 8px;
    font-size: 16px;
    box-sizing: border-box;
  }

  /* Grid Layout */
  .video-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 20px;
  }

  /* Individual Video Card */
  .video-card {
    background: #fff;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    transition: transform 0.2s;
  }
  
  .video-card:hover {
    transform: translateY(-5px);
  }

  .video-title {
    padding: 15px;
    font-weight: bold;
    color: #333;
    text-align: center;
  }

  /* Responsive Iframe Wrapper */
  .iframe-wrapper {
    position: relative;
    padding-bottom: 56.25%; /* 16:9 Aspect Ratio */
    height: 0;
    overflow: hidden;
  }
  
  .iframe-wrapper iframe {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    border: 0;
  }
</style>

<div class="video-gallery-container">
  <!-- Search Bar -->
  <input type="text" id="videoSearch" placeholder="Search for movies (e.g., WAP TV, SuperSport, Uche Montana)...">

  <!-- Video Grid -->
  <div class="video-grid">

    <!-- MOVIE 1: Uche Montana (New) -->
    <div class="video-card" data-title="Uche Montana New Movie">
      <div class="iframe-wrapper">
        <iframe src="https://www.youtube.com/embed/-yVrN03f610?rel=0" allowfullscreen></iframe>
      </div>
      <div class="video-title">Uche Montana: New Release</div>
    </div>

    <!-- MOVIE 2: Uche Montana (Old) -->
    <div class="video-card" data-title="Uche Montana Previous Film">
      <div class="iframe-wrapper">
        <iframe src="https://www.youtube.com/embed/YsW3tcUcvuY?rel=0" allowfullscreen></iframe>
      </div>
      <div class="video-title">Uche Montana: Classic Hit</div>
    </div>

    <!-- PLACEHOLDER FOR LOCAL CHANNELS -->
    <!-- Note: Since these don't have YouTube links, you would replace the src below 
         with a direct video file link (.mp4) if you have one, or leave as a placeholder. -->
    <div class="video-card" data-title="WAP TV Live Stream">
      <div class="iframe-wrapper">
        <!-- Replace 'placeholder.mp4' with your actual local stream link if you have one -->
        <iframe src="" style="background: #000; display: flex; align-items: center; justify-content: center; color: white;">
          <!-- Fallback message if no link exists -->
        </iframe>
      </div>
      <div class="video-title">WAP TV (Local Channel)</div>
    </div>

  </div>
</div>

<script>
  // Search Functionality
  document.getElementById('videoSearch').addEventListener('keyup', function() {
    let filter = this.value.toUpperCase();
    let cards = document.getElementsByClassName('video-card');

    for (let i = 0; i < cards.length; i++) {
      let title = cards[i].getAttribute('data-title');
      if (title.toUpperCase().indexOf(filter) > -1) {
        cards[i].style.display = "";
      } else {
        cards[i].style.display = "none";
      }
    }
  });
</script>
