<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CEEQWINN Supabase Test</title>

</head>

<body>

<h1>CEEQWINN Supabase Test</h1>

<p id="status">Connecting...</p>

<div id="redeemArea" style="display:none;">

    <button id="redeemButton">
        REDEEM TEST TICKET
    </button>

    <p id="redeemStatus"></p>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL = "https://iwuambqesluciawsgyww.supabase.co";

const SUPABASE_PUBLISHABLE_KEY = "PASTE YOUR EXISTING PUBLISHABLE KEY HERE";

const { createClient } = supabase;

const client = createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
);


async function testSupabase(){

    const status = document.getElementById("status");

    status.textContent = "Creating anonymous player...";


    const { data, error } =
        await client.auth.signInAnonymously();


    if(error){

        console.error(error);

        status.textContent =
            "Supabase authentication failed: " +
            error.message;

        return;
    }


    const user = data.user;


    status.textContent =
        "Anonymous authentication successful. Checking player...";


    const { data: player, error: playerError } =
        await client
            .from("players")
            .select("id, created_at")
            .eq("id", user.id)
            .single();


    if(playerError){

        console.error(playerError);

        status.textContent =
            "Player check failed: " +
            playerError.message;

        return;
    }


    status.textContent =
        "Player created successfully. Checking wallet...";


    const { data: wallet, error: walletError } =
        await client
            .from("wallets")
            .select(
                "id, balance_diamonds, player_id"
            )
            .eq("player_id", user.id)
            .single();


    if(walletError){

        console.error(walletError);

        status.textContent =
            "Wallet check failed: " +
            walletError.message;

        return;
    }


    status.innerHTML = `
        <strong>CEEQWINN Supabase test successful.</strong><br><br>

        Player ID: ${player.id}<br>

        Wallet ID: ${wallet.id}<br>

        Diamond balance: ${wallet.balance_diamonds}
    `;


    document.getElementById("redeemArea").style.display =
        "block";


    document.getElementById("redeemButton").onclick =
        async function(){

            const redeemStatus =
                document.getElementById("redeemStatus");

            const button =
                document.getElementById("redeemButton");


            button.disabled = true;

            redeemStatus.textContent =
                "Redeeming CEEQ-TEST-002...";


            const { data: diamonds, error: redeemError } =
                await client.rpc(
                    "redeem_ticket",
                    {
                        p_ticket_code: "CEEQ-TEST-002"
                    }
                );


            if(redeemError){

                console.error(redeemError);

                redeemStatus.textContent =
                    "Redemption failed: " +
                    redeemError.message;

                button.disabled = false;

                return;
            }


            redeemStatus.innerHTML = `
                <strong>Redemption successful.</strong><br><br>

                Diamonds credited: ${diamonds}
            `;


            const { data: updatedWallet } =
                await client
                    .from("wallets")
                    .select("balance_diamonds")
                    .eq("player_id", user.id)
                    .single();


            if(updatedWallet){

                status.innerHTML = `
                    <strong>CEEQWINN Supabase test successful.</strong><br><br>

                    Player ID: ${player.id}<br>

                    Wallet ID: ${wallet.id}<br>

                    Diamond balance:
                    ${updatedWallet.balance_diamonds}
                `;
            }

        };

}


testSupabase();

</script>

</body>
</html>
