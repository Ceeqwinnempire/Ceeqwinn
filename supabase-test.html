<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CEEQWINN Supabase Test</title>

</head>

<body>

<h1>CEEQWINN Supabase Test</h1>

<p id="status">Connecting...</p>


<div id="ledgerArea" style="display:none;">

    <h2>Wallet Ledger</h2>

    <div id="ledgerStatus"></div>

</div>


<div id="redeemArea" style="display:none;">

    <button id="redeemButton">
        REDEEM TEST TICKET
    </button>

    <p id="redeemStatus"></p>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
    "https://iwuambqesluciawsgyww.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_Cf4ctw1m5RTNUHQ5mfsidQ_zG6WuGdx";


const { createClient } = supabase;

const client = createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
);


/*
=========================================================
LEDGER DISPLAY
=========================================================
*/

async function loadLedger(walletId){

    const ledgerArea =
        document.getElementById("ledgerArea");

    const ledgerStatus =
        document.getElementById("ledgerStatus");


    ledgerArea.style.display = "block";

    ledgerStatus.textContent =
        "Checking wallet ledger...";


    const { data: ledger, error: ledgerError } =
        await client
            .from("wallet_ledger")
            .select(
                "id, amount_diamonds, entry_type, reference_id, created_at"
            )
            .eq("wallet_id", walletId)
            .order(
                "created_at",
                { ascending: false }
            );


    if(ledgerError){

        console.error(ledgerError);

        ledgerStatus.textContent =
            "Ledger check failed: " +
            ledgerError.message;

        return;
    }


    if(!ledger || ledger.length === 0){

        ledgerStatus.textContent =
            "No ledger entries found.";

        return;
    }


    ledgerStatus.innerHTML =
        ledger.map(entry => `

            <div style="
                border:1px solid #ccc;
                padding:10px;
                margin-bottom:10px;
            ">

                <strong>
                    ${entry.amount_diamonds > 0 ? "+" : ""}
                    ${entry.amount_diamonds}
                    diamonds
                </strong>

                <br>

                Entry type:
                ${entry.entry_type}

                <br>

                Reference:
                ${entry.reference_id}

                <br>

                Created:
                ${entry.created_at}

            </div>

        `).join("");

}


/*
=========================================================
MAIN SUPABASE TEST
=========================================================
*/

async function testSupabase(){

    const status =
        document.getElementById("status");


    status.textContent =
        "Creating anonymous player...";


    const { data, error } =
        await client.auth.signInAnonymously();


    if(error){

        console.error(error);

        status.textContent =
            "Supabase authentication failed: " +
            error.message;

        return;
    }


    const user =
        data.user;


    status.textContent =
        "Anonymous authentication successful. Checking player...";


    const { data: player, error: playerError } =
        await client
            .from("players")
            .select("id, created_at")
            .eq("id", user.id)
            .single();


    if(playerError){

        console.error(playerError);

        status.textContent =
            "Player check failed: " +
            playerError.message;

        return;
    }


    status.textContent =
        "Player created successfully. Checking wallet...";


    const { data: wallet, error: walletError } =
        await client
            .from("wallets")
            .select(
                "id, balance_diamonds, player_id"
            )
            .eq("player_id", user.id)
            .single();


    if(walletError){

        console.error(walletError);

        status.textContent =
            "Wallet check failed: " +
            walletError.message;

        return;
    }


    status.innerHTML = `
        <strong>CEEQWINN Supabase test successful.</strong><br><br>

        Player ID: ${player.id}<br>

        Wallet ID: ${wallet.id}<br>

        Diamond balance: ${wallet.balance_diamonds}
    `;


    /*
    =========================================================
    CHECK LEDGER BEFORE REDEMPTION
    =========================================================
    */

    await loadLedger(wallet.id);


    /*
    =========================================================
    SHOW REDEMPTION BUTTON
    =========================================================
    */

    document.getElementById("redeemArea").style.display =
        "block";


    document.getElementById("redeemButton").onclick =
        async function(){

            const redeemStatus =
                document.getElementById("redeemStatus");

            const button =
                document.getElementById("redeemButton");


            button.disabled = true;


            redeemStatus.textContent =
                "Redeeming CEEQ-TEST-003...";


            const { data: diamonds, error: redeemError } =
                await client.rpc(
                    "redeem_ticket",
                    {
                        p_ticket_code:
                            "CEEQ-TEST-003"
                    }
                );


            if(redeemError){

                console.error(redeemError);

                redeemStatus.textContent =
                    "Redemption failed: " +
                    redeemError.message;

                button.disabled = false;

                return;
            }


            redeemStatus.innerHTML = `
                <strong>Redemption successful.</strong><br><br>

                Diamonds credited: ${diamonds}
            `;


            /*
            =================================================
            REFRESH WALLET BALANCE
            =================================================
            */

            const {
                data: updatedWallet,
                error: updatedWalletError
            } =
                await client
                    .from("wallets")
                    .select(
                        "balance_diamonds"
                    )
                    .eq(
                        "player_id",
                        user.id
                    )
                    .single();


            if(updatedWalletError){

                console.error(
                    updatedWalletError
                );

            }
            else{

                status.innerHTML = `
                    <strong>
                        CEEQWINN Supabase test successful.
                    </strong><br><br>

                    Player ID: ${player.id}<br>

                    Wallet ID: ${wallet.id}<br>

                    Diamond balance:
                    ${updatedWallet.balance_diamonds}
                `;

            }


            /*
            =================================================
            REFRESH LEDGER
            =================================================
            */

            await loadLedger(wallet.id);

        };

}


testSupabase();

</script>

</body>
</html>
