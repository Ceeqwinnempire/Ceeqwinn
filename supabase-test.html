<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>CEEQWINN Supabase Full Test</title>

</head>

<body>

<h1>CEEQWINN Supabase Full Test</h1>

<p id="status">Connecting...</p>

<div id="results"></div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
    "https://iwuambqesluciawsgyww.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_Cf4ctw1m5RTNUHQ5mfsidQ_zG6WuGdx";


const { createClient } = supabase;

const client = createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
);


const results =
    document.getElementById("results");


function showTest(name, passed, details){

    const box =
        document.createElement("div");

    box.style.border = "1px solid #ccc";
    box.style.padding = "12px";
    box.style.margin = "10px 0";

    box.innerHTML = `
        <strong>
            ${passed ? "✅" : "❌"} ${name}
        </strong>

        <br><br>

        ${details}
    `;

    results.appendChild(box);

}


/*
=========================================================
MAIN TEST
=========================================================
*/

async function runTests(){

    const status =
        document.getElementById("status");


    status.textContent =
        "Creating anonymous player...";


    /*
    =====================================================
    1. ANONYMOUS AUTH
    =====================================================
    */

    const {
        data: authData,
        error: authError
    } =
        await client.auth.signInAnonymously();


    if(authError){

        status.textContent =
            "Authentication failed.";

        showTest(
            "Anonymous authentication",
            false,
            authError.message
        );

        return;
    }


    const user =
        authData.user;


    showTest(
        "Anonymous authentication",
        true,
        "Anonymous player session created."
    );


    /*
    =====================================================
    2. PLAYER READ
    =====================================================
    */

    const {
        data: player,
        error: playerError
    } =
        await client
            .from("players")
            .select("id")
            .eq("id", user.id)
            .single();


    showTest(
        "Own player record",
        !playerError && !!player,
        playerError
            ? playerError.message
            : "Player record is readable."
    );


    /*
    =====================================================
    3. WALLET READ
    =====================================================
    */

    const {
        data: wallet,
        error: walletError
    } =
        await client
            .from("wallets")
            .select(
                "id, balance_diamonds, player_id"
            )
            .eq("player_id", user.id)
            .single();


    if(walletError){

        showTest(
            "Own wallet",
            false,
            walletError.message
        );

        return;
    }


    showTest(
        "Own wallet",
        true,
        "Wallet is readable by its owner."
    );


    /*
    =====================================================
    4. OWN LEDGER READ
    =====================================================
    */

    const {
        data: ownLedger,
        error: ownLedgerError
    } =
        await client
            .from("wallet_ledger")
            .select(
                "id, amount_diamonds, entry_type"
            )
            .eq("wallet_id", wallet.id);


    showTest(
        "Own wallet ledger",
        !ownLedgerError,
        ownLedgerError
            ? ownLedgerError.message
            : `${ownLedger.length} ledger entr${ownLedger.length === 1 ? "y" : "ies"} readable.`
    );


    /*
    =====================================================
    5. DIRECT LEDGER INSERT
    =====================================================
    */

    const {
        error: ledgerInsertError
    } =
        await client
            .from("wallet_ledger")
            .insert({
                wallet_id: wallet.id,
                amount_diamonds: 999999,
                entry_type: "security_test",
                reference_id: null
            });


    showTest(
        "Direct ledger insert",
        !!ledgerInsertError,
        ledgerInsertError
            ? "Blocked by database security."
            : "SECURITY FAILURE: browser inserted a ledger entry."
    );


    /*
    =====================================================
    6. DIRECT WALLET UPDATE
    =====================================================

    IMPORTANT:

    Supabase/PostgREST can return no error when an UPDATE
    matches zero rows because RLS prevents access.

    Therefore, we request the affected row with SELECT.

    If no row comes back, the update was blocked.

    If a row comes back, the browser actually changed
    the wallet and that is a security failure.
    */

    const originalBalance =
        wallet.balance_diamonds;


    const {
        data: attemptedWalletUpdate,
        error: walletUpdateError
    } =
        await client
            .from("wallets")
            .update({
                balance_diamonds:
                    originalBalance + 999999
            })
            .eq("id", wallet.id)
            .select(
                "id, balance_diamonds"
            );


    const walletUpdateBlocked =
        !!walletUpdateError ||
        !attemptedWalletUpdate ||
        attemptedWalletUpdate.length === 0;


    showTest(
        "Direct wallet update",
        walletUpdateBlocked,
        walletUpdateBlocked
            ? "Blocked by database security."
            : "SECURITY FAILURE: browser changed wallet balance."
    );


    /*
    =====================================================
    7. OTHER WALLET READ
    =====================================================

    We ask for wallets that do NOT belong to this player.

    RLS should prevent those rows from being returned.
    */

    const {
        data: otherWallets,
        error: otherWalletError
    } =
        await client
            .from("wallets")
            .select(
                "id, player_id, balance_diamonds"
            )
            .neq("player_id", user.id);


    const otherWalletBlocked =
        !otherWalletError &&
        (!otherWallets ||
         otherWallets.length === 0);


    showTest(
        "Other players' wallets",
        otherWalletBlocked,
        otherWalletBlocked
            ? "No other players' wallets were exposed."
            : "SECURITY FAILURE: another wallet was visible."
    );


    /*
    =====================================================
    8. RECHARGE TICKET INVENTORY
    =====================================================

    This table must NOT be player-readable.
    */

    const {
        data: tickets,
        error: ticketError
    } =
        await client
            .from("recharge_tickets")
            .select(
                "id, code, redeemed"
            )
            .limit(1);


    const ticketsBlocked =
        !!ticketError ||
        !tickets ||
        tickets.length === 0;


    showTest(
        "Recharge ticket inventory",
        ticketsBlocked,
        ticketsBlocked
            ? "Ticket inventory is not exposed to the browser."
            : "SECURITY FAILURE: ticket inventory is visible."
    );


    /*
    =====================================================
    9. REDEMPTION RECORDS
    =====================================================
    */

    const {
        data: redemptionRecords,
        error: redemptionError
    } =
        await client
            .from("redemption_records")
            .select(
                "id, ticket_id, product_id"
            )
            .limit(1);


    const redemptionBlocked =
        !!redemptionError ||
        !redemptionRecords ||
        redemptionRecords.length === 0;


    showTest(
        "Redemption records",
        redemptionBlocked,
        redemptionBlocked
            ? "Redemption records are not exposed to the browser."
            : "SECURITY FAILURE: redemption records are visible."
    );


    /*
    =====================================================
    10. REUSE ALREADY-REDEEMED TICKET
    =====================================================

    CEEQ-TEST-003 was already redeemed during our
    previous successful test.

    We deliberately try it again.

    It MUST fail.
    */

    const {
        data: reuseResult,
        error: reuseError
    } =
        await client.rpc(
            "redeem_ticket",
            {
                p_ticket_code:
                    "CEEQ-TEST-003"
            }
        );


    const reuseBlocked =
        !!reuseError;


    showTest(
        "Redeemed ticket replay protection",
        reuseBlocked,
        reuseBlocked
            ? "Second redemption was rejected: " +
              reuseError.message
            : "SECURITY FAILURE: redeemed ticket was accepted."
    );


    /*
    =====================================================
    COMPLETE
    =====================================================
    */

    status.innerHTML = `
        <strong>
            Full Supabase security test completed.
        </strong>

        <br><br>

        Player ID: ${user.id}<br>

        Wallet ID: ${wallet.id}<br>

        Current wallet balance:
        ${originalBalance}
    `;

}


runTests();

</script>

</body>
</html>
