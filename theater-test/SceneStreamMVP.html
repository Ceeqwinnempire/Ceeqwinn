<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>CEEQWINN Scene Stream</title>

  <link rel="stylesheet" href="SceneStreamMVP.css">
</head>

<body>

  <header class="site-header">
    <div class="eyebrow">CEEQWINN THEATRE</div>
    <h1>The Curtain Was Already Open</h1>
    <p>A small Scene Stream experiment.</p>
  </header>


  <main>

    <section class="scene-stream" id="sceneStream">

      <div class="scene-stage" id="sceneStage">

        <!-- THE VISUAL -->
        <div class="scene-visual" id="sceneVisual">
          <img
            id="sceneImage"
            src="https://raw.githubusercontent.com/Ceeqwinnempire/Ceeqwinn/main/content/images/Luxurious_royal_theatre_curtai%20(1).jpeg"
            alt="A luxurious theatre curtain"
          >
        </div>


        <!-- THE READING GLASS -->
        <div class="scene-reading-glass">

          <div
            class="scene-speaker"
            id="sceneSpeaker"
          >
            THEATRE
          </div>

          <div
            class="scene-text-window"
            id="sceneTextWindow"
          >
            <div
              class="scene-text-stream"
              id="sceneTextStream"
            ></div>
          </div>

        </div>


        <!-- TAP AREA -->
        <button
          class="scene-tap-area"
          id="sceneTapArea"
          type="button"
          aria-label="Continue scene"
        ></button>


        <div
          class="scene-tap-hint"
          id="sceneTapHint"
        >
          Tap to continue
        </div>

      </div>

    </section>


    <section class="scene-ending" id="sceneEnding">

      <div class="eyebrow">SCENE COMPLETE</div>

      <h2>The theatre gives the page back.</h2>

      <p>
        This is where the next part of the story could begin.
      </p>

    </section>

  </main>


  <script src="SceneStreamMVP.js"></script>

</body>
</html>
