<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>CEEQWINN Scene MVP v2</title>

  <link rel="stylesheet" href="CEEQWINNSceneMVP-v2.css">
</head>

<body>

  <main class="story-page">

    <!-- =====================================================
         SCENE 01
         ===================================================== -->

    <section
      class="story-scene"
      data-scene="01"
      id="scene-01"
    >

      <div class="scene-phone">

        <div class="scene-stage">

          <div class="scene-visual">

            <img
              class="scene-image scene-image-a"
              src="https://raw.githubusercontent.com/Ceeqwinnempire/Ceeqwinn/main/content/images/Luxurious_royal_theatre_curtai%20(1).jpeg"
              alt="A luxurious theatre curtain"
            >

            <img
              class="scene-image scene-image-b"
              alt=""
              aria-hidden="true"
            >

          </div>

          <div class="scene-atmosphere"></div>

          <div class="narration-glass">

            <div class="narration-inner">

              <div class="narration-label">
                THE THEATRE
              </div>

              <div class="narration-window">
                <div class="narration-stream"></div>
              </div>

            </div>

          </div>

          <button
            class="scene-interaction"
            type="button"
            aria-label="Continue scene"
          ></button>

          <div class="scene-hint">
            <span class="hint-tap">Tap</span>
            <span class="hint-scroll">Scroll</span>
            <span class="hint-continue">to continue</span>
          </div>

        </div>

        <div class="scene-end">

          <div class="scene-end-line"></div>

          <div class="scene-end-label">
            SCENE 01 COMPLETE
          </div>

          <div class="scene-end-text">
            The theatre gives the story back to you.
          </div>

          <div class="scene-end-arrow">
            ↓
          </div>

        </div>

      </div>

    </section>


    <!-- =====================================================
         SCENE 02
         ===================================================== -->

    <section
      class="story-scene"
      data-scene="02"
      id="scene-02"
    >

      <div class="scene-phone">

        <div class="scene-stage">

          <div class="scene-visual">

            <img
              class="scene-image scene-image-a"
              src="https://raw.githubusercontent.com/Ceeqwinnempire/Ceeqwinn/main/content/images/rainy_atmosphere_cinematic_rai.jpeg"
              alt="Rain outside a dark theatre"
            >

            <img
              class="scene-image scene-image-b"
              alt=""
              aria-hidden="true"
            >

          </div>

          <div class="scene-atmosphere"></div>

          <div class="narration-glass">

            <div class="narration-inner">

              <div class="narration-label">
                BEYOND THE CURTAIN
              </div>

              <div class="narration-window">
                <div class="narration-stream"></div>
              </div>

            </div>

          </div>

          <button
            class="scene-interaction"
            type="button"
            aria-label="Continue scene"
          ></button>

          <div class="scene-hint">
            <span class="hint-tap">Tap</span>
            <span class="hint-scroll">Scroll</span>
            <span class="hint-continue">to continue</span>
          </div>

        </div>

        <div class="scene-end">

          <div class="scene-end-line"></div>

          <div class="scene-end-label">
            SCENE 02 COMPLETE
          </div>

          <div class="scene-end-text">
            Something has changed.
          </div>

          <div class="scene-end-arrow">
            ↓
          </div>

        </div>

      </div>

    </section>


    <!-- =====================================================
         SCENE 03
         ===================================================== -->

    <section
      class="story-scene"
      data-scene="03"
      id="scene-03"
    >

      <div class="scene-phone">

        <div class="scene-stage">

          <div class="scene-visual">

            <img
              class="scene-image scene-image-a"
              src="https://raw.githubusercontent.com/Ceeqwinnempire/Ceeqwinn/main/content/images/characters/lexis/outfits/Lexis_Azunna_soft.jpg.jpeg"
              alt="Lexis"
            >

            <img
              class="scene-image scene-image-b"
              alt=""
              aria-hidden="true"
            >

          </div>

          <div class="scene-atmosphere"></div>

          <div class="narration-glass">

            <div class="narration-inner">

              <div class="narration-label">
                LEXIS
              </div>

              <div class="narration-window">
                <div class="narration-stream"></div>
              </div>

            </div>

          </div>

          <button
            class="scene-interaction"
            type="button"
            aria-label="Continue scene"
          ></button>

          <div class="scene-hint">
            <span class="hint-tap">Tap</span>
            <span class="hint-scroll">Scroll</span>
            <span class="hint-continue">to continue</span>
          </div>

        </div>

        <div class="scene-end">

          <div class="scene-end-line"></div>

          <div class="scene-end-label">
            THE EXPERIMENT ENDS
          </div>

          <div class="scene-end-text">
            The next scene would begin here.
          </div>

        </div>

      </div>

    </section>

  </main>

  <script src="CEEQWINNSceneMVP-v2.js"></script>

</body>
</html>
