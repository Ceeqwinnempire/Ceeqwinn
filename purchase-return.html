<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#160912">
<meta name="referrer" content="no-referrer">
<title>CEEQWINN — Your Purchases</title>
<style>
:root{color-scheme:light;--ruby:#8b1025;--magenta:#b52d68;--purple:#54266f;--gold:#c6a75e;--ink:#24171d;--muted:#74666d}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;padding:24px;display:grid;place-items:center;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:radial-gradient(circle at 10% 10%,rgba(181,45,104,.16),transparent 30%),linear-gradient(135deg,#fbf8f5,#f4edf0 55%,#f8f5f2)}
main{width:min(620px,100%);padding:clamp(24px,5vw,42px);border:1px solid rgba(255,255,255,.85);border-radius:26px;background:rgba(255,250,247,.94);box-shadow:0 18px 45px rgba(32,8,18,.14)}
.brand{text-align:center;color:var(--muted);letter-spacing:4px;font-size:11px;font-weight:800}
h1{text-align:center;font:500 clamp(34px,8vw,48px)/1.05 Georgia,serif;margin:12px 0}
h1 span{display:block;color:var(--ruby)}
.intro{text-align:center;color:var(--muted);line-height:1.7;margin:16px auto 24px;max-width:440px}
.status{padding:14px 16px;border-radius:15px;background:#f4edf0;color:var(--muted);line-height:1.6;font-size:14px;margin:18px 0}
.status.success{color:#17624d;background:#eaf4ef}
.status.error{color:#9b1c31;background:#f9e9ed}
.purchase{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:16px 0;border-top:1px solid #eadde1}
.purchase h2{font-size:16px;margin:0 0 5px}
.purchase p{margin:0;color:var(--muted);font-size:13px}
button{border:0;border-radius:999px;padding:12px 18px;color:white;background:linear-gradient(110deg,var(--ruby),var(--magenta),var(--purple));font-weight:800;cursor:pointer}
button:disabled{opacity:.55;cursor:wait}
.footer{text-align:center;color:#93858b;font-size:11px;margin-top:24px}
@media(max-width:460px){body{padding:14px}.purchase{align-items:flex-start;flex-direction:column}.purchase button{width:100%}}
</style>
</head>
<body>
<main>
<div class="brand">CEEQWINN</div>
<h1>Your Treasure <span>Awaits</span></h1>
<p class="intro">Your purchases are kept safely in your CEEQWINN account. You can claim them now or leave them waiting until you're ready.</p>
<div id="status" class="status" role="status" aria-live="polite">Checking your CEEQWINN purchases…</div>
<section id="purchases" aria-label="Unclaimed purchases"></section>
<div class="footer">CEEQWINN Game Store · Your purchases remain yours until claimed</div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
"use strict";
const SUPABASE_URL="https://iwuambqesluciawsgyww.supabase.co";
const SUPABASE_PUBLISHABLE_KEY="sb_publishable_Cf4ctw1m5RTNUHQ5mfsidQ_zG6WuGdx";
const client=supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY,{
  auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}
});
const statusElement=document.getElementById("status");
const purchasesElement=document.getElementById("purchases");
function setStatus(message,type=""){
  statusElement.textContent=message;
  statusElement.className="status "+type;
}
function makeText(tag,className,text){
  const element=document.createElement(tag);
  if(className) element.className=className;
  element.textContent=text;
  return element;
}
async function loadUnclaimedPurchases(){
  const {data,error}=await client
    .from("purchase_entitlements")
    .select("id,product_name,diamonds,created_at")
    .eq("status","unclaimed")
    .order("created_at",{ascending:true});
  if(error) throw error;
  purchasesElement.replaceChildren();
  if(!data || data.length===0){
    purchasesElement.append(makeText("p","intro","There are no unclaimed purchases waiting right now."));
    return 0;
  }
  data.forEach((purchase)=>{
    const row=document.createElement("article");
    row.className="purchase";
    const details=document.createElement("div");
    details.append(
      makeText("h2","",purchase.product_name || "CEEQWINN purchase"),
      makeText("p","",String(purchase.diamonds)+" diamonds · Waiting to be claimed")
    );
    const button=makeText("button","","Claim purchase");
    button.type="button";
    button.addEventListener("click",async()=>{
      button.disabled=true;
      button.textContent="Claiming…";
      try{
        const {data:result,error:claimError}=await client.rpc(
          "claim_purchase_entitlement",
          {p_entitlement_id:purchase.id}
        );
        if(claimError) throw claimError;
        if(result?.status==="completed"){
          setStatus(String(result.diamonds)+" diamonds have been added to your wallet.", "success");
        }else if(result?.status==="already_claimed"){
          setStatus("This purchase was already claimed. It was not credited twice.","success");
        }else{
          throw new Error("The claim could not be completed.");
        }
        await loadUnclaimedPurchases();
      }catch(error){
        button.disabled=false;
        button.textContent="Claim purchase";
        setStatus("We couldn't claim this purchase: "+(error.message || "Please try again."),"error");
      }
    });
    row.append(details,button);
    purchasesElement.append(row);
  });
  return data.length;
}
async function initialize(){
  const pageUrl=new URL(window.location.href);
  const returnToken=pageUrl.searchParams.get("token");
  if(returnToken){
    pageUrl.searchParams.delete("token");
    window.history.replaceState(null,"",pageUrl.pathname+pageUrl.search+pageUrl.hash);
  }
  const {data:sessionData,error:sessionError}=await client.auth.getSession();
  if(sessionError) throw sessionError;
  if(!sessionData.session){
    setStatus("This purchase belongs to the guest session used when checkout began. Please reopen this page in the same browser where you started the purchase, or sign in if you have already linked an account.","error");
    return;
  }
  if(returnToken){
    setStatus("Confirming your Selar return and saving your purchase…");
    const {data,error}=await client.functions.invoke("sequence-selar-return",{
      body:{return_token:returnToken}
    });
    if(error || !data?.ok){
      throw new Error(data?.error || error?.message || "The return could not be confirmed.");
    }
    setStatus("Your purchase is safely saved. You can claim it now or leave it waiting.","success");
  }
  const count=await loadUnclaimedPurchases();
  if(!returnToken && count>0){
    setStatus("You have "+count+" unclaimed purchase"+(count===1?"":"s")+". Claim whenever you're ready.","success");
  }else if(count===0 && !returnToken){
    setStatus("Your CEEQWINN purchase list is up to date.");
  }
}
initialize().catch((error)=>{
  console.error("CEEQWINN purchase return:",error);
  setStatus("We couldn't load your purchases: "+(error.message || "Please try again."),"error");
});
</script>
</body>
</html>
