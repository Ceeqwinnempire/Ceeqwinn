<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CEEQWINN Reader</title>

<style>

/* =========================================================
   01 — BASIC READER
   ========================================================= */

body{
    max-width:800px;
    margin:auto;
    padding:35px 18px;
    font-family:Arial,sans-serif;
    line-height:1.8;
    background:#fafafa;
    color:#222;
}

h1{
    font-size:2.2rem;
    margin-bottom:20px;
}

h2{
    margin-top:35px;
}

#cover{
    display:none;
    max-width:100%;
    height:auto;
    margin:0 auto 30px;
    border-radius:12px;
}

#credits{
    color:#666;
    margin-bottom:25px;
}

#status{
    color:#777;
}

#content{
    overflow-wrap:break-word;
}

#content img{
    display:block;
    max-width:100%;
    height:auto;
    margin:25px auto;
    border-radius:12px;
}

#content video,
#content audio{
    display:block;
    width:100%;
    max-width:100%;
    margin:25px auto;
}

#content blockquote{
    margin:25px 0;
    padding:10px 18px;
    border-left:4px solid #999;
    background:#f0f0f0;
}

#content table{
    width:100%;
    border-collapse:collapse;
    margin:25px 0;
}

#content th,
#content td{
    padding:8px;
    border:1px solid #ccc;
}


/* =========================================================
   02 — STORY ENGINE
   ========================================================= */

.story-choice{
    margin:45px 0;
    padding:20px 0;
}

.story-choice-title{
    font-weight:bold;
    font-size:1.1rem;
    margin-bottom:15px;
}

.story-choice-button{
    display:block;
    width:100%;
    box-sizing:border-box;
    margin:10px 0;
    padding:15px;
    font:16px Arial,sans-serif;
    text-align:left;
    background:#fff;
    color:#222;
    border:1px solid #ccc;
    border-radius:8px;
    cursor:pointer;
}

.story-choice-button:hover{
    background:#f2f2f2;
}

.story-choice-button:disabled{
    cursor:default;
    opacity:.7;
}

.story-hidden{
    display:none !important;
}

.story-branch{
    margin-top:25px;
}

.story-continuation{
    margin-top:25px;
}


/* =========================================================
   03 — STORY CONTINUATION
   ========================================================= */

.story-next{
    margin:55px 0 25px;
    padding:25px 0;
    text-align:center;
}

.story-next-text{
    margin-bottom:18px;
    color:#555;
    font-size:1rem;
}

.story-next-button{
    display:inline-block;
    padding:14px 22px;
    font:16px Arial,sans-serif;
    background:#222;
    color:#fff;
    border:none;
    border-radius:8px;
    cursor:pointer;
}

.story-next-button:hover{
    opacity:.85;
}


/* =========================================================
   04 — RESET
   ========================================================= */

#storyReset{
    display:none;
    width:100%;
    margin:35px 0;
    padding:12px;
    background:#f7f7f7;
    color:#555;
    border:1px dashed #aaa;
    border-radius:8px;
    cursor:pointer;
}

#storyReset:hover{
    background:#eeeeee;
}


/* =========================================================
   05 — LOW-SPEC DEVICES
   ========================================================= */

@media(max-width:600px){

    body{
        padding:25px 15px;
    }

    h1{
        font-size:1.8rem;
    }

    .story-choice-button{
        font-size:16px;
        padding:15px;
    }

    .story-next-button{
        width:100%;
        box-sizing:border-box;
    }

}

</style>

</head>


<body>

<img id="cover" alt="">

<h1 id="title">Loading...</h1>

<div id="credits"></div>

<div id="status"></div>

<div id="content"></div>

<button id="storyReset" type="button">
    ↺ Reset Story
</button>

<div id="media"></div>


<!-- =======================================================
     06 — MARKDOWN
     ======================================================= -->

<script src="https://cdn.jsdelivr.net/npm/marked@0.3.19/marked.min.js"></script>


<script>

/* =========================================================
   07 — BASIC SETUP
   ========================================================= */

var title =
    document.getElementById("title");

var credits =
    document.getElementById("credits");

var status =
    document.getElementById("status");

var content =
    document.getElementById("content");

var cover =
    document.getElementById("cover");

var media =
    document.getElementById("media");

var reset =
    document.getElementById("storyReset");


/* =========================================================
   08 — GET ARTICLE NAME
   ========================================================= */

var params =
    new URLSearchParams(
        window.location.search
    );

var file =
    params.get("file") || "";

file =
    cleanPath(file);


/* =========================================================
   09 — STORY-WIDE IDENTITY
   =========================================================

   All chapters belonging to the same story share
   ONE choice history.

   Examples:

   discordant-descendants
   discordant-descendants-chapter-2
   discordant-descendants-chapter-3

   all become:

   discordant-descendants
   ========================================================= */

var storyId =
    getStoryId(file);


/* =========================================================
   10 — STORY-WIDE STORAGE
   ========================================================= */

var storageKey =
    "ceeqwinn_story_history_" +
    storyId;


/* =========================================================
   11 — START
   ========================================================= */

if(!file){

    title.textContent =
        "Article not found";

    status.textContent =
        "No article was selected.";

}else{

    loadStory();

}


/* =========================================================
   12 — LOAD MARKDOWN
   ========================================================= */

function loadStory(){

    status.textContent =
        "Loading...";

    content.innerHTML = "";

    media.innerHTML = "";

    cover.style.display = "none";

    var xhr =
        new XMLHttpRequest();

    xhr.open(
        "GET",
        "../content/articles/" +
        encodeURIComponent(file) +
        ".md",
        true
    );

    xhr.onload = function(){

        if(
            xhr.status !== 200 &&
            xhr.status !== 0
        ){

            title.textContent =
                "Unable to load article";

            status.textContent =
                "The article could not be loaded.";

            return;

        }

        buildStory(
            xhr.responseText
        );

    };

    xhr.onerror = function(){

        title.textContent =
            "Unable to load article";

        status.textContent =
            "The article could not be loaded.";

    };

    xhr.send();

}


/* =========================================================
   13 — BUILD STORY
   ========================================================= */

function buildStory(text){

    var data =
        parseFrontmatter(text);


    /* ---------------------------------------------
       TITLE
       --------------------------------------------- */

    title.textContent =
        data.title || file;


    /* ---------------------------------------------
       CREDITS
       --------------------------------------------- */

    credits.innerHTML =
        data.credits
        ? "<strong>Credits:</strong> " +
          escapeHtml(data.credits)
        : "";


    /* ---------------------------------------------
       COVER
       --------------------------------------------- */

    if(data.cover){

        cover.src =
            mediaPath(data.cover);

        cover.alt =
            data.title || file;

        cover.style.display =
            "block";

        cover.onerror = function(){

            cover.style.display =
                "none";

        };

    }


    /* ---------------------------------------------
       STORY RENDERING
       --------------------------------------------- */

    content.innerHTML =
        renderStory(data.body);


    /* ---------------------------------------------
       INLINE MEDIA
       --------------------------------------------- */

    fixMedia();


    /* ---------------------------------------------
       CHOICES
       --------------------------------------------- */

    if(hasChoices()){

        reset.style.display =
            "block";

        activateChoices();

        restoreChoices();

    }else{

        reset.style.display =
            "none";

    }


    /* ---------------------------------------------
       EXTRA FRONTMATTER MEDIA
       --------------------------------------------- */

    renderExtraMedia(data);


    status.textContent = "";

}


/* =========================================================
   14 — FRONTMATTER
   ========================================================= */

function parseFrontmatter(text){

    var data = {

        title:"",
        cover:"",
        credits:"",
        video:"",
        audio:"",
        body:text

    };


    var match =
        text.match(
            /^---\s*\n([\s\S]*?)\n---\s*\n?/
        );


    if(!match){

        return data;

    }


    var front =
        match[1];


    data.body =
        text.substring(
            match[0].length
        );


    data.title =
        frontValue(
            front,
            "title"
        );

    data.cover =
        frontValue(
            front,
            "cover"
        );

    data.credits =
        frontValue(
            front,
            "credits"
        );

    data.video =
        frontValue(
            front,
            "video"
        );

    data.audio =
        frontValue(
            front,
            "audio"
        );


    return data;

}


/* =========================================================
   15 — FRONTMATTER VALUE
   ========================================================= */

function frontValue(
    text,
    key
){

    var re =
        new RegExp(
            "^" +
            key +
            "\\s*:\\s*[\"']?(.*?)[\"']?$",
            "m"
        );

    var match =
        text.match(re);


    return match
        ? match[1].trim()
        : "";

}


/* =========================================================
   16 — STORY RENDERER
   =========================================================

   Understands:

   [CHOICE:id]

   [A] Option
   [B] Option
   [C] Option

   [CONSEQUENCE:A]

   Story...

   [ENDCHOICE]

   [NEXT:story-slug]

   [IF:choice-01=A]

   Story that appears only when
   the reader previously chose A.

   [ENDIF]
   ========================================================= */

function renderStory(text){

    var lines =
        text.split(/\r?\n/);

    return renderFlow(
        lines
    );

}


/* =========================================================
   17 — RENDER FLOW
   ========================================================= */

function renderFlow(lines){

    var output = "";

    var normal = [];

    var i = 0;


    while(i < lines.length){

        /* -----------------------------------------
           CONDITIONAL STORY
           ----------------------------------------- */

        if(isIfMarker(lines[i])){

            if(normal.length){

                output +=
                    marked(
                        normal.join("\n")
                    );

                normal = [];

            }


            var conditionalResult =
                parseConditional(
                    lines,
                    i
                );


            output +=
                conditionalResult.html;


            i =
                conditionalResult.next;


            continue;

        }


        /* -----------------------------------------
           CHOICE
           ----------------------------------------- */

        if(isChoiceStart(lines[i])){

            if(normal.length){

                output +=
                    marked(
                        normal.join("\n")
                    );

                normal = [];

            }


            var choiceResult =
                parseChoice(
                    lines,
                    i
                );


            output +=
                choiceResult.html;


            i =
                choiceResult.next;


            continue;

        }


        /* -----------------------------------------
           NEXT CHAPTER
           ----------------------------------------- */

        if(isNextMarker(lines[i])){

            if(normal.length){

                output +=
                    marked(
                        normal.join("\n")
                    );

                normal = [];

            }


            output +=
                renderNext(
                    lines[i]
                );


            i++;

            continue;

        }


        /* -----------------------------------------
           ENDIF
           ----------------------------------------- */

        if(isEndIfMarker(lines[i])){

            i++;

            continue;

        }


        /* -----------------------------------------
           NORMAL STORY
           ----------------------------------------- */

        normal.push(
            lines[i]
        );

        i++;

    }


    /* ---------------------------------------------
       REMAINING NORMAL STORY
       --------------------------------------------- */

    if(normal.length){

        output +=
            marked(
                normal.join("\n")
            );

    }


    return output;

}


/* =========================================================
   18 — CHOICE START
   ========================================================= */

function isChoiceStart(line){

    return /^\s*\*?\s*\[CHOICE:[\w-]+\]\s*$/.test(
        line
    );

}


/* =========================================================
   19 — NEXT MARKER
   ========================================================= */

function isNextMarker(line){

    return /^\s*\*?\s*\[NEXT:[^\]]+\]\s*$/.test(
        line
    );

}


/* =========================================================
   20 — IF MARKER
   ========================================================= */

function isIfMarker(line){

    return /^\s*\*?\s*\[IF:[\w-]+=[A-Z]\]\s*$/.test(
        line
    );

}


/* =========================================================
   21 — ENDIF MARKER
   ========================================================= */

function isEndIfMarker(line){

    return /^\s*\*?\s*\[ENDIF\]\s*$/.test(
        line
    );

}


/* =========================================================
   22 — PARSE CONDITIONAL
   =========================================================

   Example:

   [IF:choice-01=A]

   Lexis took the envelope.

   [ENDIF]

   The block is rendered only if the stored
   choice matches.
   ========================================================= */

function parseConditional(
    lines,
    start
){

    var match =
        lines[start].match(
            /^\s*\*?\s*\[IF:([\w-]+)=([A-Z])\]\s*$/
        );


    if(!match){

        return {

            html:"",
            next:start + 1

        };

    }


    var choiceId =
        match[1];


    var requiredLetter =
        match[2];


    var innerLines = [];

    var i =
        start + 1;


    while(i < lines.length){

        if(
            isEndIfMarker(
                lines[i]
            )
        ){

            i++;

            break;

        }


        innerLines.push(
            lines[i]
        );


        i++;

    }


    var choices =
        getChoices();


    var selected =
        choices[choiceId] || "";


    if(
        selected !== requiredLetter
    ){

        return {

            html:"",
            next:i

        };

    }


    return {

        html:
            renderFlow(
                innerLines
            ),

        next:i

    };

}


/* =========================================================
   23 — PARSE CHOICE
   ========================================================= */

function parseChoice(
    lines,
    start
){

    var match =
        lines[start].match(
            /^\s*\*?\s*\[CHOICE:([\w-]+)\]\s*$/
        );


    var id =
        match[1];


    var options = [];

    var branches = [];

    var current = null;

    var i =
        start + 1;


    while(i < lines.length){

        var line =
            lines[i];


        /* -----------------------------------------
           END CHOICE
           ----------------------------------------- */

        if(
            /^\s*\*?\s*\[ENDCHOICE\]\s*$/.test(
                line
            )
        ){

            i++;

            break;

        }


        /* -----------------------------------------
           OPTION
           ----------------------------------------- */

        var option =
            line.match(
                /^\s*\*?\s*\[([A-Z])\]\s*(.+?)\s*$/
            );


        if(
            option &&
            !current
        ){

            options.push({

                letter:
                    option[1],

                label:
                    option[2]

            });


            i++;

            continue;

        }


        /* -----------------------------------------
           CONSEQUENCE
           ----------------------------------------- */

        var consequence =
            line.match(
                /^\s*\*?\s*\[CONSEQUENCE:([A-Z])\]\s*$/
            );


        if(consequence){

            current = {

                letter:
                    consequence[1],

                lines:[]

            };


            branches.push(
                current
            );


            i++;

            continue;

        }


        /* -----------------------------------------
           BRANCH CONTENT
           ----------------------------------------- */

        if(current){

            current.lines.push(
                line
            );

        }


        i++;

    }


    /* =====================================================
       EVERYTHING AFTER THIS CHOICE
       ===================================================== */

    var continuationLines =
        lines.slice(i);


    var continuationHTML = "";


    if(continuationLines.length){

        continuationHTML =
            renderFlow(
                continuationLines
            );

    }


    /* =====================================================
       CHOICE HTML
       ===================================================== */

    var html =

        '<div class="story-choice" ' +
        'data-choice="' +
        escapeAttr(id) +
        '">' +

        '<div class="story-choice-title">' +
        'What do you do?' +
        '</div>';


    for(
        var j = 0;
        j < options.length;
        j++
    ){

        html +=

            '<button ' +
            'type="button" ' +
            'class="story-choice-button" ' +
            'data-choice="' +
            escapeAttr(id) +
            '" ' +
            'data-letter="' +
            escapeAttr(
                options[j].letter
            ) +
            '">' +

            escapeHtml(
                options[j].letter +
                " — " +
                options[j].label
            ) +

            '</button>';

    }


    html +=
        '</div>';


    /* =====================================================
       CONSEQUENCE BRANCHES
       ===================================================== */

    for(
        var k = 0;
        k < branches.length;
        k++
    ){

        var branch =
            branches[k];


        html +=

            '<div ' +
            'class="story-branch story-hidden" ' +
            'data-choice="' +
            escapeAttr(id) +
            '" ' +
            'data-letter="' +
            escapeAttr(
                branch.letter
            ) +
            '">' +

            renderFlow(
                branch.lines
            ) +

            '</div>';

    }


    /* =====================================================
       CONTINUATION
       ===================================================== */

    if(continuationHTML){

        html +=

            '<div ' +
            'class="story-continuation story-hidden" ' +
            'data-after-choice="' +
            escapeAttr(id) +
            '">' +

            continuationHTML +

            '</div>';

    }


    return {

        html:
            html,

        next:
            lines.length

    };

}


/* =========================================================
   24 — ACTIVATE CHOICE BUTTONS
   ========================================================= */

function activateChoices(){

    var buttons =
        content.getElementsByClassName(
            "story-choice-button"
        );


    for(
        var i = 0;
        i < buttons.length;
        i++
    ){

        buttons[i].onclick =
            function(){

                var id =
                    this.getAttribute(
                        "data-choice"
                    );

                var letter =
                    this.getAttribute(
                        "data-letter"
                    );


                choose(
                    id,
                    letter
                );

            };

    }

}


/* =========================================================
   25 — MAKE CHOICE
   ========================================================= */

function choose(
    id,
    letter
){

    saveChoice(
        id,
        letter
    );


    showBranch(
        id,
        letter
    );


    revealContinuation(
        id
    );

}


/* =========================================================
   26 — SAVE CHOICE
   =========================================================

   IMPORTANT:

   This now saves to the STORY-WIDE history.

   Chapter 1, Chapter 2, Chapter 3...
   all use the same history.
   ========================================================= */

function saveChoice(
    id,
    letter
){

    var choices =
        getChoices();


    choices[id] =
        letter;


    try{

        localStorage.setItem(
            storageKey,
            JSON.stringify(
                choices
            )
        );

    }catch(e){}

}


/* =========================================================
   27 — GET SAVED CHOICES
   ========================================================= */

function getChoices(){

    try{

        var saved =
            localStorage.getItem(
                storageKey
            );


        return saved
            ? JSON.parse(saved)
            : {};

    }catch(e){

        return {};

    }

}


/* =========================================================
   28 — SHOW SELECTED CONSEQUENCE
   ========================================================= */

function showBranch(
    id,
    letter
){

    var choices =
        content.getElementsByClassName(
            "story-choice"
        );


    var branches =
        content.getElementsByClassName(
            "story-branch"
        );


    var i;


    /* ---------------------------------------------
       Hide the choice buttons
       --------------------------------------------- */

    for(
        i = 0;
        i < choices.length;
        i++
    ){

        if(
            choices[i].getAttribute(
                "data-choice"
            ) === id
        ){

            choices[i].style.display =
                "none";

        }

    }


    /* ---------------------------------------------
       Hide every branch belonging to this choice
       --------------------------------------------- */

    for(
        i = 0;
        i < branches.length;
        i++
    ){

        if(
            branches[i].getAttribute(
                "data-choice"
            ) === id
        ){

            branches[i].className =
                "story-branch story-hidden";

        }

    }


    /* ---------------------------------------------
       Show selected branch
       --------------------------------------------- */

    for(
        i = 0;
        i < branches.length;
        i++
    ){

        if(

            branches[i].getAttribute(
                "data-choice"
            ) === id

            &&

            branches[i].getAttribute(
                "data-letter"
            ) === letter

        ){

            branches[i].className =
                "story-branch";

        }

    }

}


/* =========================================================
   29 — REVEAL CONTINUATION
   ========================================================= */

function revealContinuation(id){

    var continuations =
        content.getElementsByClassName(
            "story-continuation"
        );


    for(
        var i = 0;
        i < continuations.length;
        i++
    ){

        if(
            continuations[i].getAttribute(
                "data-after-choice"
            ) === id
        ){

            continuations[i].className =
                "story-continuation";

        }

    }

}


/* =========================================================
   30 — RESTORE SAVED STORY
   ========================================================= */

function restoreChoices(){

    var choices =
        getChoices();


    var changed = true;

    var safety = 0;


    while(
        changed &&
        safety < 20
    ){

        changed = false;

        safety++;


        for(
            var id in choices
        ){

            if(
                choices.hasOwnProperty(id)
            ){

                var before =
                    countVisibleStoryParts();


                showBranch(
                    id,
                    choices[id]
                );


                revealContinuation(
                    id
                );


                var after =
                    countVisibleStoryParts();


                if(after !== before){

                    changed = true;

                }

            }

        }

    }

}


/* =========================================================
   31 — COUNT VISIBLE STORY PARTS
   ========================================================= */

function countVisibleStoryParts(){

    var visible =
        content.querySelectorAll(
            ".story-branch:not(.story-hidden), " +
            ".story-continuation:not(.story-hidden)"
        );


    return visible.length;

}


/* =========================================================
   32 — DOES STORY HAVE CHOICES?
   ========================================================= */

function hasChoices(){

    return (
        content.getElementsByClassName(
            "story-choice"
        ).length > 0
    );

}


/* =========================================================
   33 — RESET ENTIRE STORY
   =========================================================

   IMPORTANT:

   Resetting Chapter 2 now resets the WHOLE
   Discordant Descendants choice history.
   ========================================================= */

reset.onclick =
    function(){

        try{

            localStorage.removeItem(
                storageKey
            );

        }catch(e){}


        loadStory();


        window.scrollTo(
            0,
            0
        );

    };


/* =========================================================
   34 — NEXT CHAPTER RENDERER
   =========================================================

   Supported:

   [NEXT:discordant-descendants-chapter-2]

   OR:

   [NEXT:discordant-descendants-chapter-2|The door opened.]

   The second part becomes the button text.

   Example:

   [NEXT:discordant-descendants-chapter-2|The envelope had only begun to speak.]

   ========================================================= */

function renderNext(line){

    var match =
        line.match(
            /^\s*\*?\s*\[NEXT:([^\]|]+)(?:\|([^\]]+))?\]\s*$/
        );


    if(!match){

        return "";

    }


    var nextFile =
        cleanPath(
            match[1]
        );


    nextFile =
        nextFile.replace(
            /\.md$/i,
            ""
        );


    var label =
        match[2]
        ? match[2].trim()
        : "Enter the next chapter";


    return '<div class="story-next">' +

        '<div class="story-next-text">' +
        'The story continues...' +
        '</div>' +

        '<button ' +
        'type="button" ' +
        'class="story-next-button" ' +
        'data-next="' +
        escapeAttr(nextFile) +
        '">' +

        escapeHtml(label) +

        '</button>' +

        '</div>';

}


/* =========================================================
   35 — ACTIVATE NEXT CHAPTER BUTTONS
   ========================================================= */

document.addEventListener(
    "click",
    function(event){

        var target =
            event.target;


        if(
            !target.classList.contains(
                "story-next-button"
            )
        ){

            return;

        }


        var nextFile =
            target.getAttribute(
                "data-next"
            );


        if(!nextFile){

            return;

        }


        nextFile =
            cleanPath(
                nextFile
            );


        nextFile =
            nextFile.replace(
                /\.md$/i,
                ""
            );


        window.location.href =
            "article.html?file=" +
            encodeURIComponent(
                nextFile
            );

    }
);


/* =========================================================
   36 — STORY ID
   =========================================================

   Converts:

   discordant-descendants
   discordant-descendants-chapter-2
   discordant-descendants-chapter-3

   into:

   discordant-descendants

   This is what makes all chapters share
   one history.
   ========================================================= */

function getStoryId(path){

    path =
        String(path);


    /*
       Remove .md if present.
    */

    path =
        path.replace(
            /\.md$/i,
            ""
        );


    /*
       Remove chapter numbering.

       Examples:

       -chapter-2
       -chapter-3
       -chapter-10
    */

    path =
        path.replace(
            /-chapter-\d+$/i,
            ""
        );


    return path;

}


/* =========================================================
   37 — MEDIA PATH
   ========================================================= */

function mediaPath(src){

    if(!src){

        return "";

    }


    src =
        src.trim();


    /* ---------------------------------------------
       External / absolute paths
       --------------------------------------------- */

    if(

        /^https?:\/\//i.test(src)

        ||

        /^data:/i.test(src)

        ||

        src.charAt(0) === "/"

    ){

        return src;

    }


    /* ---------------------------------------------
       Remove leading relative markers
       --------------------------------------------- */

    while(
        src.indexOf("../") === 0
    ){

        src =
            src.substring(3);

    }


    while(
        src.indexOf("./") === 0
    ){

        src =
            src.substring(2);

    }


    /* ---------------------------------------------
       Already points into content
       --------------------------------------------- */

    if(
        src.indexOf("content/") === 0
    ){

        return "/" + src;

    }


    /* ---------------------------------------------
       Default image location
       --------------------------------------------- */

    return "/content/images/" + src;

}


/* =========================================================
   38 — FIX INLINE MEDIA
   ========================================================= */

function fixMedia(){

    var images =
        content.getElementsByTagName(
            "img"
        );


    var videos =
        content.getElementsByTagName(
            "video"
        );


    var audios =
        content.getElementsByTagName(
            "audio"
        );


    var i;


    /* ---------------------------------------------
       IMAGES
       --------------------------------------------- */

    for(
        i = 0;
        i < images.length;
        i++
    ){

        var imageSrc =
            images[i].getAttribute(
                "src"
            );


        if(imageSrc){

            images[i].src =
                mediaPath(
                    imageSrc
                );

        }


        images[i].setAttribute(
            "loading",
            "lazy"
        );

    }


    /* ---------------------------------------------
       VIDEO
       --------------------------------------------- */

    for(
        i = 0;
        i < videos.length;
        i++
    ){

        var videoSrc =
            videos[i].getAttribute(
                "src"
            );


        if(videoSrc){

            videos[i].src =
                mediaPath(
                    videoSrc
                );

        }


        videos[i].controls =
            true;

    }


    /* ---------------------------------------------
       AUDIO
       --------------------------------------------- */

    for(
        i = 0;
        i < audios.length;
        i++
    ){

        var audioSrc =
            audios[i].getAttribute(
                "src"
            );


        if(audioSrc){

            audios[i].src =
                mediaPath(
                    audioSrc
                );

        }


        audios[i].controls =
            true;

    }

}


/* =========================================================
   39 — EXTRA MEDIA FROM FRONTMATTER
   ========================================================= */

function renderExtraMedia(data){

    var html = "";


    if(data.video){

        html +=

            '<h2>Video</h2>' +

            '<video ' +
            'controls ' +
            'preload="metadata">' +

            '<source src="' +
            escapeAttr(
                mediaPath(
                    data.video
                )
            ) +
            '">' +

            '</video>';

    }


    if(data.audio){

        html +=

            '<h2>Audio</h2>' +

            '<audio ' +
            'controls ' +
            'preload="metadata">' +

            '<source src="' +
            escapeAttr(
                mediaPath(
                    data.audio
                )
            ) +
            '">' +

            '</audio>';

    }


    media.innerHTML =
        html;

}


/* =========================================================
   40 — PATH CLEANING
   ========================================================= */

function cleanPath(path){

    path =
        String(path)
        .replace(/\\/g,"/")
        .replace(/^\/+/,"");


    var parts =
        path.split("/");


    var clean = [];


    for(
        var i = 0;
        i < parts.length;
        i++
    ){

        if(

            parts[i]

            &&

            parts[i] !== "."

            &&

            parts[i] !== ".."

        ){

            clean.push(
                parts[i]
            );

        }

    }


    return clean.join("/");

}


/* =========================================================
   41 — ESCAPE HTML
   ========================================================= */

function escapeHtml(value){

    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#39;"
        );

}


/* =========================================================
   42 — ESCAPE ATTRIBUTE
   ========================================================= */

function escapeAttr(value){

    return escapeHtml(
        value
    );

}
