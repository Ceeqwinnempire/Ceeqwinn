
<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CEEQWINN Reader</title>

<style>

body{
    max-width:800px;
    margin:auto;
    padding:35px 18px;
    font-family:Arial,sans-serif;
    line-height:1.8;
    background:#fafafa;
    color:#222;
}

h1{
    font-size:2.2rem;
    margin-bottom:20px;
}

h2{
    margin-top:35px;
}

#cover{
    display:none;
    max-width:100%;
    height:auto;
    margin:0 auto 30px;
    border-radius:12px;
}

#credits{
    color:#666;
    margin-bottom:25px;
}

#status{
    color:#777;
}

#content{
    overflow-wrap:break-word;
}

#content img{
    display:block;
    max-width:100%;
    height:auto;
    margin:25px auto;
    border-radius:12px;
}

#content video,
#content audio{
    display:block;
    width:100%;
    max-width:100%;
    margin:25px auto;
}

#content blockquote{
    margin:25px 0;
    padding:10px 18px;
    border-left:4px solid #999;
    background:#f0f0f0;
}

#content table{
    width:100%;
    border-collapse:collapse;
    margin:25px 0;
}

#content th,
#content td{
    padding:8px;
    border:1px solid #ccc;
}


/* =========================================================
   STORY ENGINE
   ========================================================= */

.story-choice{
    margin:45px 0;
    padding:20px 0;
}

.story-choice-title{
    font-weight:bold;
    font-size:1.1rem;
    margin-bottom:15px;
}

.story-choice-button{
    display:block;
    width:100%;
    box-sizing:border-box;
    margin:10px 0;
    padding:15px;
    font:16px Arial,sans-serif;
    text-align:left;
    background:#fff;
    color:#222;
    border:1px solid #ccc;
    border-radius:8px;
    cursor:pointer;
}

.story-choice-button:hover{
    background:#f2f2f2;
}

.story-choice-button:disabled{
    cursor:default;
    opacity:.7;
}

.story-branch{
    margin-top:25px;
}

.story-choice-result{
    margin-top:25px;
}

.story-resume-anchor{
    display:block;
    width:100%;
    height:1px;
    margin:0;
    padding:0;
}


/* =========================================================
   INLINE THEATRE — V3
   ========================================================= */

.story-theatre{
    display:block;
    width:100%;
    box-sizing:border-box;
    margin:32px 0;
    overflow-wrap:anywhere;
}

.story-theatre img{
    max-width:100%;
    height:auto;
}

.story-theatre video,
.story-theatre audio{
    max-width:100%;
}

.story-theatre [data-theatre-mode]{
    max-width:100%;
}


/* =========================================================
   NEXT CHAPTER
   ========================================================= */

.story-next{
    margin:55px 0 25px;
    padding:25px 0;
    text-align:center;
}

.story-next-text{
    margin-bottom:18px;
    color:#555;
    font-size:1rem;
}

.story-next-button{
    display:inline-block;
    padding:14px 22px;
    font:16px Arial,sans-serif;
    background:#222;
    color:#fff;
    border:none;
    border-radius:8px;
    cursor:pointer;
}

.story-next-button:hover{
    opacity:.85;
}


/* =========================================================
   GAME BRIDGE
   ========================================================= */

.story-game{
    margin:45px 0;
    padding:25px 0;
    text-align:center;
}

.story-game-title{
    font-weight:bold;
    font-size:1.15rem;
    margin-bottom:10px;
}

.story-game-text{
    color:#666;
    margin-bottom:18px;
}

.story-game-button{
    display:inline-block;
    padding:15px 24px;
    font:16px Arial,sans-serif;
    background:#222;
    color:#fff;
    border:none;
    border-radius:8px;
    cursor:pointer;
}

.story-game-button:hover{
    opacity:.85;
}

.story-game-complete{
    margin:30px 0;
    padding:15px;
    text-align:center;
    color:#666;
}


/* =========================================================
   SHOW OUTFIT
   ========================================================= */

.story-outfit{
    margin:35px 0;
    text-align:center;
}

.story-outfit img{
    display:block;
    width:100%;
    max-width:420px;
    height:auto;
    margin:0 auto;
    border-radius:12px;
}


/* =========================================================
   RESET
   ========================================================= */

#storyReset{
    display:none;
    width:100%;
    margin:35px 0;
    padding:12px;
    background:#f7f7f7;
    color:#555;
    border:1px dashed #aaa;
    border-radius:8px;
    cursor:pointer;
}

#storyReset:hover{
    background:#eeeeee;
}


/* =========================================================
   MOBILE
   ========================================================= */

@media(max-width:600px){

    body{
        padding:25px 15px;
    }

    h1{
        font-size:1.8rem;
    }

    .story-choice-button{
        font-size:16px;
        padding:15px;
    }

    .story-next-button{
        width:100%;
        box-sizing:border-box;
    }

    .story-game-button{
        width:100%;
        box-sizing:border-box;
    }

}

</style>

</head>


<body>

<img id="cover" alt="">

<h1 id="title">Loading...</h1>

<div id="credits"></div>

<div id="status"></div>

<div id="content"></div>

<button id="storyReset" type="button">
    ↺ Reset Story
</button>

<div id="media"></div>


<script src="https://cdn.jsdelivr.net/npm/marked@0.3.19/marked.min.js"></script>

<!-- INLINE THEATRE V3: paths are relative to admin/article.html -->
<script src="../theater-inline-v3/narration-engine-v3/ceeqwinn-narration-view-v3.js"></script>
<script src="../theater-inline-v3/ceeqwinn-theatre-loader-v3.js"></script>


<script>

/* =========================================================
   BASIC ELEMENTS
   ========================================================= */

var title =
    document.getElementById("title");

var credits =
    document.getElementById("credits");

var status =
    document.getElementById("status");

var content =
    document.getElementById("content");

var cover =
    document.getElementById("cover");

var media =
    document.getElementById("media");

var reset =
    document.getElementById("storyReset");


/* =========================================================
   ARTICLE FILE
   ========================================================= */

var params =
    new URLSearchParams(
        window.location.search
    );

var file =
    params.get("file") || "";

var returnGame =
    params.get("return") || "";

file =
    cleanPath(file);

returnGame =
    String(returnGame).trim();


/* =========================================================
   STORY ID
   ========================================================= */

var storyId =
    getStoryId(file);


/* =========================================================
   SHARED STORY STORAGE
   ========================================================= */

var storageKey =
    "ceeqwinn_story_history_" +
    storyId;


/* =========================================================
   STORY STATE
   ========================================================= */

var storyNodes = [];

var resumeAfterGameId = "";


/* =========================================================
   START
   ========================================================= */

if(!file){

    title.textContent =
        "Article not found";

    status.textContent =
        "No article was selected.";

}else{

    loadStory();

}


/* =========================================================
   LOAD MARKDOWN
   ========================================================= */

function loadStory(){

    status.textContent =
        "Loading...";

    content.innerHTML = "";

    media.innerHTML = "";

    cover.style.display =
        "none";


    var xhr =
        new XMLHttpRequest();


    xhr.open(
        "GET",
        "../content/articles/" +
        encodeURIComponent(file) +
        ".md",
        true
    );


    xhr.onload =
        function(){

            if(
                xhr.status !== 200 &&
                xhr.status !== 0
            ){

                title.textContent =
                    "Unable to load article";

                status.textContent =
                    "The article could not be loaded.";

                return;

            }


            buildStory(
                xhr.responseText
            );

        };


    xhr.onerror =
        function(){

            title.textContent =
                "Unable to load article";

            status.textContent =
                "The article could not be loaded.";

        };


    xhr.send();

}


/* =========================================================
   BUILD STORY
   ========================================================= */

function buildStory(text){

    var data =
        parseFrontmatter(text);


    title.textContent =
        data.title || file;


    credits.innerHTML =
        data.credits
        ? "<strong>Credits:</strong> " +
          escapeHtml(data.credits)
        : "";


    if(data.cover){

        cover.src =
            mediaPath(data.cover);

        cover.alt =
            data.title || file;

        cover.style.display =
            "block";


        cover.onerror =
            function(){

                cover.style.display =
                    "none";

            };

    }


    /*
     * Convert Markdown into the internal story-node
     * structure.
     *
     * Theatre scenes are additional nodes. The
     * reader still controls story progression.
     */

    storyNodes =
        parseStoryNodes(
            data.body.split(/\r?\n/)
        );


    /*
     * Game return support.
     */

    if(returnGame){

        resumeAfterGameId =
            returnGame;

        returnGame = "";

    }


    renderProgress();

    fixMedia();

    renderExtraMedia(data);

    status.textContent = "";

}


/* =========================================================
   FRONTMATTER
   ========================================================= */

function parseFrontmatter(text){

    var data = {
        title:"",
        cover:"",
        credits:"",
        video:"",
        audio:"",
        body:text
    };


    text =
        String(text || "")
        .replace(/^\uFEFF/, "")
        .replace(/\r\n/g, "\n")
        .replace(/\r/g, "\n");


    var match =
        text.match(
            /^---[ \t]*\n([\s\S]*?)\n---[ \t]*(?:\n|$)/
        );


    if(!match){

        data.body =
            cleanLeadingArticleMetadata(text);

        return data;

    }


    var front =
        match[1];


    data.body =
        text.substring(
            match[0].length
        );


    data.title =
        frontValue(
            front,
            "title"
        );

    data.cover =
        frontValue(
            front,
            "cover"
        );

    data.credits =
        frontValue(
            front,
            "credits"
        );

    data.video =
        frontValue(
            front,
            "video"
        );

    data.audio =
        frontValue(
            front,
            "audio"
        );


    data.body =
        cleanLeadingArticleMetadata(
            data.body
        );


    return data;

}


/* =========================================================
   CLEAN LEADING ARTICLE METADATA
   ========================================================= */

function cleanLeadingArticleMetadata(text){

    var body =
        String(text || "")
        .replace(/^\uFEFF/, "")
        .replace(/\r\n/g, "\n")
        .replace(/\r/g, "\n");


    body =
        body.replace(
            /^\s*\n/,
            ""
        );


    var changed = true;


    while(changed){

        changed = false;


        var duplicateFront =
            body.match(
                /^---[ \t]*\n([\s\S]*?)\n---[ \t]*(?:\n|$)/
            );


        if(duplicateFront){

            var possibleMeta =
                duplicateFront[1];


            if(
                /^\s*(title|cover|credits|video|audio)\s*:/mi.test(
                    possibleMeta
                )
            ){

                body =
                    body.substring(
                        duplicateFront[0].length
                    );


                body =
                    body.replace(
                        /^\s*\n/,
                        ""
                    );


                changed = true;

            }

        }

    }


    body =
        body.replace(
            /^##[ \t]+title\s*:[^\n]*\n+/i,
            ""
        );


    body =
        body.replace(
            /^\s*\n/,
            ""
        );


    return body;

}


/* =========================================================
   FRONTMATTER VALUE
   ========================================================= */

function frontValue(
    text,
    key
){

    var re =
        new RegExp(
            "^" +
            key +
            "\\s*:\\s*[\"']?(.*?)[\"']?$",
            "mi"
        );


    var match =
        text.match(re);


    return match
        ? match[1].trim()
        : "";

}


/* =========================================================
   CLEAN CONTROL LINE
   ========================================================= */

function cleanControlLine(line){

    return String(line || "")
        .trim()
        .replace(/^\*+\s*/, "")
        .replace(/\s*\*+$/, "")
        .trim();

}


/* =========================================================
   MARKER TESTS
   ========================================================= */

function isGameMarker(line){

    return /^\[GAME:\s*[A-Z0-9_-]+\s*\]$/i.test(
        cleanControlLine(line)
    );

}


function isChoiceStart(line){

    return /^\[CHOICE:\s*[\w-]+\s*\]$/i.test(
        cleanControlLine(line)
    );

}


function isShowOutfitMarker(line){

    return /^\[SHOWOUTFIT\]$/i.test(
        cleanControlLine(line)
    );

}


/* INLINE THEATRE MARKERS — V3 */

function isTheatreStart(line){

    return /^\[THEATRE(?:\s*:\s*[A-Z][A-Z0-9_-]*)?\s*\]$/i.test(
        cleanControlLine(line)
    );

}


function isTheatreEnd(line){

    return /^\[\/THEATRE\]$/i.test(
        cleanControlLine(line)
    );

}


function getTheatreMode(line){

    var match =
        cleanControlLine(line).match(
            /^\[THEATRE(?:\s*:\s*([A-Z][A-Z0-9_-]*))?\s*\]$/i
        );


    return match && match[1]
        ? match[1].toUpperCase()
        : "NARRATION";

}


/*
 * NEXT is deliberately tolerant:
 *
 * [NEXT:file]
 * [NEXT:file|Label]
 * [NEXT: file | Label]
 *
 * all work.
 */

function isNextMarker(line){

    return /^\[NEXT:\s*[^|\]]+(?:\|[^\]]+)?\s*\]$/i.test(
        cleanControlLine(line)
    );

}


function isIfMarker(line){

    return /^\[IF:\s*[\w-]+\s*=\s*[A-Z]\s*\]$/i.test(
        cleanControlLine(line)
    );

}


function isElseMarker(line){

    return /^\[ELSE\]$/i.test(
        cleanControlLine(line)
    );

}


function isEndIfMarker(line){

    return /^\[ENDIF\]$/i.test(
        cleanControlLine(line)
    );

}


function isEndChoiceMarker(line){

    return /^\[ENDCHOICE\]$/i.test(
        cleanControlLine(line)
    );

}


/* =========================================================
   GET GAME ID
   ========================================================= */

function getGameId(line){

    var match =
        cleanControlLine(line).match(
            /^\[GAME:\s*([A-Z0-9_-]+)\s*\]$/i
        );


    return match
        ? match[1].toUpperCase()
        : "";

}


/* =========================================================
   PARSE COMPLETE STORY INTO NODES
   ========================================================= */

function parseStoryNodes(lines){

    var result = [];

    var normal = [];

    var i = 0;


    function flushNormal(){

        if(normal.length){

            result.push({
                type:"markdown",
                text:normal.join("\n")
            });

            normal = [];

        }

    }


    while(i < lines.length){

        var line =
            lines[i];


        /* INLINE THEATRE */

        if(isTheatreStart(line)){

            flushNormal();


            var theatreMode =
                getTheatreMode(line);

            var theatreLines = [];

            var theatreClosed = false;


            i++;


            while(i < lines.length){

                if(isTheatreEnd(lines[i])){

                    theatreClosed = true;

                    i++;

                    break;

                }


                theatreLines.push(
                    lines[i]
                );

                i++;

            }


            result.push({

                type:"theatre",

                mode:theatreMode,

                text:theatreLines.join("\n"),

                closed:theatreClosed

            });


            continue;

        }


        /* CONDITIONAL */

        if(isIfMarker(line)){

            flushNormal();


            var conditional =
                parseConditionalNode(
                    lines,
                    i
                );


            result.push(
                conditional.node
            );


            i =
                conditional.next;

            continue;

        }


        /* CHOICE */

        if(isChoiceStart(line)){

            flushNormal();


            var choice =
                parseChoiceNode(
                    lines,
                    i
                );


            result.push(
                choice.node
            );


            i =
                choice.next;

            continue;

        }


        /* GAME */

        if(isGameMarker(line)){

            flushNormal();


            result.push({

                type:"game",

                id:getGameId(line)

            });


            i++;

            continue;

        }


        /* SHOW OUTFIT */

        if(isShowOutfitMarker(line)){

            flushNormal();


            result.push({

                type:"outfit"

            });


            i++;

            continue;

        }


        /* NEXT CHAPTER */

        if(isNextMarker(line)){

            flushNormal();


            result.push({

                type:"next",

                line:cleanControlLine(line)

            });


            i++;

            continue;

        }


        /*
         * These markers belong to a structure already
         * being parsed. Ignore them here.
         */

        if(
            isElseMarker(line) ||
            isEndIfMarker(line) ||
            isEndChoiceMarker(line)
        ){

            i++;

            continue;

        }


        normal.push(line);

        i++;

    }


    flushNormal();


    return result;

}



function renderChoice(node) {
    var savedChoices = getChoices();
    var savedLetter = normalizeChoiceLetter(savedChoices[node.id]);

    var html = '<section class="story-choice" id="' +
        escapeAttr(node.id) + '">';

    html += '<div class="story-choice__prompt">' +
        marked(node.prompt || "") + '</div>';

    html += '<div class="story-choice__options">';

    (node.options || []).forEach(function (option) {
        var letter = normalizeChoiceLetter(option.letter);
        var selected = savedLetter === letter;

        html += '<button type="button"';
        html += ' class="story-choice-button' +
            (selected ? ' is-selected' : '') + '"';
        html += ' data-choice="' + escapeAttr(node.id) + '"';
        html += ' data-letter="' + escapeAttr(letter) + '"';
        html += '>';

        html += '<span class="story-choice-button__letter">' +
            escapeHtml(letter) + '</span>';

        html += '<span class="story-choice-button__text">' +
            marked(option.text || "") + '</span>';

        html += '</button>';
    });

    html += '</div>';

    if (savedLetter) {
        html += '<div class="story-choice__result"';
        html += ' data-choice-result="' + escapeAttr(node.id) + '">';

        var selectedOption = (node.options || []).find(function (option) {
            return normalizeChoiceLetter(option.letter) === savedLetter;
        });

        if (selectedOption && selectedOption.consequence) {
            html += marked(selectedOption.consequence);
        }

        html += '</div>';
    }

    html += '</section>';

    return html;
}

document.addEventListener("click", function (event) {
    var button = event.target.closest(".story-choice-button");

    if (!button) {
        return;
    }

    var choiceId = button.getAttribute("data-choice");
    var letter = button.getAttribute("data-letter");

    if (!choiceId || !letter) {
        return;
    }

    saveChoice(choiceId, letter);
    renderProgress();

    var result = document.querySelector(
        '[data-choice-result="' + cssEscape(choiceId) + '"]'
    );

    if (result) {
        scrollToElement(result);
    }
});

function saveChoice(id, letter) {
    var choices = getChoices();

    choices[id] = normalizeChoiceLetter(letter);

    try {
        localStorage.setItem(storageKey, JSON.stringify(choices));
    } catch (error) {
        console.warn("Could not save the story choice.", error);
    }
}

function normalizeChoiceLetter(value) {
    return String(value || "")
        .trim()
        .toUpperCase();
}

function getChoices() {
    try {
        var raw = localStorage.getItem(storageKey);
        var parsed = raw ? JSON.parse(raw) : {};

        if (parsed && typeof parsed === "object" && !Array.isArray(parsed)) {
            return parsed;
        }
    } catch (error) {
        console.warn("Could not read saved story choices.", error);
    }

    return {};
}

function getCompletedGames() {
    try {
        var raw = localStorage.getItem("ceeqwinn_completed_games");
        var parsed = raw ? JSON.parse(raw) : [];

        return Array.isArray(parsed) ? parsed : [];
    } catch (error) {
        console.warn("Could not read completed games.", error);
        return [];
    }
}

function renderGame(gameId) {
    var id = String(gameId || "").trim().toUpperCase();

    if (id !== "FASHION-01") {
        return '<p class="story-game-unavailable">' +
            'This game is not available yet: ' +
            escapeHtml(id) +
            '</p>';
    }

    var completed = getCompletedGames().indexOf(id) !== -1;

    return '<div class="story-game-block">' +
        '<p>' +
        (completed
            ? 'You have completed this fashion game. You can play it again.'
            : 'Ready for the fashion challenge?') +
        '</p>' +
        '<button type="button" class="story-game-button"' +
        ' data-game="' + escapeAttr(id) + '">' +
        (completed ? 'Play Again' : 'Start Fashion Game') +
        '</button>' +
        '</div>';
}

document.addEventListener("click", function (event) {
    var button = event.target.closest(".story-game-button");

    if (!button) {
        return;
    }

    var gameId = String(
        button.getAttribute("data-game") || ""
    ).trim().toUpperCase();

    if (gameId === "FASHION-01") {
        window.location.href = "/games/fashion-01.html";
    }
});

window.addEventListener("pageshow", function () {
    var returnFlag;

    try {
        returnFlag = sessionStorage.getItem(
            "ceeqwinn_return_from_game"
        );
    } catch (error) {
        returnFlag = null;
    }

    if (returnFlag === "FASHION-01") {
        try {
            sessionStorage.removeItem("ceeqwinn_return_from_game");
        } catch (error) {
            console.warn("Could not clear the game return flag.", error);
        }

        resumeAfterGameId = "FASHION-01";
        renderProgress();
    }
});

function scrollToElement(element) {
    if (!element) {
        return;
    }

    element.scrollIntoView({
        behavior: "smooth",
        block: "center"
    });
}

function renderShowOutfit() {
    var playerState = {};

    try {
        var raw = localStorage.getItem("ceeqwinn_player_state");
        playerState = raw ? JSON.parse(raw) : {};
    } catch (error) {
        console.warn("Could not read the saved outfit.", error);
    }

    var outfitId = String(
        playerState.outfit || playerState.currentOutfit || "lexis_default"
    ).trim();

    var outfits = {
        lexis_default:
            "/content/images/characters/lexis/outfits/lexis_default.png.jpeg",

        lexis_red_dress:
            "/content/images/characters/lexis/outfits/lexis_red_dress.png.jpeg",

        lexis_black_dress:
            "/content/images/characters/lexis/outfits/lexis_black_dress.png.jpeg"
    };

    var imagePath = outfits[outfitId];

    if (!imagePath) {
        imagePath = outfits.lexis_default;
    }

    return '<figure class="story-outfit">' +
        '<img src="' + escapeAttr(imagePath) + '"' +
        ' alt="Lexis outfit"' +
        ' loading="lazy">' +
        '<figcaption>Current outfit</figcaption>' +
        '</figure>';
}


function renderNext(line) {
    var cleaned = cleanControlLine(line);

    var match = cleaned.match(
        /^\[NEXT\s*:\s*([^|\]]+)(?:\|([^\]]*))?\]$/i
    );

    if (!match) {
        return "";
    }

    var target = match[1].trim();
    var label = (match[2] || "Continue reading").trim();

    if (!target) {
        return "";
    }

    return '<div class="story-next">' +
        '<button type="button" class="story-next-button"' +
        ' data-next-file="' + escapeAttr(target) + '">' +
        escapeHtml(label) +
        '</button>' +
        '</div>';
}

document.addEventListener("click", function (event) {
    var button = event.target.closest(".story-next-button");

    if (!button) {
        return;
    }

    var target = button.getAttribute("data-next-file");

    if (!target) {
        return;
    }

    window.location.href =
        "article.html?file=" + encodeURIComponent(target);
});

if (reset) {
    reset.addEventListener("click", function () {
        try {
            localStorage.removeItem(storageKey);
            localStorage.removeItem("ceeqwinn_completed_games");
        } catch (error) {
            console.warn("Could not reset saved story progress.", error);
        }

        window.location.reload();
    });
}

function getStoryId(path) {
    return String(path || "")
        .split("/")
        .pop()
        .replace(/\.md$/i, "")
        .replace(/-chapter-\d+$/i, "");
}

function mediaPath(src) {
    var value = String(src || "").trim();

    if (!value) {
        return value;
    }

    if (
        /^(?:https?:|data:|blob:|\/\/|#)/i.test(value) ||
        /^(?:mailto:|tel:)/i.test(value)
    ) {
        return value;
    }

    value = value.replace(/\\/g, "/");

    if (value.charAt(0) === "/") {
        return value;
    }

    if (/^(?:content|games|theater-inline-v3)\//i.test(value)) {
        return "/" + value;
    }

    if (/^(?:images|audio|video)\//i.test(value)) {
        return "/content/" + value;
    }

    return "/content/" + value.replace(/^\.\/+/, "");
}

function fixMedia() {
    if (!content) {
        return;
    }

    var images = content.querySelectorAll("img");

    images.forEach(function (image) {
        var source = image.getAttribute("src");

        if (source) {
            image.setAttribute("src", mediaPath(source));
        }

        image.loading = image.loading || "lazy";
        image.decoding = "async";
    });

    var videos = content.querySelectorAll("video");

    videos.forEach(function (video) {
        var source = video.getAttribute("src");

        if (source) {
            video.setAttribute("src", mediaPath(source));
        }

        video.controls = true;

        video.querySelectorAll("source").forEach(function (item) {
            var sourcePath = item.getAttribute("src");

            if (sourcePath) {
                item.setAttribute("src", mediaPath(sourcePath));
            }
        });

        video.load();
    });

    var audios = content.querySelectorAll("audio");

    audios.forEach(function (audio) {
        var source = audio.getAttribute("src");

        if (source) {
            audio.setAttribute("src", mediaPath(source));
        }

        audio.controls = true;

        audio.querySelectorAll("source").forEach(function (item) {
            var sourcePath = item.getAttribute("src");

            if (sourcePath) {
                item.setAttribute("src", mediaPath(sourcePath));
            }
        });

        audio.load();
    });
}

function renderExtraMedia(data) {
    if (!content || !data || typeof data !== "object") {
        return;
    }

    var videoValue = data.video || data.videos;
    var audioValue = data.audio || data.audios;

    function normalizeMediaItems(value) {
        if (!value) {
            return [];
        }

        if (Array.isArray(value)) {
            return value;
        }

        return [value];
    }

    normalizeMediaItems(videoValue).forEach(function (item) {
        var src = typeof item === "string"
            ? item
            : item && (item.src || item.url || item.file);

        if (!src) {
            return;
        }

        var video = document.createElement("video");
        video.controls = true;
        video.preload = "metadata";
        video.src = mediaPath(src);

        if (item && typeof item === "object" && item.poster) {
            video.poster = mediaPath(item.poster);
        }

        var wrapper = document.createElement("div");
        wrapper.className = "story-extra-media story-extra-media--video";
        wrapper.appendChild(video);
        content.appendChild(wrapper);
    });

    normalizeMediaItems(audioValue).forEach(function (item) {
        var src = typeof item === "string"
            ? item
            : item && (item.src || item.url || item.file);

        if (!src) {
            return;
        }

        var audio = document.createElement("audio");
        audio.controls = true;
        audio.preload = "metadata";
        audio.src = mediaPath(src);

        var wrapper = document.createElement("div");
        wrapper.className = "story-extra-media story-extra-media--audio";
        wrapper.appendChild(audio);
        content.appendChild(wrapper);
    });
}

function cleanPath(path) {
    return String(path || "")
        .replace(/\\/g, "/")
        .split("/")
        .filter(function (part) {
            return part && part !== "." && part !== "..";
        })
        .join("/");
}

function escapeHtml(value) {
    return String(value == null ? "" : value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
}

function escapeAttr(value) {
    return escapeHtml(value);
}

function cssEscape(value) {
    return String(value == null ? "" : value)
        .replace(/\\/g, "\\\\")
        .replace(/"/g, '\\"')
        .replace(/'/g, "\\'");
}
