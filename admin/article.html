```html
<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CEEQWINN Reader</title>

<style>

body{
    max-width:800px;
    margin:auto;
    padding:40px 20px;
    font-family:Arial,sans-serif;
    line-height:1.8;
    background:#fafafa;
    color:#222;
}

h1{
    font-size:2.2rem;
    margin-bottom:20px;
}

#content{
    overflow-wrap:break-word;
}

#content img{
    max-width:100%;
    height:auto;
    border-radius:12px;
    margin:20px 0;
}

#content h2,
#content h3{
    margin-top:30px;
}

#status{
    color:#666;
}

</style>

</head>

<body>

<h1 id="title">Loading...</h1>

<div id="status">
    Loading article...
</div>

<div id="content"></div>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

<script>

const params = new URLSearchParams(location.search);

const file = params.get("file");

const titleElement =
    document.getElementById("title");

const statusElement =
    document.getElementById("status");

const contentElement =
    document.getElementById("content");


if(!file){

    titleElement.textContent =
        "Article not found";

    statusElement.textContent =
        "No article was selected.";

}else{

    const safeSlug =
        file.replace(/[^a-zA-Z0-9_-]/g, "");

    fetch(
        "../content/articles/" +
        safeSlug +
        ".md"
    )

    .then(response => {

        if(!response.ok){

            throw new Error(
                "Article could not be found."
            );

        }

        return response.text();

    })

    .then(text => {

        let markdown = text;

        let articleTitle = safeSlug;

        const frontMatterMatch =
            text.match(
                /^---\s*([\s\S]*?)\s*---\s*/
            );


        if(frontMatterMatch){

            const frontMatter =
                frontMatterMatch[1];

            const titleMatch =
                frontMatter.match(
                    /^title:\s*[\"']?(.*?)[\"']?\s*$/m
                );


            if(titleMatch){

                articleTitle =
                    titleMatch[1].trim();

            }


            markdown =
                text.replace(
                    /^---\s*[\s\S]*?\s*---\s*/,
                    ""
                );

        }


        titleElement.textContent =
            articleTitle;


        contentElement.innerHTML =
            marked.parse(markdown);


        statusElement.textContent = "";

    })

    .catch(error => {

        console.error(error);

        titleElement.textContent =
            "Unable to load article";

        statusElement.textContent =
            "The article could not be loaded.";

    });

}

</script>

</body>

</html>
```
