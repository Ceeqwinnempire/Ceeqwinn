<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CEEQWINN Reader</title>
<style>
body{max-width:800px;margin:auto;padding:35px 18px;font-family:Arial,sans-serif;line-height:1.8;background:#fafafa;color:#222}
h1{font-size:2.2rem;margin-bottom:20px}
h2{margin-top:35px}
#cover{display:none;max-width:100%;height:auto;margin:0 auto 30px;border-radius:12px}
#credits{color:#666;margin-bottom:25px}
#status{color:#777}
#content{overflow-wrap:break-word}
#content img{display:block;max-width:100%;height:auto;margin:25px auto;border-radius:12px}
#content video,#content audio{display:block;width:100%;max-width:100%;margin:25px auto}
#content blockquote{margin:25px 0;padding:10px 18px;border-left:4px solid #999;background:#f0f0f0}
#content table{width:100%;border-collapse:collapse;margin:25px 0}
#content th,#content td{padding:8px;border:1px solid #ccc}

.story-choice{margin:45px 0;padding:20px 0}
.story-choice-title{font-weight:bold;font-size:1.1rem;margin-bottom:15px}
.story-choice-button{display:block;width:100%;box-sizing:border-box;margin:10px 0;padding:15px;font:16px Arial,sans-serif;text-align:left;background:#fff;color:#222;border:1px solid #ccc;border-radius:8px;cursor:pointer}
.story-choice-button:hover{background:#f2f2f2}
.story-choice-button:disabled{cursor:default;opacity:.7}

.story-consequence{margin:25px 0}
.story-continuation{margin-top:25px}
.story-next{margin:55px 0 25px;padding:25px 0;text-align:center}
.story-next-text{margin-bottom:18px;color:#555;font-size:1rem}
.story-next-button{display:inline-block;padding:14px 22px;font:16px Arial,sans-serif;background:#222;color:#fff;border:none;border-radius:8px;cursor:pointer}
.story-next-button:hover{opacity:.85}

.story-game{margin:45px 0;padding:25px 0;text-align:center}
.story-game-title{font-weight:bold;font-size:1.15rem;margin-bottom:10px}
.story-game-text{color:#666;margin-bottom:18px}
.story-game-button{display:inline-block;padding:15px 24px;font:16px Arial,sans-serif;background:#222;color:#fff;border:none;border-radius:8px;cursor:pointer}
.story-game-button:hover{opacity:.85}
.story-game-shell{margin:25px 0;padding:10px;background:#fff;border:1px solid #ddd;border-radius:12px}
.story-game-frame{display:block;width:100%;height:720px;max-height:78vh;border:0;border-radius:8px;background:#fff}
.story-game-close{display:block;width:100%;margin-top:10px;padding:12px;font:15px Arial,sans-serif;background:#f7f7f7;color:#555;border:1px solid #ccc;border-radius:8px;cursor:pointer}
.story-game-close:hover{background:#eee}

.story-outfit{margin:35px 0;text-align:center}
.story-outfit img{display:block;width:100%;max-width:420px;height:auto;margin:0 auto;border-radius:12px}

#storyReset{display:none;width:100%;margin:35px 0;padding:12px;background:#f7f7f7;color:#555;border:1px dashed #aaa;border-radius:8px;cursor:pointer}
#storyReset:hover{background:#eee}

@media(max-width:600px){
body{padding:25px 15px}
h1{font-size:1.8rem}
.story-choice-button{font-size:16px;padding:15px}
.story-next-button,.story-game-button{width:100%;box-sizing:border-box}
.story-game-frame{height:70vh;min-height:500px}
}
</style>
</head>
<body>
<img id="cover" alt="">
<h1 id="title">Loading...</h1>
<div id="credits"></div>
<div id="status"></div>
<div id="content"></div>
<button id="storyReset" type="button">↺ Reset Story</button>
<div id="media"></div>

<script src="https://cdn.jsdelivr.net/npm/marked@0.3.19/marked.min.js"></script>
<script>
/* =========================================================
   CEEQWINN READER
   PROGRESSIVE STORY ENGINE

   IMPORTANT DESIGN RULE:
   The reader does NOT render the whole future story into
   hidden containers.

   It renders only until the next gate:
     STORY -> CHOICE -> RESULT -> NEXT CHOICE/GAME/NEXT

   This is what makes the story genuinely progressive.
   ========================================================= */

var title = document.getElementById("title");
var credits = document.getElementById("credits");
var status = document.getElementById("status");
var content = document.getElementById("content");
var cover = document.getElementById("cover");
var media = document.getElementById("media");
var reset = document.getElementById("storyReset");

var params = new URLSearchParams(window.location.search);
var file = cleanPath(params.get("file") || "");
var storyId = getStoryId(file);
var storageKey = "ceeqwinn_story_history_" + storyId;

/* Current story runtime */
var storySteps = [];
var flowStack = [];
var activeGate = null;
var activeGameTimer = null;
var activeGameId = "";

if(!file){
    title.textContent = "Article not found";
    status.textContent = "No article was selected.";
}else{
    loadStory();
}

/* =========================================================
   LOAD MARKDOWN
   ========================================================= */
function loadStory(){
    status.textContent = "Loading...";
    content.innerHTML = "";
    media.innerHTML = "";
    cover.style.display = "none";
    storySteps = [];
    flowStack = [];
    activeGate = null;
    stopGameWatcher();

    var xhr = new XMLHttpRequest();
    xhr.open("GET", "../content/articles/" + encodeURIComponent(file) + ".md", true);

    xhr.onload = function(){
        if(xhr.status !== 200 && xhr.status !== 0){
            title.textContent = "Unable to load article";
            status.textContent = "The article could not be loaded.";
            return;
        }
        buildStory(xhr.responseText);
    };

    xhr.onerror = function(){
        title.textContent = "Unable to load article";
        status.textContent = "The article could not be loaded.";
    };

    xhr.send();
}

/* =========================================================
   BUILD STORY
   ========================================================= */
function buildStory(text){
    var data = parseFrontmatter(text);

    title.textContent = data.title || file;

    credits.innerHTML = data.credits
        ? "<strong>Credits:</strong> " + escapeHtml(data.credits)
        : "";

    if(data.cover){
        cover.src = mediaPath(data.cover);
        cover.alt = data.title || file;
        cover.style.display = "block";
        cover.onerror = function(){ cover.style.display = "none"; };
    }

    /* Compile Markdown markers into a small story flow. */
    storySteps = compileFlow(data.body.split(/\r?\n/));

    content.innerHTML = "";
    flowStack = [{steps: storySteps, index: 0}];
    activeGate = null;

    /* Replay saved choices automatically until the first unfinished gate. */
    renderUntilGate();

    renderExtraMedia(data);
    updateResetButton();
    status.textContent = "";
}

/* =========================================================
   FRONTMATTER
   ========================================================= */
function parseFrontmatter(text){
    var data = {
        title:"",
        cover:"",
        credits:"",
        video:"",
        audio:"",
        body:text
    };

    var match = text.match(/^---\s*\n([\s\S]*?)\n---\s*\n?/);

    if(!match){
        return data;
    }

    var front = match[1];
    data.body = text.substring(match[0].length);
    data.title = frontValue(front,"title");
    data.cover = frontValue(front,"cover");
    data.credits = frontValue(front,"credits");
    data.video = frontValue(front,"video");
    data.audio = frontValue(front,"audio");
    return data;
}

function frontValue(text,key){
    var re = new RegExp("^" + key + "\\s*:\\s*[\\\"']?(.*?)[\\\"']?$","m");
    var match = text.match(re);
    return match ? match[1].trim() : "";
}

/* =========================================================
   MARKER TESTS
   ========================================================= */
function isGameMarker(line){
    return /^\s*\[GAME:[A-Za-z0-9_-]+\]\s*$/.test(line);
}

function isChoiceStart(line){
    return /^\s*\[CHOICE:[\w-]+\]\s*$/.test(line);
}

function isShowOutfitMarker(line){
    return /^\s*\[SHOWOUTFIT\]\s*$/.test(line);
}

function isNextMarker(line){
    return /^\s*\[NEXT:[^\]]+\]\s*$/.test(line);
}

function isIfMarker(line){
    return /^\s*\[IF:[\w-]+=[A-Z]\]\s*$/.test(line);
}

function isEndIfMarker(line){
    return /^\s*\[ENDIF\]\s*$/.test(line);
}

function isElseMarker(line){
    return /^\s*\[ELSE\]\s*$/.test(line);
}

function isEndChoiceMarker(line){
    return /^\s*\[ENDCHOICE\]\s*$/.test(line);
}

function isConsequenceMarker(line){
    return /^\s*\[CONSEQUENCE:([A-Z])\]\s*$/.test(line);
}

function isOptionLine(line){
    return /^\s*\[([A-Z])\]\s*(.+?)\s*$/.test(line);
}

/* =========================================================
   STORY COMPILER

   This converts the Markdown into a sequence of steps.
   Future content is NOT rendered yet.
   ========================================================= */
function compileFlow(lines){
    var steps = [];
    var normal = [];
    var i = 0;

    function flushNormal(){
        if(normal.length){
            steps.push({type:"markdown", text:normal.join("\n")});
            normal = [];
        }
    }

    while(i < lines.length){
        if(isChoiceStart(lines[i])){
            flushNormal();
            var choice = parseChoiceBlock(lines,i);
            steps.push(choice.step);
            i = choice.nextIndex;
            continue;
        }

        if(isGameMarker(lines[i])){
            flushNormal();
            steps.push({
                type:"game",
                id:getGameId(lines[i])
            });
            i++;
            continue;
        }

        if(isShowOutfitMarker(lines[i])){
            flushNormal();
            steps.push({type:"outfit"});
            i++;
            continue;
        }

        if(isNextMarker(lines[i])){
            flushNormal();
            steps.push(parseNextStep(lines[i]));
            i++;
            continue;
        }

        if(isIfMarker(lines[i])){
            flushNormal();
            var conditional = parseConditionalBlock(lines,i);
            steps.push(conditional.step);
            i = conditional.nextIndex;
            continue;
        }

        /* Stray engine markers should never become visible text. */
        if(isEndIfMarker(lines[i]) || isEndChoiceMarker(lines[i]) || isElseMarker(lines[i]) || isConsequenceMarker(lines[i])){
            i++;
            continue;
        }

        normal.push(lines[i]);
        i++;
    }

    flushNormal();
    return steps;
}

/* =========================================================
   CHOICE COMPILER

   [CHOICE:id]
   [A] ...
   [B] ...
   [CONSEQUENCE:A]
   ...
   [ENDCHOICE]
   [CONSEQUENCE:B]
   ...
   [ENDCHOICE]

   Only the selected branch is ever rendered.
   ========================================================= */
function parseChoiceBlock(lines,startIndex){
    var match = lines[startIndex].match(/^\s*\[CHOICE:([\w-]+)\]\s*$/);

    if(!match){
        return {
            step:{type:"markdown",text:""},
            nextIndex:startIndex + 1
        };
    }

    var choiceId = match[1];
    var options = [];
    var branches = {};
    var i = startIndex + 1;

    /* Read option labels. */
    while(i < lines.length){
        var option = lines[i].match(/^\s*\[([A-Z])\]\s*(.+?)\s*$/);
        if(!option){ break; }
        options.push({letter:option[1],label:option[2]});
        i++;
    }

    var currentLetter = "";
    var currentLines = [];
    var nestedChoiceDepth = 0;

    while(i < lines.length){
        var line = lines[i];

        /* A nested choice belongs inside the current branch. */
        if(isChoiceStart(line) && currentLetter){
            nestedChoiceDepth++;
            currentLines.push(line);
            i++;
            continue;
        }

        if(isConsequenceMarker(line) && nestedChoiceDepth === 0){
            if(currentLetter){
                branches[currentLetter] = currentLines;
            }
            var consequence = line.match(/^\s*\[CONSEQUENCE:([A-Z])\]\s*$/);
            currentLetter = consequence[1];
            currentLines = [];
            i++;
            continue;
        }

        if(isEndChoiceMarker(line)){
            if(nestedChoiceDepth > 0){
                nestedChoiceDepth--;
                currentLines.push(line);
                i++;
                continue;
            }

            if(currentLetter){
                branches[currentLetter] = currentLines;
            }

            currentLetter = "";
            currentLines = [];
            i++;

            /* The choice is complete once every declared option has a branch. */
            var complete = true;
            for(var o=0;o<options.length;o++){
                if(!branches[options[o].letter]){
                    complete = false;
                    break;
                }
            }
            if(complete){ break; }
            continue;
        }

        if(currentLetter){
            currentLines.push(line);
        }

        i++;
    }

    var compiledBranches = {};
    for(var b=0;b<options.length;b++){
        var letter = options[b].letter;
        compiledBranches[letter] = compileFlow(branches[letter] || []);
    }

    return {
        step:{
            type:"choice",
            id:choiceId,
            options:options,
            branches:compiledBranches
        },
        nextIndex:i
    };
}

/* =========================================================
   CONDITIONAL COMPILER
   ========================================================= */
function parseConditionalBlock(lines,startIndex){
    var first = lines[startIndex].match(/^\s*\[IF:([\w-]+)=([A-Z])\]\s*$/);

    if(!first){
        return {
            step:{type:"markdown",text:""},
            nextIndex:startIndex + 1
        };
    }

    var branches = [{id:first[1],letter:first[2],lines:[]}];
    var current = branches[0];
    var depth = 1;
    var i = startIndex + 1;

    while(i < lines.length){
        var line = lines[i];

        if(isIfMarker(line)){
            depth++;
            current.lines.push(line);
            i++;
            continue;
        }

        if(isEndIfMarker(line)){
            depth--;
            if(depth === 0){
                i++;
                break;
            }
            current.lines.push(line);
            i++;
            continue;
        }

        if(depth === 1 && isElseMarker(line)){
            current = {id:"__ELSE__",letter:"ELSE",lines:[]};
            branches.push(current);
            i++;
            continue;
        }

        current.lines.push(line);
        i++;
    }

    var compiled = [];
    for(var b=0;b<branches.length;b++){
        compiled.push({
            id:branches[b].id,
            letter:branches[b].letter,
            steps:compileFlow(branches[b].lines)
        });
    }

    return {
        step:{type:"conditional",branches:compiled},
        nextIndex:i
    };
}

/* =========================================================
   NEXT STEP
   ========================================================= */
function parseNextStep(line){
    var match = line.match(/^\s*\[NEXT:([^\]|]+)(?:\|([^\]]+))?\]\s*$/);
    return {
        type:"next",
        file:match ? cleanPath(match[1]) : "",
        label:match && match[2] ? match[2].trim() : "Enter the next chapter"
    };
}

/* =========================================================
   PROGRESSIVE RUNTIME

   This is the important part.

   It processes one step at a time.
   When it reaches a gate, it stops.
   When the player completes the gate, it continues from
   the exact next point in the story.
   ========================================================= */
function renderUntilGate(){
    activeGate = null;

    while(flowStack.length){
        var frame = flowStack[flowStack.length - 1];

        if(frame.index >= frame.steps.length){
            flowStack.pop();
            continue;
        }

        var step = frame.steps[frame.index];
        frame.index++;

        if(step.type === "markdown"){
            appendHtml(marked(step.text));
            continue;
        }

        if(step.type === "outfit"){
            appendHtml(renderShowOutfit());
            continue;
        }

        if(step.type === "conditional"){
            var selected = chooseConditionalBranch(step.branches);
            if(selected){
                flowStack.push({steps:selected,index:0});
            }
            continue;
        }

        if(step.type === "choice"){
            var saved = getChoices()[step.id];

            if(saved && step.branches[saved]){
                appendSavedChoiceMarker(step.id,saved);
                flowStack.push({steps:step.branches[saved],index:0});
                continue;
            }

            renderChoiceGate(step);
            activeGate = {type:"choice",step:step};
            return;
        }

        if(step.type === "game"){
            if(isGameCompleted(step.id)){
                continue;
            }

            renderGameGate(step);
            activeGate = {type:"game",step:step};
            return;
        }

        if(step.type === "next"){
            renderNextGate(step);
            activeGate = {type:"next",step:step};
            return;
        }
    }

    activeGate = null;
    updateResetButton();
}

function appendHtml(html){
    if(!html){ return; }
    content.insertAdjacentHTML("beforeend",html);
    fixMedia();
}

function appendSavedChoiceMarker(id,letter){
    /* No visible development UI is added for a choice that has already been saved. */
}

/* =========================================================
   CHOICE GATE
   ========================================================= */
function renderChoiceGate(step){
    var html = '<div class="story-choice" data-choice="' + escapeAttr(step.id) + '">' +
        '<div class="story-choice-title">What do you do?</div>';

    for(var i=0;i<step.options.length;i++){
        html += '<button type="button" class="story-choice-button" data-choice="' +
            escapeAttr(step.id) + '" data-letter="' +
            escapeAttr(step.options[i].letter) + '">' +
            escapeHtml(step.options[i].letter + " — " + step.options[i].label) +
            '</button>';
    }

    html += '</div>';
    appendHtml(html);
}

function handleChoice(id,letter){
    var gate = activeGate;

    if(!gate || gate.type !== "choice" || gate.step.id !== id){
        return;
    }

    var step = gate.step;
    if(!step.branches[letter]){
        return;
    }

    saveChoice(id,letter);

    /* Remove only the active choice UI. Nothing else has been pre-rendered. */
    var choiceUI = content.querySelector('.story-choice[data-choice="' + cssEscape(id) + '"]');
    if(choiceUI){
        choiceUI.parentNode.removeChild(choiceUI);
    }

    /* Add only the selected consequence to the live story. */
    var consequenceWrap = document.createElement("div");
    consequenceWrap.className = "story-consequence";
    consequenceWrap.setAttribute("data-choice-result",id);
    content.appendChild(consequenceWrap);

    flowStack.push({steps:step.branches[letter],index:0});

    /* Render the consequence, then keep going until the NEXT real gate. */
    renderUntilGate();

    try{
        consequenceWrap.scrollIntoView({behavior:"smooth",block:"start"});
    }catch(e){
        consequenceWrap.scrollIntoView();
    }
}

/* =========================================================
   CONDITIONAL STATE
   ========================================================= */
function chooseConditionalBranch(branches){
    var choices = getChoices();

    for(var i=0;i<branches.length;i++){
        var branch = branches[i];

        if(branch.id === "__ELSE__"){
            return branch.steps;
        }

        if(choices[branch.id] === branch.letter){
            return branch.steps;
        }
    }

    return null;
}

/* =========================================================
   GAME BRIDGE

   The game is loaded inside the reader instead of throwing
   the player out of the story.

   The fashion game already uses the shared localStorage key:
       ceeqwinn_completed_games

   The reader watches that key. Once FASHION-01 is complete,
   the iframe closes and the story continues automatically.
   ========================================================= */
function getGameId(line){
    var match = String(line).match(/^\s*\[GAME:([A-Za-z0-9_-]+)\]\s*$/);
    return match ? match[1] : "";
}

function getCompletedGames(){
    try{
        var saved = localStorage.getItem("ceeqwinn_completed_games");
        if(!saved){ return {}; }
        var parsed = JSON.parse(saved);
        return parsed && typeof parsed === "object" ? parsed : {};
    }catch(e){
        return {};
    }
}

function isGameCompleted(gameId){
    var completed = getCompletedGames();
    return !!(gameId && completed[gameId]);
}

function renderGameGate(step){
    var titleText = step.id === "FASHION-01"
        ? "Lexis needs to choose her outfit."
        : "An interactive scene is waiting.";

    var description = step.id === "FASHION-01"
        ? "Choose how she wants to face the evening."
        : "Complete the interactive scene to continue the story.";

    var html = '<div class="story-game" data-game-gate="' + escapeAttr(step.id) + '">' +
        '<div class="story-game-title">' + escapeHtml(titleText) + '</div>' +
        '<div class="story-game-text">' + escapeHtml(description) + '</div>' +
        '<button type="button" class="story-game-button" data-game="' + escapeAttr(step.id) + '">Open Game</button>' +
        '</div>';

    appendHtml(html);
}

function openGame(gameId){
    if(!gameId){ return; }

    var gate = content.querySelector('.story-game[data-game-gate="' + cssEscape(gameId) + '"]');
    if(!gate){ return; }

    var button = gate.querySelector(".story-game-button");
    if(button){ button.style.display = "none"; }

    var shell = document.createElement("div");
    shell.className = "story-game-shell";
    shell.setAttribute("data-active-game",gameId);

    var frame = document.createElement("iframe");
    frame.className = "story-game-frame";
    frame.title = "CEEQWINN interactive game";
    frame.src = "/games/fashion-01.html";

    var close = document.createElement("button");
    close.type = "button";
    close.className = "story-game-close";
    close.textContent = "Return to story";
    close.onclick = function(){
        stopGameWatcher();
        shell.parentNode.removeChild(shell);
        if(button){ button.style.display = "inline-block"; }
    };

    shell.appendChild(frame);
    shell.appendChild(close);
    gate.appendChild(shell);

    activeGameId = gameId;
    startGameWatcher();

    try{
        shell.scrollIntoView({behavior:"smooth",block:"start"});
    }catch(e){
        shell.scrollIntoView();
    }
}

function startGameWatcher(){
    stopGameWatcher();

    activeGameTimer = window.setInterval(function(){
        if(activeGameId && isGameCompleted(activeGameId)){
            finishActiveGame();
        }
    },500);
}

function stopGameWatcher(){
    if(activeGameTimer){
        window.clearInterval(activeGameTimer);
        activeGameTimer = null;
    }
    activeGameId = "";
}

function finishActiveGame(){
    var gameId = activeGameId;
    stopGameWatcher();

    var shell = content.querySelector('.story-game-shell[data-active-game="' + cssEscape(gameId) + '"]');
    if(shell && shell.parentNode){
        shell.parentNode.removeChild(shell);
    }

    var gate = content.querySelector('.story-game[data-game-gate="' + cssEscape(gameId) + '"]');
    if(gate && gate.parentNode){
        gate.parentNode.removeChild(gate);
    }

    /* The GAME step has already been consumed from the flow stack. */
    activeGate = null;
    renderUntilGate();
}

/* =========================================================
   NEXT CHAPTER GATE
   ========================================================= */
function renderNextGate(step){
    if(!step.file){ return; }

    var html = '<div class="story-next" data-next-gate="' + escapeAttr(step.file) + '">' +
        '<div class="story-next-text">The story continues...</div>' +
        '<button type="button" class="story-next-button" data-next="' +
        escapeAttr(step.file) + '">' +
        escapeHtml(step.label) +
        '</button>' +
        '</div>';

    appendHtml(html);
}

function goToNextChapter(nextFile){
    if(!nextFile){ return; }

    nextFile = cleanPath(nextFile).replace(/\.md$/i,"");
    window.location.href = "article.html?file=" + encodeURIComponent(nextFile);
}

/* =========================================================
   SHOW OUTFIT
   ========================================================= */
function renderShowOutfit(){
    var outfit = "lexis_default";

    try{
        var saved = localStorage.getItem("ceeqwinn_player_state");
        if(saved){
            var state = JSON.parse(saved);
            if(state && state.characters && state.characters.lexis && state.characters.lexis.currentOutfit){
                outfit = state.characters.lexis.currentOutfit;
            }
        }
    }catch(e){}

    var images = {
        lexis_default:"/content/images/characters/lexis/outfits/lexis_default.png.jpeg",
        lexis_red_dress:"/content/images/characters/lexis/outfits/lexis_red_dress.png.jpeg",
        lexis_black_dress:"/content/images/characters/lexis/outfits/lexis_black_dress.png.jpeg"
    };

    var src = images[outfit] || images.lexis_default;

    return '<div class="story-outfit"><img src="' + escapeAttr(src) + '" alt="Lexis outfit" loading="lazy"></div>';
}

/* =========================================================
   CHOICES STORAGE
   ========================================================= */
function saveChoice(id,letter){
    var choices = getChoices();
    choices[id] = letter;

    try{
        localStorage.setItem(storageKey,JSON.stringify(choices));
    }catch(e){}
}

function getChoices(){
    try{
        var saved = localStorage.getItem(storageKey);
        if(!saved){ return {}; }
        var parsed = JSON.parse(saved);
        return parsed && typeof parsed === "object" ? parsed : {};
    }catch(e){
        return {};
    }
}

/* =========================================================
   RESET
   ========================================================= */
function updateResetButton(){
    var hasInteractive = false;

    for(var i=0;i<storySteps.length;i++){
        if(storySteps[i].type === "choice" || storySteps[i].type === "game"){
            hasInteractive = true;
            break;
        }
    }

    reset.style.display = hasInteractive ? "block" : "none";
}

reset.onclick = function(){
    try{
        localStorage.removeItem(storageKey);
        localStorage.removeItem("ceeqwinn_completed_games");
    }catch(e){}

    loadStory();
    window.scrollTo(0,0);
};

/* =========================================================
   EVENT DELEGATION
   ========================================================= */
document.addEventListener("click",function(event){
    var target = event.target;

    if(target.classList.contains("story-choice-button")){
        handleChoice(
            target.getAttribute("data-choice"),
            target.getAttribute("data-letter")
        );
        return;
    }

    if(target.classList.contains("story-game-button")){
        openGame(target.getAttribute("data-game"));
        return;
    }

    if(target.classList.contains("story-next-button")){
        goToNextChapter(target.getAttribute("data-next"));
    }
});

/* =========================================================
   MEDIA
   ========================================================= */
function mediaPath(src){
    if(!src){ return ""; }
    src = String(src).trim();

    if(/^https?:\/\//i.test(src) || /^data:/i.test(src) || src.charAt(0) === "/"){
        return src;
    }

    while(src.indexOf("../") === 0){ src = src.substring(3); }
    while(src.indexOf("./") === 0){ src = src.substring(2); }

    if(src.indexOf("content/") === 0){ return "/" + src; }
    return "/content/images/" + src;
}

function fixMedia(){
    var images = content.getElementsByTagName("img");
    var videos = content.getElementsByTagName("video");
    var audios = content.getElementsByTagName("audio");
    var i;

    for(i=0;i<images.length;i++){
        var imageSrc = images[i].getAttribute("src");
        if(imageSrc){ images[i].src = mediaPath(imageSrc); }
        images[i].setAttribute("loading","lazy");
    }

    for(i=0;i<videos.length;i++){
        var videoSrc = videos[i].getAttribute("src");
        if(videoSrc){ videos[i].src = mediaPath(videoSrc); }
        videos[i].controls = true;
    }

    for(i=0;i<audios.length;i++){
        var audioSrc = audios[i].getAttribute("src");
        if(audioSrc){ audios[i].src = mediaPath(audioSrc); }
        audios[i].controls = true;
    }
}

function renderExtraMedia(data){
    var html = "";

    if(data.video){
        html += '<h2>Video</h2><video controls preload="metadata"><source src="' +
            escapeAttr(mediaPath(data.video)) + '"></video>';
    }

    if(data.audio){
        html += '<h2>Audio</h2><audio controls preload="metadata"><source src="' +
            escapeAttr(mediaPath(data.audio)) + '"></audio>';
    }

    media.innerHTML = html;
}

/* =========================================================
   PATH + ESCAPING
   ========================================================= */
function cleanPath(path){
    path = String(path).replace(/\\/g,"/").replace(/^\/+/,"");
    var parts = path.split("/");
    var clean = [];

    for(var i=0;i<parts.length;i++){
        if(parts[i] && parts[i] !== "." && parts[i] !== ".."){
            clean.push(parts[i]);
        }
    }

    return clean.join("/");
}

function getStoryId(path){
    path = String(path).replace(/\.md$/i,"");
    path = path.replace(/-chapter-\d+$/i,"");
    return path;
}

function escapeHtml(value){
    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#39;");
}

function escapeAttr(value){
    return escapeHtml(value);
}

function cssEscape(value){
    return String(value).replace(/\\/g,"\\\\").replace(/"/g,'\\"');
}
