<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CEEQWINN Reader</title>

<style>

/* =========================================================
   BASE
   ========================================================= */

body{
    max-width:800px;
    margin:auto;
    padding:35px 18px;
    font-family:Arial,sans-serif;
    line-height:1.8;
    background:#fafafa;
    color:#222;
}

h1{
    font-size:2.2rem;
    margin-bottom:20px;
}

h2{
    margin-top:35px;
}

#cover{
    display:none;
    max-width:100%;
    height:auto;
    margin:0 auto 30px;
    border-radius:12px;
}

#credits{
    color:#666;
    margin-bottom:25px;
}

#status{
    color:#777;
}

#content{
    overflow-wrap:break-word;
}

#content img{
    display:block;
    max-width:100%;
    height:auto;
    margin:25px auto;
    border-radius:12px;
}

#content video,
#content audio{
    display:block;
    width:100%;
    max-width:100%;
    margin:25px auto;
}

#content blockquote{
    margin:25px 0;
    padding:10px 18px;
    border-left:4px solid #999;
    background:#f0f0f0;
}

#content table{
    width:100%;
    border-collapse:collapse;
    margin:25px 0;
}

#content th,
#content td{
    padding:8px;
    border:1px solid #ccc;
}


/* =========================================================
   CEEQWINN THEATRE
   ========================================================= */

#theatre{
    width:100%;
    margin:25px 0 35px;
    background:#151217;
    border-radius:16px;
    overflow:hidden;
    box-shadow:0 12px 30px rgba(0,0,0,.12);
}

.theatre-stage{
    position:relative;
    width:100%;
    height:0;
    padding-top:56.25%;
    overflow:hidden;
    background:
        linear-gradient(
            135deg,
            #18141a,
            #28212b
        );
}

.theatre-stage-layer{
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:100%;
    object-fit:cover;
    object-position:center center;
    opacity:0;
    transition:
        opacity .55s ease,
        transform .9s ease;
    transform:scale(1);
}

.theatre-stage-layer.is-visible{
    opacity:1;
}

.theatre-stage-layer.theatre-settle{
    transform:scale(1.015);
}

.theatre-empty{
    position:absolute;
    top:50%;
    left:50%;
    width:90%;
    transform:translate(-50%,-50%);
    text-align:center;
    color:rgba(255,255,255,.72);
    font-size:.95rem;
    letter-spacing:.03em;
}

.theatre-caption{
    padding:10px 15px;
    color:rgba(255,255,255,.78);
    font-size:.78rem;
    letter-spacing:.08em;
    text-transform:uppercase;
    background:rgba(0,0,0,.25);
}

.theatre-caption:empty{
    display:none;
}

.theatre-reading-glass{
    margin-top:-18px;
    position:relative;
    z-index:2;
    padding:20px 18px 5px;
    border-radius:16px 16px 0 0;
    background:rgba(250,250,250,.96);
}

.theatre-mode-choice #theatre{
    box-shadow:0 14px 35px rgba(0,0,0,.18);
}

.theatre-mode-game #theatre{
    box-shadow:0 14px 35px rgba(0,0,0,.22);
}

.theatre-mode-result #theatre{
    box-shadow:0 12px 30px rgba(0,0,0,.14);
}

.theatre-hidden{
    display:none !important;
}


/* =========================================================
   THEATRE VISUAL POSITIONING
   ========================================================= */

.theatre-shot-full .theatre-stage-layer{
    object-position:center center;
}

.theatre-shot-medium .theatre-stage-layer{
    object-position:center center;
}

.theatre-shot-close .theatre-stage-layer{
    object-position:center center;
}

.theatre-textsafe-bottom{
    --theatre-text-safe:bottom;
}

.theatre-textsafe-left{
    --theatre-text-safe:left;
}

.theatre-textsafe-right{
    --theatre-text-safe:right;
}


/* =========================================================
   STORY ENGINE
   ========================================================= */

.story-choice{
    margin:45px 0;
    padding:20px 0;
}

.story-choice-title{
    font-weight:bold;
    font-size:1.1rem;
    margin-bottom:15px;
}

.story-choice-button{
    display:block;
    width:100%;
    box-sizing:border-box;
    margin:10px 0;
    padding:15px;
    font:16px Arial,sans-serif;
    text-align:left;
    background:#fff;
    color:#222;
    border:1px solid #ccc;
    border-radius:8px;
    cursor:pointer;
}

.story-choice-button:hover{
    background:#f2f2f2;
}

.story-choice-button:disabled{
    cursor:default;
    opacity:.7;
}

.story-branch{
    margin-top:25px;
}

.story-choice-result{
    margin-top:25px;
}

.story-resume-anchor{
    display:block;
    width:100%;
    height:1px;
    margin:0;
    padding:0;
}


/* =========================================================
   NEXT CHAPTER
   ========================================================= */

.story-next{
    margin:55px 0 25px;
    padding:25px 0;
    text-align:center;
}

.story-next-text{
    margin-bottom:18px;
    color:#555;
    font-size:1rem;
}

.story-next-button{
    display:inline-block;
    padding:14px 22px;
    font:16px Arial,sans-serif;
    background:#222;
    color:#fff;
    border:none;
    border-radius:8px;
    cursor:pointer;
}

.story-next-button:hover{
    opacity:.85;
}


/* =========================================================
   GAME BRIDGE
   ========================================================= */

.story-game{
    margin:45px 0;
    padding:25px 0;
    text-align:center;
}

.story-game-title{
    font-weight:bold;
    font-size:1.15rem;
    margin-bottom:10px;
}

.story-game-text{
    color:#666;
    margin-bottom:18px;
}

.story-game-button{
    display:inline-block;
    padding:15px 24px;
    font:16px Arial,sans-serif;
    background:#222;
    color:#fff;
    border:none;
    border-radius:8px;
    cursor:pointer;
}

.story-game-button:hover{
    opacity:.85;
}

.story-game-complete{
    margin:30px 0;
    padding:15px;
    text-align:center;
    color:#666;
}


/* =========================================================
   SHOW OUTFIT
   ========================================================= */

.story-outfit{
    margin:35px 0;
    text-align:center;
}

.story-outfit img{
    display:block;
    width:100%;
    max-width:420px;
    height:auto;
    margin:0 auto;
    border-radius:12px;
}


/* =========================================================
   RESET
   ========================================================= */

#storyReset{
    display:none;
    width:100%;
    margin:35px 0;
    padding:12px;
    background:#f7f7f7;
    color:#555;
    border:1px dashed #aaa;
    border-radius:8px;
    cursor:pointer;
}

#storyReset:hover{
    background:#eeeeee;
}


/* =========================================================
   MOBILE
   ========================================================= */

@media(max-width:600px){

    body{
        padding:25px 15px;
    }

    h1{
        font-size:1.8rem;
    }

    .theatre-stage{
        padding-top:62%;
    }

    .theatre-caption{
        font-size:.7rem;
    }

    .theatre-reading-glass{
        padding-left:14px;
        padding-right:14px;
    }

    .story-choice-button{
        font-size:16px;
        padding:15px;
    }

    .story-next-button{
        width:100%;
        box-sizing:border-box;
    }

    .story-game-button{
        width:100%;
        box-sizing:border-box;
    }

}


/* =========================================================
   REDUCED MOTION
   ========================================================= */

@media(prefers-reduced-motion:reduce){

    .theatre-stage-layer{
        transition:none;
        transform:none !important;
    }

    html{
        scroll-behavior:auto;
    }

}

</style>

</head>

/* =========================================================

var theatreState = {

};


/* =========================================================

};


/* =========================================================
   OPTIONAL SCENE ALIASES
   =========================================================

   Leave these empty for now.

   Once the Markdown is supplied, we can connect exact
   story moments to the exact image filenames without
   changing the engine again.

   Example:

   "morning-after-A":
       "A_beautiful_young_woman_full_b.jpeg"

   ========================================================= */

var THEATRE_SCENE_ASSETS = {};


/* =========================================================
   ARTICLE FILE
   ========================================================= */

var params =
    new URLSearchParams(
        window.location.search
    );

var file =
    params.get("file") || "";

var returnGame =
    params.get("return") || "";

file =
    cleanPath(file);

returnGame =
    String(returnGame).trim();


/* =========================================================
   STORY ID
   ========================================================= */

var storyId =
    getStoryId(file);


/* =========================================================
   SHARED STORY STORAGE
   ========================================================= */

var storageKey =
    "ceeqwinn_story_history_" +
    storyId;


/* =========================================================
   STORY STATE
   ========================================================= */

var storyNodes = [];

var resumeAfterGameId = "";


/* =========================================================
   START
   ========================================================= */

if(!file){

    title.textContent =
        "Article not found";

    status.textContent =
        "No article was selected.";

}else{

    loadStory();

}


/* =========================================================
   LOAD MARKDOWN
   ========================================================= */

function loadStory(){

    status.textContent =
        "Loading...";

    content.innerHTML = "";

    media.innerHTML = "";

    cover.style.display =
        "none";

    resetTheatre();


    var xhr =
        new XMLHttpRequest();


    xhr.open(
        "GET",
        "../content/articles/" +
        encodeURIComponent(file) +
        ".md",
        true
    );


    xhr.onload =
        function(){

            if(
                xhr.status !== 200 &&
                xhr.status !== 0
            ){

                title.textContent =
                    "Unable to load article";

                status.textContent =
                    "The article could not be loaded.";

                return;

            }


            buildStory(
                xhr.responseText
            );

        };


    xhr.onerror =
        function(){

            title.textContent =
                "Unable to load article";

            status.textContent =
                "The article could not be loaded.";

        };


    xhr.send();

}


/* =========================================================
   BUILD STORY
   ========================================================= */

function buildStory(text){

    var data =
        parseFrontmatter(text);


    title.textContent =
        data.title || file;


    credits.innerHTML =
        data.credits
        ? "<strong>Credits:</strong> " +
          escapeHtml(data.credits)
        : "";


    if(data.cover){

        cover.src =
            mediaPath(data.cover);

        cover.alt =
            data.title || file;

        cover.style.display =
            "block";


        cover.onerror =
            function(){

                cover.style.display =
                    "none";

            };

    }


    storyNodes =
        parseStoryNodes(
            data.body.split(/\r?\n/)
        );


    if(returnGame){

        resumeAfterGameId =
            returnGame;

        returnGame = "";

    }


    renderProgress();

    fixMedia();

    renderExtraMedia(data);

    status.textContent = "";

}


/* =========================================================
   FRONTMATTER
   ========================================================= */

function parseFrontmatter(text){

    var data = {

        title:"",
        cover:"",
        credits:"",
        video:"",
        audio:"",
        body:text

    };


    text =
        String(text || "")
        .replace(/^\uFEFF/, "")
        .replace(/\r\n/g, "\n")
        .replace(/\r/g, "\n");


    var match =
        text.match(
            /^---[ \t]*\n([\s\S]*?)\n---[ \t]*(?:\n|$)/
        );


    if(!match){

        data.body =
            cleanLeadingArticleMetadata(text);

        return data;

    }


    var front =
        match[1];


    data.body =
        text.substring(
            match[0].length
        );


    data.title =
        frontValue(
            front,
            "title"
        );


    data.cover =
        frontValue(
            front,
            "cover"
        );


    data.credits =
        frontValue(
            front,
            "credits"
        );


    data.video =
        frontValue(
            front,
            "video"
        );


    data.audio =
        frontValue(
            front,
            "audio"
        );


    data.body =
        cleanLeadingArticleMetadata(
            data.body
        );


    return data;

}


/* =========================================================
   CLEAN LEADING ARTICLE METADATA
   ========================================================= */

function cleanLeadingArticleMetadata(text){

    var body =
        String(text || "")
        .replace(/^\uFEFF/, "")
        .replace(/\r\n/g, "\n")
        .replace(/\r/g, "\n");


    body =
        body.replace(
            /^\s*\n/,
            ""
        );


    var changed = true;


    while(changed){

        changed = false;


        var duplicateFront =
            body.match(
                /^---[ \t]*\n([\s\S]*?)\n---[ \t]*(?:\n|$)/
            );


        if(duplicateFront){

            var possibleMeta =
                duplicateFront[1];


            if(
                /^\s*(title|cover|credits|video|audio)\s*:/mi.test(
                    possibleMeta
                )
            ){

                body =
                    body.substring(
                        duplicateFront[0].length
                    );


                body =
                    body.replace(
                        /^\s*\n/,
                        ""
                    );


                changed = true;

            }

        }

    }


    body =
        body.replace(
            /^##[ \t]+title\s*:[^\n]*\n+/i,
            ""
        );


    body =
        body.replace(
            /^\s*\n/,
            ""
        );


    return body;

}


/* =========================================================
   FRONTMATTER VALUE
   ========================================================= */

function frontValue(
    text,
    key
){

    var re =
        new RegExp(
            "^" +
            key +
            "\\s*:\\s*[\"']?(.*?)[\"']?$",
            "mi"
        );


    var match =
        text.match(re);


    return match
        ? match[1].trim()
        : "";

}


/* =========================================================
   CLEAN CONTROL LINE
   ========================================================= */

function cleanControlLine(line){

    return String(line || "")
        .trim()
        .replace(/^\*+\s*/, "")
        .replace(/\s*\*+$/, "")
        .trim();

}


/* =========================================================
   MARKER TESTS
   ========================================================= */

function isGameMarker(line){

    return /^\[GAME:\s*[A-Z0-9_-]+\s*\]$/i.test(
        cleanControlLine(line)
    );

}


function isChoiceStart(line){

    return /^\[CHOICE:\s*[\w-]+\s*\]$/i.test(
        cleanControlLine(line)
    );

}


function isShowOutfitMarker(line){

    return /^\[SHOWOUTFIT\]$/i.test(
        cleanControlLine(line)
    );

}


function isNextMarker(line){

    return /^\[NEXT:\s*[^|\]]+(?:\|[^\]]+)?\s*\]$/i.test(
        cleanControlLine(line)
    );

}


function isIfMarker(line){

    return /^\[IF:\s*[\w-]+\s*=\s*[A-Z]\s*\]$/i.test(
        cleanControlLine(line)
    );

}


function isElseMarker(line){

    return /^\[ELSE\]$/i.test(
        cleanControlLine(line)
    );

}


function isEndIfMarker(line){

    return /^\[ENDIF\]$/i.test(
        cleanControlLine(line)
    );

}


function isEndChoiceMarker(line){

    return /^\[ENDCHOICE\]$/i.test(
        cleanControlLine(line)
    );

}


/* =========================================================
   THEATRE MARKER TESTS
   ========================================================= */

function isSceneMarker(line){

    return /^\[SCENE:\s*[^|\]]+(?:\|[^\]]+)?\s*\]$/i.test(
        cleanControlLine(line)
    );

}


function isBeatMarker(line){

    return /^\[BEAT:\s*[^\]]+\s*\]$/i.test(
        cleanControlLine(line)
    );

}


function isShotMarker(line){

    return /^\[SHOT:\s*(FULL|MEDIUM|CLOSE)\s*\]$/i.test(
        cleanControlLine(line)
    );

}


function isTextSafeMarker(line){

    return /^\[TEXTSAFE:\s*(BOTTOM|LEFT|RIGHT)\s*\]$/i.test(
        cleanControlLine(line)
    );

}


function isTransitionMarker(line){

    return /^\[TRANSITION:\s*(CUT|FADE|CROSSFADE|SLIDE-UP|SLIDE-DOWN|SLIDE-LEFT|SLIDE-RIGHT|SOFT-RISE|SUBTLE-ZOOM|DISSOLVE|ATMOSPHERIC-COLOR-TRANSITION)\s*\]$/i.test(
        cleanControlLine(line)
    );

}


function isFocusMarker(line){

    return /^\[FOCUS:\s*[^\]]+\s*\]$/i.test(
        cleanControlLine(line)
    );

}


/* =========================================================
   THEATRE MARKER READERS
   ========================================================= */

function getSceneDirective(line){

    var match =
        cleanControlLine(line).match(
            /^\[SCENE:\s*([^|\]]+?)(?:\|([^\]]+?))?\s*\]$/i
        );


    if(!match){

        return {
            id:"",
            image:""
        };

    }


    return {

        id:match[1].trim(),

        image:
            match[2]
            ? match[2].trim()
            : ""

    };

}


function getBeatId(line){

    var match =
        cleanControlLine(line).match(
            /^\[BEAT:\s*([^\]]+?)\s*\]$/i
        );


    return match
        ? match[1].trim()
        : "";

}


function getShotMode(line){

    var match =
        cleanControlLine(line).match(
            /^\[SHOT:\s*(FULL|MEDIUM|CLOSE)\s*\]$/i
        );


    return match
        ? match[1].toUpperCase()
        : "FULL";

}


function getTextSafeMode(line){

    var match =
        cleanControlLine(line).match(
            /^\[TEXTSAFE:\s*(BOTTOM|LEFT|RIGHT)\s*\]$/i
        );


    return match
        ? match[1].toUpperCase()
        : "BOTTOM";

}


function getTransitionMode(line){

    var match =
        cleanControlLine(line).match(
            /^\[TRANSITION:\s*(.+?)\s*\]$/i
        );


    return match
        ? match[1].toUpperCase()
        : "CROSSFADE";

}


function getFocusId(line){

    var match =
        cleanControlLine(line).match(
            /^\[FOCUS:\s*([^\]]+?)\s*\]$/i
        );


    return match
        ? match[1].trim()
        : "";

}


/* =========================================================
   GET GAME ID
   ========================================================= */

function getGameId(line){

    var match =
        cleanControlLine(line).match(
            /^\[GAME:\s*([A-Z0-9_-]+)\s*\]$/i
        );


    return match
        ? match[1].toUpperCase()
        : "";

}


/* =========================================================
   PARSE COMPLETE STORY INTO NODES
   ========================================================= */

function parseStoryNodes(lines){

    var result = [];

    var normal = [];

    var i = 0;


    function flushNormal(){

        if(normal.length){

            result.push({

                type:"markdown",

                text:normal.join("\n")

            });

            normal = [];

        }

    }


    while(i < lines.length){

        var line =
            lines[i];


        /* CONDITIONAL */

        if(isIfMarker(line)){

            flushNormal();


            var conditional =
                parseConditionalNode(
                    lines,
                    i
                );


            result.push(
                conditional.node
            );


            i =
                conditional.next;

            continue;

        }


        /* CHOICE */

        if(isChoiceStart(line)){

            flushNormal();


            var choice =
                parseChoiceNode(
                    lines,
                    i
                );


            result.push(
                choice.node
            );


            i =
                choice.next;

            continue;

        }


        /* GAME */

        if(isGameMarker(line)){

            flushNormal();


            result.push({

                type:"game",

                id:getGameId(line)

            });


            i++;

            continue;

        }


        /* SHOW OUTFIT */

        if(isShowOutfitMarker(line)){

            flushNormal();


            result.push({

                type:"outfit"

            });


            i++;

            continue;

        }


        /* NEXT CHAPTER */

        if(isNextMarker(line)){

            flushNormal();


            result.push({

                type:"next",

                line:cleanControlLine(line)

            });


            i++;

            continue;

        }


        /* THEATRE SCENE */

        if(isSceneMarker(line)){

            flushNormal();


            var scene =
                getSceneDirective(line);


            result.push({

                type:"theatre",

                directive:"scene",

                id:scene.id,

                image:scene.image

            });


            i++;

            continue;

        }


        /* THEATRE BEAT */

        if(isBeatMarker(line)){

            flushNormal();


            result.push({

                type:"theatre",

                directive:"beat",

                id:getBeatId(line)

            });


            i++;

            continue;

        }


        /* THEATRE SHOT */

        if(isShotMarker(line)){

            flushNormal();


            result.push({

                type:"theatre",

                directive:"shot",

                mode:getShotMode(line)

            });


            i++;

            continue;

        }


        /* THEATRE TEXT SAFE */

        if(isTextSafeMarker(line)){

            flushNormal();


            result.push({

                type:"theatre",

                directive:"textsafe",

                mode:getTextSafeMode(line)

            });


            i++;

            continue;

        }


        /* THEATRE TRANSITION */

        if(isTransitionMarker(line)){

            flushNormal();


            result.push({

                type:"theatre",

                directive:"transition",

                mode:getTransitionMode(line)

            });


            i++;

            continue;

        }


        /* THEATRE FOCUS */

        if(isFocusMarker(line)){

            flushNormal();


            result.push({

                type:"theatre",

                directive:"focus",

                id:getFocusId(line)

            });


            i++;

            continue;

        }


        /* STRUCTURAL MARKERS */

        if(
            isElseMarker(line) ||
            isEndIfMarker(line) ||
            isEndChoiceMarker(line)
        ){

            i++;

            continue;

        }


        normal.push(line);

        i++;

    }


    flushNormal();


    return result;

}


/* =========================================================
   PARSE CHOICE NODE
   ========================================================= */

function parseChoiceNode(
    lines,
    start
){

    var match =
        cleanControlLine(
            lines[start]
        ).match(
            /^\[CHOICE:\s*([\w-]+)\s*\]$/i
        );


    if(!match){

        return {

            node:{
                type:"markdown",
                text:""
            },

            next:start + 1

        };

    }


    var id =
        match[1];

    var options = [];

    var branches = {};

    var currentLetter =
        null;

    var currentLines = [];

    var i =
        start + 1;

    var choiceStarted =
        false;


    function saveBranch(){

        if(
            currentLetter !== null
        ){

            branches[
                currentLetter
            ] =
                parseStoryNodes(
                    currentLines
                );

            choiceStarted =
                true;

        }


        currentLines = [];

    }


    while(i < lines.length){

        var line =
            lines[i];

        var cleaned =
            cleanControlLine(line);


        var consequence =
            cleaned.match(
                /^\[CONSEQUENCE:\s*([A-Z])\s*\]$/i
            );


        if(consequence){

            saveBranch();


            currentLetter =
                consequence[1].toUpperCase();


            currentLines = [];

            i++;

            continue;

        }


        if(isEndChoiceMarker(line)){

            saveBranch();

            currentLetter =
                null;

            currentLines = [];

            i++;

            continue;

        }


        var option =
            cleaned.match(
                /^\[([A-Z])\]\s*(.+?)\s*$/i
            );


        if(
            option &&
            !choiceStarted &&
            currentLetter === null
        ){

            options.push({

                letter:
                    option[1].toUpperCase(),

                label:
                    option[2]

            });


            i++;

            continue;

        }


        if(
            currentLetter === null &&
            choiceStarted
        ){

            if(cleaned === ""){

                i++;

                continue;

            }


            if(
                isChoiceStart(line) ||
                isGameMarker(line) ||
                isShowOutfitMarker(line) ||
                isNextMarker(line) ||
                isIfMarker(line)
            ){

                break;

            }


            break;

        }


        if(
            currentLetter !== null
        ){

            currentLines.push(line);

        }


        i++;

    }


    saveBranch();


    return {

        node:{

            type:"choice",

            id:id,

            options:options,

            branches:branches

        },

        next:i

    };

}


/* =========================================================
   PARSE CONDITIONAL NODE
   ========================================================= */

function parseConditionalNode(
    lines,
    start
){

    var first =
        cleanControlLine(
            lines[start]
        ).match(
            /^\[IF:\s*([\w-]+)\s*=\s*([A-Z])\s*\]$/i
        );


    if(!first){

        return {

            node:{
                type:"markdown",
                text:""
            },

            next:start + 1

        };

    }


    var id =
        first[1];

    var letter =
        first[2].toUpperCase();


    var thenLines = [];

    var elseLines = [];

    var current =
        thenLines;

    var depth = 1;

    var i =
        start + 1;


    while(i < lines.length){

        var line =
            lines[i];


        if(isIfMarker(line)){

            depth++;

            current.push(line);

            i++;

            continue;

        }


        if(isEndIfMarker(line)){

            depth--;


            if(depth === 0){

                i++;

                break;

            }


            current.push(line);

            i++;

            continue;

        }


        if(
            depth === 1 &&
            isElseMarker(line)
        ){

            current =
                elseLines;

            i++;

            continue;

        }


        current.push(line);

        i++;

    }


    return {

        node:{

            type:"conditional",

            id:id,

            letter:letter,

            thenNodes:
                parseStoryNodes(
                    thenLines
                ),

            elseNodes:
                parseStoryNodes(
                    elseLines
                )

        },

        next:i

    };

}


/* =========================================================
   RENDER PROGRESS
   ========================================================= */

function renderProgress(){

    content.innerHTML = "";


    var result =
        executeNodes(
            storyNodes,
            content
        );


    if(result.hasProgress){

        reset.style.display =
            "block";

    }else{

        reset.style.display =
            "none";

    }


    fixMedia();


    if(resumeAfterGameId){

        var gameAnchor =
            content.querySelector(
                '[data-resume-game="' +
                cssEscape(
                    resumeAfterGameId
                ) +
                '"]'
            );


        resumeAfterGameId = "";


        if(gameAnchor){

            setTheatreMode("result");

            scrollToElement(
                gameAnchor
            );

        }

    }

}


/* =========================================================
   EXECUTE STORY NODES
   ========================================================= */

function executeNodes(
    nodes,
    target
){

    var result = {

        stopped:false,

        hasProgress:false

    };


    for(
        var i = 0;
        i < nodes.length;
        i++
    ){

        var node =
            nodes[i];


        /* =================================================
           MARKDOWN
           ================================================= */

        if(
            node.type ===
            "markdown"
        ){

            if(node.text.trim()){

                if(resumeAfterGameId){

                    target.insertAdjacentHTML(
                        "beforeend",
                        '<span class="story-resume-anchor" ' +
                        'data-resume-game="' +
                        escapeAttr(
                            resumeAfterGameId
                        ) +
                        '"></span>'
                    );


                    resumeAfterGameId = "";


                    target.insertAdjacentHTML(
                        "beforeend",
                        marked(node.text)
                    );

                }else{

                    target.insertAdjacentHTML(
                        "beforeend",
                        marked(node.text)
                    );

                }

            }


            continue;

        }


        /* =================================================
           THEATRE DIRECTIVES
           ================================================= */

        if(
            node.type ===
            "theatre"
        ){

            applyTheatreDirective(
                node
            );

            continue;

        }


        /* =================================================
           SHOW OUTFIT
           ================================================= */

        if(
            node.type ===
            "outfit"
        ){

            target.insertAdjacentHTML(
                "beforeend",
                renderShowOutfit()
            );

            continue;

        }


        /* =================================================
           CONDITIONAL
           ================================================= */

        if(
            node.type ===
            "conditional"
        ){

            var choices =
                getChoices();


            var selected =
                normalizeChoiceLetter(
                    choices[node.id]
                );


            if(
                selected ===
                node.letter
            ){

                var branchResult =
                    executeNodes(
                        node.thenNodes,
                        target
                    );


                if(branchResult.stopped){

                    result.stopped =
                        true;

                    result.hasProgress =
                        true;

                    return result;

                }

            }else{

                var elseResult =
                    executeNodes(
                        node.elseNodes,
                        target
                    );


                if(elseResult.stopped){

                    result.stopped =
                        true;

                    result.hasProgress =
                        true;

                    return result;

                }

            }


            continue;

        }


        /* =================================================
           CHOICE
           ================================================= */

        if(
            node.type ===
            "choice"
        ){

            result.hasProgress =
                true;


            var savedChoices =
                getChoices();


            var savedLetter =
                normalizeChoiceLetter(
                    savedChoices[node.id]
                );


            if(savedLetter){

                var savedBranch =
                    node.branches[
                        savedLetter
                    ] || [];


                var branchTarget =
                    document.createElement(
                        "div"
                    );


                branchTarget.className =
                    "story-choice-result";


                branchTarget.setAttribute(
                    "data-choice-result",
                    node.id
                );


                target.appendChild(
                    branchTarget
                );


                var branchResult =
                    executeNodes(
                        savedBranch,
                        branchTarget
                    );


                if(branchResult.stopped){

                    result.stopped =
                        true;

                    return result;

                }


                continue;

            }


            setTheatreMode("choice");


            target.insertAdjacentHTML(
                "beforeend",
                renderChoice(node)
            );


            result.stopped =
                true;


            return result;

        }


        /* =================================================
           GAME
           ================================================= */

        if(
            node.type ===
            "game"
        ){

            result.hasProgress =
                true;


            var completedGames =
                getCompletedGames();


            if(
                completedGames[
                    node.id
                ]
            ){

                continue;

            }


            setTheatreMode("game");


            target.insertAdjacentHTML(
                "beforeend",
                renderGame(
                    node.id
                )
            );


            result.stopped =
                true;


            return result;

        }


        /* =================================================
           NEXT CHAPTER
           ================================================= */

        if(
            node.type ===
            "next"
        ){

            result.hasProgress =
                true;


            setTheatreMode("result");


            target.insertAdjacentHTML(
                "beforeend",
                renderNext(
                    node.line
                )
            );


            result.stopped =
                true;


            return result;

        }

    }


    setTheatreMode("reading");


    return result;

}


/* =========================================================
   THEATRE DIRECTIVE EXECUTION
   ========================================================= */

function applyTheatreDirective(node){

    if(!node){

        return;

    }


    if(
        node.directive ===
        "scene"
    ){

        setTheatreScene(
            node.id,
            node.image
        );

        return;

    }


    if(
        node.directive ===
        "beat"
    ){

        theatreState.beat =
            node.id || "";

        theatre.className =
            "theatre-mode-reading";

        return;

    }


    if(
        node.directive ===
        "shot"
    ){

        setTheatreShot(
            node.mode
        );

        return;

    }


    if(
        node.directive ===
        "textsafe"
    ){

        setTheatreTextSafe(
            node.mode
        );

        return;

    }


    if(
        node.directive ===
        "transition"
    ){

        theatreState.transition =
            node.mode || "CROSSFADE";

        return;

    }


    if(
        node.directive ===
        "focus"
    ){

        theatreState.focus =
            node.id || "";

        return;

    }

}


/* =========================================================
   THEATRE SCENE
   ========================================================= */

function setTheatreScene(
    sceneId,
    explicitImage
){

    sceneId =
        String(sceneId || "")
        .trim();


    theatreState.sceneId =
        sceneId;


    var image =
        "";


    if(explicitImage){

        image =
            resolveTheatreAsset(
                explicitImage
            );

    }


    if(!image && sceneId){

        image =
            resolveTheatreAsset(
                THEATRE_SCENE_ASSETS[
                    sceneId
                ]
            );

    }


    if(image){

        setTheatreVisual(
            image
        );

    }else{

        theatreCaption.textContent =
            sceneId
            ? sceneId.replace(/[-_]+/g," ")
            : "";

        theatreEmpty.style.display =
            "block";

    }

}


/* =========================================================
   THEATRE ASSET RESOLUTION
   ========================================================= */

function resolveTheatreAsset(
    value
){

    if(!value){

        return "";

    }


    value =
        String(value)
        .trim();


    if(
        THEATRE_ASSETS[value]
    ){

        return THEATRE_ASSETS[value];

    }


    return mediaPath(value);

}


/* =========================================================
   THEATRE VISUAL
   ========================================================= */

function setTheatreVisual(
    src
){

    if(!src){

        theatreEmpty.style.display =
            "block";

        return;

    }


    src =
        mediaPath(src);


    var nextLayer =
        theatreState.activeLayer === "A"
        ? theatreLayerB
        : theatreLayerA;


    var currentLayer =
        theatreState.activeLayer === "A"
        ? theatreLayerA
        : theatreLayerB;


    var newImage =
        new Image();


    newImage.onload =
        function(){

            nextLayer.onload =
                null;

            nextLayer.src =
                src;

            nextLayer.alt =
                theatreState.sceneId
                ? theatreState.sceneId.replace(/[-_]+/g," ")
                : "Story scene";


            nextLayer.style.objectFit =
                "cover";


            theatreEmpty.style.display =
                "none";


            nextLayer.classList.remove(
                "theatre-settle"
            );


            nextLayer.classList.add(
                "is-visible"
            );


            currentLayer.classList.remove(
                "is-visible"
            );


            theatreState.activeLayer =
                theatreState.activeLayer === "A"
                ? "B"
                : "A";


            theatreState.imageSrc =
                src;


            theatreCaption.textContent =
                theatreState.sceneId
                ? theatreState.sceneId.replace(/[-_]+/g," ")
                : "";


            setTimeout(
                function(){

                    nextLayer.classList.add(
                        "theatre-settle"
                    );

                },
                40
            );

        };


    newImage.onerror =
        function(){

            theatreEmpty.style.display =
                "block";

        };


    newImage.src =
        src;

}


/* =========================================================
   THEATRE SHOT
   ========================================================= */

function setTheatreShot(
    mode
){

    mode =
        String(mode || "FULL")
        .toUpperCase();


    theatreState.shot =
        mode;


    theatreStage.classList.remove(
        "theatre-shot-full",
        "theatre-shot-medium",
        "theatre-shot-close"
    );


    if(mode === "MEDIUM"){

        theatreStage.classList.add(
            "theatre-shot-medium"
        );

    }else if(mode === "CLOSE"){

        theatreStage.classList.add(
            "theatre-shot-close"
        );

    }else{

        theatreStage.classList.add(
            "theatre-shot-full"
        );

    }

}


/* =========================================================
   THEATRE TEXT SAFE
   ========================================================= */

function setTheatreTextSafe(
    mode
){

    mode =
        String(mode || "BOTTOM")
        .toUpperCase();


    theatreState.textSafe =
        mode;


    content.classList.remove(
        "theatre-textsafe-bottom",
        "theatre-textsafe-left",
        "theatre-textsafe-right"
    );


    content.classList.add(
        "theatre-textsafe-" +
        mode.toLowerCase()
    );

}


/* =========================================================
   THEATRE MODE
   ========================================================= */

function setTheatreMode(
    mode
){

    mode =
        String(mode || "reading")
        .toLowerCase();


    document.body.classList.remove(
        "theatre-mode-reading",
        "theatre-mode-choice",
        "theatre-mode-game",
        "theatre-mode-result"
    );


    document.body.classList.add(
        "theatre-mode-" +
        mode
    );

}


/* =========================================================
   RESET THEATRE
   ========================================================= */

function resetTheatre(){

    theatreState = {

        activeLayer:"A",

        sceneId:"",

        imageSrc:"",

        shot:"FULL",

        textSafe:"BOTTOM",

        transition:"CROSSFADE",

        beat:"",

        focus:""

    };


    theatreLayerA.src =
        "";

    theatreLayerB.src =
        "";

    theatreLayerA.classList.remove(
        "is-visible",
        "theatre-settle"
    );

    theatreLayerB.classList.remove(
        "is-visible",
        "theatre-settle"
    );


    theatreEmpty.style.display =
        "block";


    theatreCaption.textContent =
        "";


    theatreStage.className =
        "theatre-stage";


    setTheatreMode(
        "reading"
    );

}


/* =========================================================
   RENDER CHOICE
   ========================================================= */

function renderChoice(node){

    var html =
        '<div class="story-choice" ' +
        'data-choice="' +
        escapeAttr(node.id) +
        '">' +

        '<div class="story-choice-title">' +
        'What do you do?' +
        '</div>';


    for(
        var i = 0;
        i < node.options.length;
        i++
    ){

        var option =
            node.options[i];


        html +=
            '<button ' +
            'type="button" ' +
            'class="story-choice-button" ' +
            'data-choice="' +
            escapeAttr(node.id) +
            '" ' +
            'data-letter="' +
            escapeAttr(option.letter) +
            '">' +

            escapeHtml(
                option.letter +
                " — " +
                option.label
            ) +

            '</button>';

    }


    html +=
        '</div>';


    return html;

}


/* =========================================================
   CHOICE CLICK
   ========================================================= */

document.addEventListener(
    "click",
    function(event){

        var target =
            event.target;


        if(
            !target.classList.contains(
                "story-choice-button"
            )
        ){

            return;

        }


        var id =
            target.getAttribute(
                "data-choice"
            );


        var letter =
            normalizeChoiceLetter(
                target.getAttribute(
                    "data-letter"
                )
            );


        if(
            !id ||
            !letter
        ){

            return;

        }


        var previousTop =
            window.pageYOffset ||
            document.documentElement.scrollTop ||
            document.body.scrollTop ||
            0;


        saveChoice(
            id,
            letter
        );


        setTheatreMode(
            "result"
        );


        renderProgress();


        setTimeout(
            function(){

                var branchResult =
                    content.querySelector(
                        '[data-choice-result="' +
                        cssEscape(id) +
                        '"]'
                    );


                if(branchResult){

                    scrollToElement(
                        branchResult
                    );

                    return;

                }


                try{

                    window.scrollTo(
                        0,
                        previousTop
                    );

                }catch(e){}

            },
            60
        );

    }
);


/* =========================================================
   SAVE CHOICE
   ========================================================= */

function saveChoice(
    id,
    letter
){

    var choices =
        getChoices();


    choices[id] =
        normalizeChoiceLetter(
            letter
        );


    try{

        localStorage.setItem(
            storageKey,
            JSON.stringify(
                choices
            )
        );

    }catch(e){}

}


/* =========================================================
   NORMALIZE CHOICE LETTER
   ========================================================= */

function normalizeChoiceLetter(value){

    if(
        value === null ||
        value === undefined
    ){

        return "";

    }


    return String(value)
        .trim()
        .toUpperCase();

}


/* =========================================================
   GET CHOICES
   ========================================================= */

function getChoices(){

    try{

        var saved =
            localStorage.getItem(
                storageKey
            );


        if(!saved){

            return {};

        }


        var parsed =
            JSON.parse(
                saved
            );


        if(
            parsed &&
            typeof parsed === "object" &&
            !Array.isArray(parsed)
        ){

            return parsed;

        }


        return {};

    }catch(e){

        return {};

    }

}


/* =========================================================
   GAME COMPLETION
   ========================================================= */

function getCompletedGames(){

    try{

        var saved =
            localStorage.getItem(
                "ceeqwinn_completed_games"
            );


        if(!saved){

            return {};

        }


        var parsed =
            JSON.parse(
                saved
            );


        return parsed &&
               typeof parsed === "object"
            ? parsed
            : {};

    }catch(e){

        return {};

    }

/* =========================================================
   SCROLL TO ELEMENT
   ========================================================= */

function scrollToElement(element){

    if(!element){

        return;

    }


    setTimeout(
        function(){

            try{

                element.scrollIntoView({

                    behavior:"smooth",

                    block:"start"

                });

            }catch(e){

                try{

                    window.scrollTo(
                        0,
                        Math.max(
                            0,
                            element.getBoundingClientRect().top +
                            (
                                window.pageYOffset ||
                                document.documentElement.scrollTop ||
                                document.body.scrollTop ||
                                0
                            ) -
                            20
                        )
                    );

                }catch(ignore){}

            }

        },
        100
    );

}


/* =========================================================
   SHOW OUTFIT
   ========================================================= */

function renderShowOutfit(){

    try{

        if(saved){

            var state =

            if(
                state &&
                state.characters &&
                state.characters.lexis &&
                state.characters.lexis.currentOutfit

    var images = {

        lexis_default:

        lexis_red_dress:

        lexis_black_dress:

/* =========================================================
   NEXT CHAPTER
   ========================================================= */

function renderNext(line){

    var cleaned =
        cleanControlLine(line);


    var match =
        cleaned.match(
            /^\[NEXT:\s*([^|\]]+?)\s*(?:\|\s*([^\]]+?)\s*)?\]$/i
        );


    if(!match){

        return "";

    }


    var nextFile =
        cleanPath(
            match[1]
        );


    nextFile =
        nextFile.replace(
            /\.md$/i,
            ""
        );


    var label =
        match[2]
        ? match[2].trim()
        : "Enter the next chapter";


    if(!nextFile){

        return "";

    }


    return (

        '<div class="story-next">' +

            '<div class="story-next-text">' +
                'The story continues...' +
            '</div>' +

            '<button ' +
                'type="button" ' +
                'class="story-next-button" ' +
                'data-next="' +
                escapeAttr(nextFile) +
                '">' +

                escapeHtml(label) +

            '</button>' +

        '</div>'

    );

}


/* =========================================================
   NEXT CHAPTER CLICK

document.addEventListener(

);

/* =========================================================
   STORY ID
   ========================================================= */

function getStoryId(path){

    path =
        String(path || "");


    path =
        path.replace(
            /\.md$/i,
            ""
        );


    path =
        path.replace(
            /-chapter-\d+$/i,
            ""
        );


    return path;

}


/* =========================================================
   MEDIA PATH
   ========================================================= */

function mediaPath(src){

    if(!src){

        return "";

    }


    src =
        String(src).trim();


    if(
        /^https?:\/\//i.test(src) ||
        /^data:/i.test(src) ||
        src.charAt(0) === "/"
    ){

        return src;

    }


    while(
        src.indexOf("../") === 0
    ){

        src =
            src.substring(3);

    }


    while(
        src.indexOf("./") === 0
    ){

        src =
            src.substring(2);

    }


    if(
        src.indexOf("content/") === 0
    ){

        return "/" + src;

    }


    return "/content/images/" + src;

}


/* =========================================================
   FIX MEDIA
   ========================================================= */

function fixMedia(){

    var images =
        content.getElementsByTagName(
            "img"
        );

    var videos =
        content.getElementsByTagName(
            "video"
        );

    var audios =
        content.getElementsByTagName(
            "audio"
        );


    var i;


    for(
        i = 0;
        i < images.length;
        i++
    ){

        var imageSrc =
            images[i].getAttribute(
                "src"
            );


        if(imageSrc){

            images[i].src =
                mediaPath(
                    imageSrc
                );

        }


        images[i].setAttribute(
            "loading",
            "lazy"
        );


        images[i].setAttribute(
            "decoding",
            "async"
        );

    }


    for(
        i = 0;
        i < videos.length;
        i++
    ){

        var videoSrc =
            videos[i].getAttribute(
                "src"
            );


        if(videoSrc){

            videos[i].src =
                mediaPath(
                    videoSrc
                );

        }


        videos[i].controls =
            true;

    }


    for(
        i = 0;
        i < audios.length;
        i++
    ){

        var audioSrc =
            audios[i].getAttribute(
                "src"
            );


        if(audioSrc){

            audios[i].src =
                mediaPath(
                    audioSrc
                );

        }


        audios[i].controls =
            true;

    }

}


/* =========================================================
   EXTRA MEDIA

function renderExtraMedia(data){

    var html = "";


    if(data.video){

        html +=

                'preload="metadata">' +

                '<source src="' +
                    escapeAttr(

                        )
                    ) +

    }


    if(data.audio){

        html +=

            '<h2>Audio</h2>' +

            '<audio ' +
                'controls ' +
                'preload="metadata">' +

                '<source src="' +
                    escapeAttr(
                        mediaPath(
                            data.audio
                        )
                    ) +
                '">' +

            '</audio>';

    }


    media.innerHTML =
        html;

}


/* =========================================================
   CLEAN PATH
   ========================================================= */

function cleanPath(path){

    path =
        String(path || "")
        .replace(
            /\\/g,
            "/"
        )
        .replace(
            /^\/+/,
            ""
        );


    var parts =
        path.split("/");


    var clean = [];


    for(
        var i = 0;
        i < parts.length;
        i++
    ){

        if(
            parts[i] &&
            parts[i] !== "." &&
            parts[i] !== ".."
        ){

            clean.push(
                parts[i]
            );

        }

    }


    return clean.join("/");

}


/* =========================================================
   HTML ESCAPING
   ========================================================= */

function escapeHtml(value){

    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#39;"
        );

}


function escapeAttr(value){

    return escapeHtml(
        value
    );

}


/* =========================================================
   SIMPLE CSS ESCAPE
   ========================================================= */

function cssEscape(value){

    return String(value)

        .replace(
            /\\/g,
            "\\\\"
        )

        .replace(
            /"/g,
            '\\"'
        );

}
