<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CEEQWINN Reader</title>

<style>

body{
    max-width:800px;
    margin:auto;
    padding:40px 20px;
    font-family:Arial,sans-serif;
    line-height:1.8;
    background:#fafafa;
    color:#222;
}

h1{
    font-size:2.2rem;
    margin-bottom:20px;
}

#content{
    overflow-wrap:break-word;
}

/* INLINE IMAGES + GIFS */

#content img{
    display:block;
    max-width:100%;
    height:auto;
    margin:24px auto;
    border-radius:12px;
}

/* VIDEO */

#content video{
    display:block;
    width:100%;
    max-width:100%;

    margin:24px auto;

#content audio{
    display:block;

<body>

<h1 id="title">Loading...</h1>

<div id="status">
    Loading article...
</div>

<div id="content"></div>


<!--
    Older, more compatible version of Marked.
    This is intentionally used instead of the newest
    version so older Android browsers have a better chance
    of rendering the article.
-->
<script src="https://cdn.jsdelivr.net/npm/marked@0.3.19/marked.min.js"></script>


<script>

/*
========================================================
CEEQWINN ARTICLE READER
Legacy-browser-compatible version
========================================================
*/


/*
--------------------------------------------------------
GET ?file= FROM THE URL

We do not use URLSearchParams because older Android
browsers may not support it.
--------------------------------------------------------
*/

function getQueryParameter(name){

    var query =
        window.location.search.substring(1);

    var parts =
        query.split("&");

    var i;
    var pair;
    var key;
    var value;

    for(i = 0; i < parts.length; i++){

        if(!parts[i]){
            continue;
        }

        pair =
            parts[i].split("=");

        key =
            decodeURIComponent(pair[0]);

        if(key === name){

            value =
                pair.length > 1
                ? pair.slice(1).join("=")
                : "";

            return decodeURIComponent(value);

        }

    }

    return null;
}


/*
--------------------------------------------------------
GET ARTICLE FILE
--------------------------------------------------------
*/

var file =
    getQueryParameter("file");


/*
--------------------------------------------------------
PAGE ELEMENTS
--------------------------------------------------------
*/

var titleElement =
    document.getElementById("title");

var statusElement =
    document.getElementById("status");

var contentElement =
    document.getElementById("content");


/*
--------------------------------------------------------
NO ARTICLE SELECTED
--------------------------------------------------------
*/

if(!file){

    titleElement.innerHTML =
        "Article not found";

    statusElement.innerHTML =
        "No article was selected.";

}else{


    /*
    ----------------------------------------------------
    SECURITY: ONLY ALLOW SIMPLE ARTICLE SLUGS
    ----------------------------------------------------
    */

    var safeSlug =
        file.replace(/[^a-zA-Z0-9_-]/g, "");


    /*
    ----------------------------------------------------
    ARTICLE LOCATION
    ----------------------------------------------------

    article.html is inside /admin/

    ../content/articles/
    therefore points to:

    /content/articles/
    ----------------------------------------------------
    */

    var articleURL =
        "../content/articles/" +
        safeSlug +
        ".md";


    /*
    ----------------------------------------------------
    USE XMLHttpRequest INSTEAD OF FETCH

    XMLHttpRequest works on much older browsers,
    including older Android browser versions.
    ----------------------------------------------------
    */

    var request =
        new XMLHttpRequest();


    request.open(
        "GET",
        articleURL,
        true
    );


    /*
    ----------------------------------------------------
    ARTICLE LOADED
    ----------------------------------------------------
    */

    request.onreadystatechange = function(){

        if(
            request.readyState === 4
        ){

            if(
                request.status === 200 ||
                request.status === 0
            ){

                renderArticle(
                    request.responseText
                );

            }else{

                showError(
                    "The article could not be loaded."
                );

            }

        }

    };


    /*
    ----------------------------------------------------
    NETWORK ERROR
    ----------------------------------------------------
    */

    request.onerror = function(){

        showError(
            "The article could not be loaded."
        );

    };


    /*
    ----------------------------------------------------
    START REQUEST
    ----------------------------------------------------
    */

    try{

        request.send(null);

    }catch(error){

        showError(
            "The article could not be loaded."
        );

    }

}


/*
========================================================
RENDER ARTICLE
========================================================
*/

function renderArticle(text){

    var markdown =
        text;

    var articleTitle =
        safeSlug;


    /*
    ----------------------------------------------------
    FRONT MATTER
    ----------------------------------------------------
    */

    var frontMatterMatch =
        text.match(
            /^---\s*([\s\S]*?)\s*---\s*/
        );


    if(frontMatterMatch){

        var frontMatter =
            frontMatterMatch[1];


        /*
        ------------------------------------------------
        GET TITLE
        ------------------------------------------------
        */

        var titleMatch =
            frontMatter.match(
                /^title:\s*["']?(.*?)["']?\s*$/m
            );


        if(titleMatch){

            articleTitle =
                titleMatch[1].replace(
                    /^["']|["']$/g,
                    ""
                ).replace(
                    /^\s+|\s+$/g,
                    ""
                );

        }


        /*
        ------------------------------------------------
        REMOVE FRONT MATTER FROM ARTICLE BODY
        ------------------------------------------------
        */

        markdown =
            text.replace(
                /^---\s*[\s\S]*?\s*---\s*/,
                ""
            );

    }


    /*
    ----------------------------------------------------
    SET ARTICLE TITLE
    ----------------------------------------------------
    */

    titleElement.innerHTML =
        escapeHTML(articleTitle);


    /*
    ----------------------------------------------------
    RENDER MARKDOWN
    ----------------------------------------------------
    */

    try{

        contentElement.innerHTML =
            marked(markdown);

    }catch(error){

        showError(
            "The article could not be displayed."
        );

        return;

    }


    /*
    ----------------------------------------------------
    DOWNLOAD LINKS
    ----------------------------------------------------
    */

    setupDownloadLinks();


    /*
    ----------------------------------------------------
    VIDEO CONTROLS
    ----------------------------------------------------
    */

    setupVideos();


    /*
    ----------------------------------------------------
    AUDIO CONTROLS
    ----------------------------------------------------
    */

    setupAudio();


    /*
    ----------------------------------------------------
    CLEAR LOADING MESSAGE
    ----------------------------------------------------
    */

    statusElement.innerHTML = "";

}


/*
========================================================
DOWNLOAD LINKS
========================================================
*/

function setupDownloadLinks(){

    var links =
        contentElement.getElementsByTagName("a");

    var i;
    var link;
    var href;
    var lower;


    for(i = 0; i < links.length; i++){

        link =
            links[i];

        href =
            link.getAttribute("href");


        if(!href){
            continue;
        }


        lower =
            href.toLowerCase();


        if(
            endsWith(lower, ".pdf") ||
            endsWith(lower, ".zip") ||
            endsWith(lower, ".doc") ||
            endsWith(lower, ".docx") ||
            endsWith(lower, ".txt")
        ){

            addClass(
                link,
                "download"
            );

            link.setAttribute(
                "download",
                ""
            );

        }

    }

}


/*
========================================================
VIDEO CONTROLS
========================================================
*/

function setupVideos(){

    var videos =
        contentElement.getElementsByTagName("video");

    var i;

    for(i = 0; i < videos.length; i++){

        videos[i].controls = true;

        videos[i].setAttribute(
            "preload",
            "metadata"
        );

    }

}


/*
========================================================
AUDIO CONTROLS
========================================================
*/

function setupAudio(){

    var audios =
        contentElement.getElementsByTagName("audio");

    var i;

    for(i = 0; i < audios.length; i++){

        audios[i].controls = true;

        audios[i].setAttribute(
            "preload",
            "metadata"
        );

    }

}


/*
========================================================
ERROR HANDLER
========================================================
*/

function showError(message){

    titleElement.innerHTML =
        "Unable to load article";

    statusElement.innerHTML =
        message;

}


/*
========================================================
HELPER: ENDS WITH
========================================================
*/

function endsWith(text, ending){

    return text.indexOf(
        ending,
        text.length - ending.length
    ) !== -1;

}


/*
========================================================
HELPER: ADD CLASS
========================================================
*/

function addClass(element, className){

    if(
        (" " + element.className + " ")
        .indexOf(
            " " + className + " "
        ) === -1
    ){

        element.className +=
            (
                element.className
                ? " "
                : ""
            ) + className;

    }

}


/*
========================================================
HELPER: BASIC HTML ESCAPING
========================================================
*/

function escapeHTML(text){

    return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}

</script>

</body>

</html>
