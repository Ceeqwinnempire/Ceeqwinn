<!-- MARKED -->
<script src="https://cdn.jsdelivr.net/npm/marked@0.3.19/marked.min.js"></script>


<script>

/* =========================================================
   GET ARTICLE NAME
========================================================= */

var search = window.location.search;

var file = "";

if(search){

    var match = search.match(/[?&]file=([^&]+)/);

    if(match){

        try{
            file = decodeURIComponent(match[1]);
        }catch(e){
            file = match[1];
        }

    }

}


/* =========================================================
   PAGE ELEMENTS
========================================================= */

var title = document.getElementById("title");
var status = document.getElementById("status");
var content = document.getElementById("content");
var cover = document.getElementById("cover");
var credits = document.getElementById("credits");
var media = document.getElementById("media");
var storyReset = document.getElementById("storyReset");


/* =========================================================
   STORY STORAGE
========================================================= */

var currentStoryKey =
    "ceeqwinn_story_choices_" +
    cleanStorageKey(file);


/* =========================================================
   START
========================================================= */

if(!file){

    title.innerHTML = "Article not found";

    status.innerHTML =
        "No article was selected.";

}else{

    loadStory(file);

}


/* =========================================================
   RESET BUTTON
========================================================= */

storyReset.onclick = function(){

    resetCurrentStory();

};


function resetCurrentStory(){

    try{

        localStorage.removeItem(currentStoryKey);

    }catch(e){}

    loadStory(file);

    try{
        window.scrollTo(0,0);
    }catch(e){}

}


/* =========================================================
   STORAGE KEY
========================================================= */

function cleanStorageKey(value){

    if(!value){
        return "article";
    }

    return String(value)
        .replace(/[^a-zA-Z0-9_-]/g,"_");

}


/* =========================================================
   LOAD ARTICLE
========================================================= */

function loadStory(storyFile){

    storyFile = cleanArticlePath(storyFile);

    if(!storyFile){

        title.innerHTML = "Article not found";

        status.innerHTML =
            "The article path is invalid.";

        return;

    }


    currentStoryKey =
        "ceeqwinn_story_choices_" +
        cleanStorageKey(storyFile);


    status.innerHTML = "Loading...";

    storyReset.style.display = "none";


    /*
       IMPORTANT:

       article.html is in the ROOT.

       Markdown files are in:

       content/articles/

       Therefore we DO NOT use ../
    */

    var path =
        "content/articles/" +
        encodeArticlePath(storyFile) +
        ".md";


    fetchArticle(path);

}


/* =========================================================
   LOAD MARKDOWN
========================================================= */

function fetchArticle(path){

    var xhr = new XMLHttpRequest();

    xhr.open("GET",path,true);

    xhr.onreadystatechange = function(){

        if(xhr.readyState !== 4){
            return;
        }


        if(xhr.status !== 200 && xhr.status !== 0){

            title.innerHTML =
                "Unable to load article";

            status.innerHTML =
                "The article could not be loaded.";

            return;

        }


        var text = xhr.responseText;


        if(!text){

            title.innerHTML =
                "Empty article";

            status.innerHTML =
                "The Markdown file contains no readable content.";

            return;

        }


        renderArticle(text);

    };


    xhr.onerror = function(){

        title.innerHTML =
            "Unable to load article";

        status.innerHTML =
            "The article could not be loaded.";

    };


    xhr.send(null);

}


/* =========================================================
   RENDER ARTICLE
========================================================= */

function renderArticle(text){

    var frontData =
        parseFrontmatter(text);


    var articleTitle =
        frontData.title ||
        getFileName(file);


    title.innerHTML =
        escapeHtml(articleTitle);


    /* COVER */

    cover.style.display = "none";

    if(frontData.cover){

        cover.src =
            mediaPath(frontData.cover);

        cover.alt =
            articleTitle;

        cover.style.display =
            "block";

        cover.onerror = function(){

            cover.style.display =
                "none";

        };

    }


    /* CREDITS */

    credits.innerHTML = "";

    if(frontData.credits){

        credits.innerHTML =
            "<strong>Credits:</strong> " +
            escapeHtml(frontData.credits);

    }


    /* STORY */

    content.innerHTML =
        renderInteractiveStory(
            frontData.body
        );


    /* INLINE MEDIA */

    fixInlineImages();

    fixInlineVideos();

    fixInlineAudios();


    /* EXTRA MEDIA */

    renderExtraMedia(frontData);


    /* ACTIVATE CHOICES */

    activateStoryChoices();


    /* RESET BUTTON */

    if(
        content.getElementsByClassName(
            "story-choice"
        ).length > 0
    ){

        storyReset.style.display =
            "block";

    }else{

        storyReset.style.display =
            "none";

    }


    status.innerHTML = "";

}


/* =========================================================
   INTERACTIVE STORY RENDERER
========================================================= */

function renderInteractiveStory(body){

    var result =
        parseStorySegment(body,0);

    return result.html;

}


/* =========================================================
   PARSE STORY SEGMENT
========================================================= */

function parseStorySegment(text,startIndex){

    var lines =
        text.split(/\r?\n/);

    var html = "";

    var normalLines = [];

    var i =
        startIndex || 0;


    while(i < lines.length){

        /* CHOICE */

        if(
            /^\s*\[CHOICE:([a-zA-Z0-9_-]+)\]\s*$/.test(
                lines[i]
            )
        ){

            if(normalLines.length){

                html +=
                    marked(
                        normalLines.join("\n")
                    );

                normalLines = [];

            }


            var choiceResult =
                parseChoiceBlock(
                    lines,
                    i
                );


            html +=
                choiceResult.html;


            i =
                choiceResult.nextIndex;

            continue;

        }


        normalLines.push(lines[i]);

        i++;

    }


    if(normalLines.length){

        html +=
            marked(
                normalLines.join("\n")
            );

    }


    return {
        html:html,
        nextIndex:i
    };

}


/* =========================================================
   PARSE CHOICE
========================================================= */

function parseChoiceBlock(lines,startIndex){

    var match =
        lines[startIndex].match(
            /^\s*\[CHOICE:([a-zA-Z0-9_-]+)\]\s*$/
        );


    if(!match){

        return {
            html:"",
            nextIndex:startIndex + 1
        };

    }


    var choiceId =
        match[1];

    var options = [];

    var branches = [];

    var currentBranch = null;

    var i =
        startIndex + 1;


    while(i < lines.length){

        var line =
            lines[i];


        /* END */

        if(
            /^\s*\[ENDCHOICE\]\s*$/.test(line)
        ){

            break;

        }


        /* OPTION */

        var optionMatch =
            line.match(
                /^\s*\[([A-Z])\]\s*(.+?)\s*$/
            );


        if(
            optionMatch &&
            currentBranch === null
        ){

            options.push({

                letter:
                    optionMatch[1],

                label:
                    optionMatch[2]

            });

            i++;

            continue;

        }


        /* CONSEQUENCE */

        var consequenceMatch =
            line.match(
                /^\s*\[CONSEQUENCE:([A-Z])\]\s*$/
            );


        if(consequenceMatch){

            currentBranch = {

                letter:
                    consequenceMatch[1],

                lines:[]

            };


            branches.push(
                currentBranch
            );


            i++;

            continue;

        }


        /* BRANCH CONTENT */

        if(currentBranch){

            currentBranch.lines.push(line);

        }


        i++;

    }


    /* CHOICE BUTTONS */

    var html =
        '<div class="story-choice" ' +
        'data-choice-id="' +
        escapeAttribute(choiceId) +
        '">' +

        '<div class="story-choice-title">' +
        'What does Lexis do?' +
        '</div>';


    var j;


    for(j=0;j<options.length;j++){

        html +=
            '<button ' +
            'type="button" ' +
            'class="story-choice-button" ' +

            'data-choice-id="' +
            escapeAttribute(choiceId) +
            '" ' +

            'data-choice-letter="' +
            escapeAttribute(
                options[j].letter
            ) +
            '">' +

            escapeHtml(
                options[j].letter +
                " — " +
                options[j].label
            ) +

            '</button>';

    }


    html +=
        '</div>';


    /* BRANCHES */

    for(j=0;j<branches.length;j++){

        var branch =
            branches[j];


        var branchResult =
            parseStorySegment(
                branch.lines.join("\n"),
                0
            );


        html +=
            '<div ' +
            'class="story-branch story-hidden" ' +

            'data-choice-id="' +
            escapeAttribute(choiceId) +
            '" ' +

            'data-choice-letter="' +
            escapeAttribute(
                branch.letter
            ) +
            '">' +

            branchResult.html +

            '</div>';

    }


    /* MOVE PAST ENDCHOICE */

    if(i < lines.length){
        i++;
    }


    return {
        html:html,
        nextIndex:i
    };

}


/* =========================================================
   ACTIVATE CHOICES
========================================================= */

function activateStoryChoices(){

    var buttons =
        content.getElementsByClassName(
            "story-choice-button"
        );


    var i;


    for(i=0;i<buttons.length;i++){

        activateChoiceButton(
            buttons[i]
        );

    }


    restoreSavedChoices();

}


/* =========================================================
   ONE CHOICE BUTTON
========================================================= */

function activateChoiceButton(button){

    button.onclick = function(){

        var choiceId =
            button.getAttribute(
                "data-choice-id"
            );


        var letter =
            button.getAttribute(
                "data-choice-letter"
            );


        selectStoryChoice(
            choiceId,
            letter
        );

    };

}


/* =========================================================
   SELECT CHOICE
========================================================= */

function selectStoryChoice(choiceId,letter){

    saveStoryChoice(
        choiceId,
        letter
    );


    showSelectedBranch(
        choiceId,
        letter
    );

}


/* =========================================================
   SAVE CHOICE
========================================================= */

function saveStoryChoice(choiceId,letter){

    try{

        var saved =
            localStorage.getItem(
                currentStoryKey
            );


        var choices = {};


        if(saved){

            try{

                choices =
                    JSON.parse(saved);

            }catch(e){

                choices = {};

            }

        }


        choices[choiceId] =
            letter;


        localStorage.setItem(
            currentStoryKey,
            JSON.stringify(choices)
        );

    }catch(e){}

}


/* =========================================================
   GET SAVED CHOICE
========================================================= */

function getSavedStoryChoice(choiceId){

    try{

        var saved =
            localStorage.getItem(
                currentStoryKey
            );


        if(!saved){
            return null;
        }


        var choices =
            JSON.parse(saved);


        if(
            choices &&
            choices[choiceId]
        ){

            return choices[choiceId];

        }

    }catch(e){}


    return null;

}


/* =========================================================
   SHOW BRANCH
========================================================= */

function showSelectedBranch(choiceId,letter){

    var choices =
        content.getElementsByClassName(
            "story-choice"
        );


    var branches =
        content.getElementsByClassName(
            "story-branch"
        );


    var i;


    /* HIDE CHOICE */

    for(i=0;i<choices.length;i++){

        if(
            choices[i].getAttribute(
                "data-choice-id"
            ) === choiceId
        ){

            choices[i].style.display =
                "none";

        }

    }


    /* HIDE ALL BRANCHES */

    for(i=0;i<branches.length;i++){

        if(
            branches[i].getAttribute(
                "data-choice-id"
            ) === choiceId
        ){

            branches[i].className =
                "story-branch story-hidden";

        }

    }


    /* SHOW SELECTED */

    for(i=0;i<branches.length;i++){

        if(
            branches[i].getAttribute(
                "data-choice-id"
            ) === choiceId &&

            branches[i].getAttribute(
                "data-choice-letter"
            ) === letter
        ){

            branches[i].className =
                "story-branch";

        }

    }

}


/* =========================================================
   RESTORE SAVED CHOICES
========================================================= */

function restoreSavedChoices(){

    var choices =
        content.getElementsByClassName(
            "story-choice"
        );


    var i;
    var choiceId;
    var savedLetter;


    for(i=0;i<choices.length;i++){

        choiceId =
            choices[i].getAttribute(
                "data-choice-id"
            );


        savedLetter =
            getSavedStoryChoice(
                choiceId
            );


        if(savedLetter){

            showSelectedBranch(
                choiceId,
                savedLetter
            );

        }

    }

}


/* =========================================================
   CLEAN ARTICLE PATH
========================================================= */

function cleanArticlePath(path){

    if(!path){
        return "";
    }


    path =
        String(path)
        .replace(/\\/g,"/");


    path =
        path.replace(/^\/+/,"");


    var parts =
        path.split("/");


    var clean = [];

    var i;
    var part;


    for(i=0;i<parts.length;i++){

        part =
            parts[i].trim();


        if(!part){
            continue;
        }


        if(
            part === "." ||
            part === ".."
        ){

            return "";

        }


        clean.push(part);

    }


    return clean.join("/");

}


/* =========================================================
   ENCODE ARTICLE PATH
========================================================= */

function encodeArticlePath(path){

    var parts =
        path.split("/");

    var encoded = [];

    var i;


    for(i=0;i<parts.length;i++){

        encoded.push(
            encodeURIComponent(
                parts[i]
            )
        );

    }


    return encoded.join("/");

}


/* =========================================================
   FRONTMATTER
========================================================= */

function parseFrontmatter(text){

    var result = {

        title:"",
        cover:"",
        credits:"",
        video:"",
        audio:"",
        downloads:[],
        body:text

    };


    var match =
        text.match(
            /^---\s*\r?\n([\s\S]*?)\r?\n---\s*\r?\n?/
        );


    if(!match){

        return result;

    }


    var front =
        match[1];


    result.body =
        text.substring(
            match[0].length
        );


    var titleMatch =
        front.match(
            /^title:\s*(.+)$/m
        );


    if(titleMatch){

        result.title =
            cleanValue(
                titleMatch[1]
            );

    }


    var coverMatch =
        front.match(
            /^cover:\s*(.+)$/m
        );


    if(coverMatch){

        result.cover =
            cleanValue(
                coverMatch[1]
            );

    }


    var creditsMatch =
        front.match(
            /^credits:\s*(.+)$/m
        );


    if(creditsMatch){

        result.credits =
            cleanValue(
                creditsMatch[1]
            );

    }


    var videoMatch =
        front.match(
            /^video:\s*(.+)$/m
        );


    if(videoMatch){

        result.video =
            cleanValue(
                videoMatch[1]
            );

    }


    var audioMatch =
        front.match(
            /^audio:\s*(.+)$/m
        );


    if(audioMatch){

        result.audio =
            cleanValue(
                audioMatch[1]
            );

    }


    /* DOWNLOADS */

    var downloadLines =
        front.split(/\r?\n/);


    var insideDownloads = false;

    var i;


    for(i=0;i<downloadLines.length;i++){

        var line =
            downloadLines[i];


        if(
            /^downloads:\s*$/.test(line)
        ){

            insideDownloads = true;

            continue;

        }


        if(insideDownloads){

            if(
                /^[a-zA-Z0-9_-]+\s*:/.test(line)
            ){

                insideDownloads = false;

                continue;

            }


            var downloadMatch =
                line.match(
                    /^\s*-\s*(.+)$/
                );


            if(downloadMatch){

                result.downloads.push(
                    cleanValue(
                        downloadMatch[1]
                    )
                );

            }

        }

    }


    return result;

}


/* =========================================================
   CLEAN FRONTMATTER VALUE
========================================================= */

function cleanValue(value){

    value =
        String(value)
        .replace(/^\s+/,"")
        .replace(/\s+$/,"");


    if(
        value.length >= 2 &&
        (
            (
                value.charAt(0) === '"' &&
                value.charAt(value.length-1) === '"'
            )
            ||
            (
                value.charAt(0) === "'" &&
                value.charAt(value.length-1) === "'"
            )
        )
    ){

        value =
            value.substring(
                1,
                value.length - 1
            );

    }


    return value;

}


/* =========================================================
   INLINE IMAGES
========================================================= */

function fixInlineImages(){

    var images =
        content.getElementsByTagName("img");


    var i;


    for(i=0;i<images.length;i++){

        var src =
            images[i].getAttribute("src");


        if(src){

            images[i].src =
                mediaPath(src);

        }


        images[i].onerror =
            function(){

                this.alt =
                    "Image could not be loaded.";

                this.style.opacity =
                    "0.6";

            };

    }

}


/* =========================================================
   INLINE VIDEOS
========================================================= */

function fixInlineVideos(){

    var videos =
        content.getElementsByTagName("video");


    var i;


    for(i=0;i<videos.length;i++){

        var src =
            videos[i].getAttribute("src");


        if(src){

            videos[i].src =
                mediaPath(src);

        }


        videos[i].controls = true;

    }

}


/* =========================================================
   INLINE AUDIO
========================================================= */

function fixInlineAudios(){

    var audios =
        content.getElementsByTagName("audio");


    var i;


    for(i=0;i<audios.length;i++){

        var src =
            audios[i].getAttribute("src");


        if(src){

            audios[i].src =
                mediaPath(src);

        }


        audios[i].controls = true;

    }

}


/* =========================================================
   EXTRA MEDIA
========================================================= */

function renderExtraMedia(data){

    var html = "";


    if(data.video){

        html +=
            '<div class="media-box">' +

            '<h2 class="media-title">Video</h2>' +

            '<video controls preload="metadata" width="100%">' +

            '<source src="' +
            escapeAttribute(
                mediaPath(data.video)
            ) +
            '">' +

            'Your browser cannot play this video.' +

            '</video>' +

            '</div>';

    }


    if(data.audio){

        html +=
            '<div class="media-box">' +

            '<h2 class="media-title">Audio</h2>' +

            '<audio controls preload="metadata">' +

            '<source src="' +
            escapeAttribute(
                mediaPath(data.audio)
            ) +
            '">' +

            'Your browser cannot play this audio.' +

            '</audio>' +

            '</div>';

    }


    if(data.downloads.length){

        html +=
            '<div class="media-box">' +

            '<h2 class="media-title">Downloads</h2>';


        var i;


        for(i=0;i<data.downloads.length;i++){

            html +=
                '<p>' +

                '<a href="' +
                escapeAttribute(
                    mediaPath(
                        data.downloads[i]
                    )
                ) +
                '" download>' +

                'Download file ' +
                (i + 1) +

                '</a>' +

                '</p>';

        }


        html +=
            '</div>';

    }


    media.innerHTML =
        html;

}


/* =========================================================
   MEDIA PATH
========================================================= */

function mediaPath(src){

    if(!src){
        return "";
    }


    src =
        String(src)
        .replace(/^<|>$/g,"")
        .trim();


    /* External URLs */

    if(
        src.indexOf("http://") === 0 ||
        src.indexOf("https://") === 0 ||
        src.indexOf("data:") === 0
    ){

        return src;

    }


    /* Root-relative path */

    if(src.charAt(0) === "/"){

        return src;

    }


    /* Remove relative prefixes */

    while(
        src.indexOf("../") === 0
    ){

        src =
            src.substring(3);

    }


    while(
        src.indexOf("./") === 0
    ){

        src =
            src.substring(2);

    }


    /* Already inside content */

    if(
        src.indexOf("content/") === 0
    ){

        return "/" + src;

    }


    /* Bare image filename */

    return "/content/images/" + src;

}


/* =========================================================
   FILE NAME
========================================================= */

function getFileName(path){

    var parts =
        path.split("/");


    return parts[
        parts.length - 1
    ];

}


/* =========================================================
   HTML ESCAPING
========================================================= */

function escapeHtml(value){

    return String(value)

        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#39;");

}


/* =========================================================
   ATTRIBUTE ESCAPING
========================================================= */

function escapeAttribute(value){

    return escapeHtml(value);

}
