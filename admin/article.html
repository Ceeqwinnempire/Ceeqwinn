<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CEEQWINN Reader</title>

<style>

/* =========================================================
   01 — BASIC READER
   ========================================================= */

body{
    max-width:800px;
    margin:auto;
    padding:35px 18px;
    font-family:Arial,sans-serif;
    line-height:1.8;
    background:#fafafa;
    color:#222;
}

h1{
    font-size:2.2rem;
    margin-bottom:20px;
}

#cover{
    display:none;
    max-width:100%;
    height:auto;
    margin:0 auto 30px;
    border-radius:12px;
}

#credits{
    color:#666;
    margin-bottom:25px;
}

#status{
    color:#777;
}

#content{
    overflow-wrap:break-word;
}

#content img{
    display:block;
    max-width:100%;
    height:auto;
    margin:25px auto;
    border-radius:12px;
}

#content video,
#content audio{
    display:block;
    width:100%;
    max-width:100%;
    margin:25px auto;
}

#content blockquote{
    margin:25px 0;
    padding:10px 18px;
    border-left:4px solid #999;
    background:#f0f0f0;
}

#content table{
    width:100%;
    border-collapse:collapse;
    margin:25px 0;
}

#content th,
#content td{
    padding:8px;
    border:1px solid #ccc;
}


/* =========================================================
   02 — STORY CHOICES
   ========================================================= */

.story-choice{
    margin:40px 0;
    padding:20px 0;
}

.story-choice-title{
    font-weight:bold;
    margin-bottom:15px;
}

.story-choice-button{
    display:block;
    width:100%;
    box-sizing:border-box;
    margin:10px 0;
    padding:15px;
    font:16px Arial,sans-serif;
    text-align:left;
    background:#fff;
    color:#222;
    border:1px solid #ccc;
    border-radius:8px;
    cursor:pointer;
}

.story-choice-button:hover{
    background:#f2f2f2;
}

.story-hidden{
    display:none !important;
}

.story-branch{
    margin-top:25px;
}


/* =========================================================
   03 — RESET
   ========================================================= */

#storyReset{
    display:none;
    width:100%;
    margin:35px 0;
    padding:12px;
    background:#f7f7f7;
    color:#555;
    border:1px dashed #aaa;
    border-radius:8px;
}


/* =========================================================
   04 — LOW-SPEC DEVICES
   ========================================================= */

@media(max-width:600px){

    body{
        padding:25px 15px;
    }

    h1{
        font-size:1.8rem;
    }

    .story-choice-button{
        font-size:16px;
        padding:15px;
    }

}

</style>
</head>


<body>

<img id="cover" alt="">

<h1 id="title">Loading...</h1>

<div id="credits"></div>

<div id="status"></div>

<div id="content"></div>

<button id="storyReset" type="button">
    ↺ Reset Story
</button>

<div id="media"></div>


<!-- =======================================================
     05 — MARKDOWN
     ======================================================= -->

<script src="https://cdn.jsdelivr.net/npm/marked@0.3.19/marked.min.js"></script>


<script>

/* =========================================================
   SEQUENCE READER — CODE 01
   06 — BASIC SETUP
   ========================================================= */

var title = document.getElementById("title");
var credits = document.getElementById("credits");
var status = document.getElementById("status");
var content = document.getElementById("content");
var cover = document.getElementById("cover");
var media = document.getElementById("media");
var reset = document.getElementById("storyReset");


/* =========================================================
   07 — GET ARTICLE NAME

   Example:

   article.html?file=discordant-descendants

   becomes:

   content/articles/discordant-descendants.md
   ========================================================= */

var params = new URLSearchParams(window.location.search);
var file = params.get("file") || "";

file = cleanPath(file);

var storageKey =
    "ceeqwinn_story_" + file.replace(/[^a-zA-Z0-9_-]/g,"_");


/* =========================================================
   08 — START
   ========================================================= */

if(!file){

    title.textContent = "Article not found";
    status.textContent = "No article was selected.";

}else{

    loadStory();

}


/* =========================================================
   09 — LOAD MARKDOWN
   ========================================================= */

function loadStory(){

    status.textContent = "Loading...";
    content.innerHTML = "";
    media.innerHTML = "";

    var xhr = new XMLHttpRequest();

    xhr.open(
        "GET",
        "../content/articles/" +
        encodeURIComponent(file) +
        ".md",
        true
    );

    xhr.onload = function(){

        if(xhr.status !== 200 && xhr.status !== 0){

            title.textContent = "Unable to load article";
            status.textContent = "The article could not be loaded.";
            return;

        }

        buildStory(xhr.responseText);

    };

    xhr.onerror = function(){

        title.textContent = "Unable to load article";
        status.textContent = "The article could not be loaded.";

    };

    xhr.send();

}


/* =========================================================
   10 — BUILD STORY
   ========================================================= */

function buildStory(text){

    var data = parseFrontmatter(text);

    title.textContent =
        data.title || file;

    credits.innerHTML =
        data.credits
        ? "<strong>Credits:</strong> " +
          escapeHtml(data.credits)
        : "";

    if(data.cover){

        cover.src = mediaPath(data.cover);
        cover.alt = data.title || file;
        cover.style.display = "block";

        cover.onerror = function(){
            cover.style.display = "none";
        };

    }

    /*
       This is the important part.

       Normal Markdown and interactive
       story content are handled together.
    */

    content.innerHTML =
        renderStory(data.body);

    fixMedia();

    if(hasChoices()){

        reset.style.display = "block";

        activateChoices();
        restoreChoices();

    }else{

        reset.style.display = "none";

    }

    renderExtraMedia(data);

    status.textContent = "";

}


/* =========================================================
   11 — FRONTMATTER
   ========================================================= */

function parseFrontmatter(text){

    var data = {
        title:"",
        cover:"",
        credits:"",
        video:"",
        audio:"",
        body:text
    };

    var match = text.match(
        /^---\s*\n([\s\S]*?)\n---\s*\n?/
    );

    if(!match){
        return data;
    }

    var front = match[1];

    data.body =
        text.substring(match[0].length);

    data.title = frontValue(front,"title");
    data.cover = frontValue(front,"cover");
    data.credits = frontValue(front,"credits");
    data.video = frontValue(front,"video");
    data.audio = frontValue(front,"audio");

    return data;
}


function frontValue(text,key){

    var re = new RegExp(
        "^" + key + "\\s*:\\s*[\"']?(.*?)[\"']?$",
        "m"
    );

    var match = text.match(re);

    return match ? match[1].trim() : "";

}


/* =========================================================
   12 — STORY RENDERER

   Supported format:

   [CHOICE:choice-01]

   [A] Accept the request.
   [B] Reject it.
   [C] Screenshot it.

   [CONSEQUENCE:A]

   Something happens.

   [ENDCHOICE]

   The parser also accepts:

   * [CHOICE:choice-01]
   * [A] Accept the request.

   So the Markdown does not have to be
   perfectly formatted to be recognized.
   ========================================================= */

function renderStory(text){

    var lines = text.split(/\r?\n/);
    var output = "";
    var normal = [];
    var i = 0;

    while(i < lines.length){

        if(isChoiceStart(lines[i])){

            if(normal.length){

                output += marked(normal.join("\n"));
                normal = [];

            }

            var result =
                parseChoice(lines,i);

            output += result.html;

            i = result.next;

        }else{

            normal.push(lines[i]);
            i++;

        }

    }

    if(normal.length){
        output += marked(normal.join("\n"));
    }

    return output;
}


/* =========================================================
   13 — RECOGNIZE CHOICE
   ========================================================= */

function isChoiceStart(line){

    return /^\s*\*?\s*\[CHOICE:[\w-]+\]\s*$/.test(line);

}


/* =========================================================
   14 — PARSE CHOICE
   ========================================================= */

function parseChoice(lines,start){

    var match = lines[start].match(
        /^\s*\*?\s*\[CHOICE:([\w-]+)\]\s*$/
    );

    var id = match[1];

    var options = [];
    var branches = [];

    var current = null;
    var i = start + 1;

    while(i < lines.length){

        var line = lines[i];

        /* END */

        if(/^\s*\*?\s*\[ENDCHOICE\]\s*$/.test(line)){
            i++;
            break;
        }


        /* OPTION */

        var option = line.match(
            /^\s*\*?\s*\[([A-Z])\]\s*(.+?)\s*$/
        );

        if(option && !current){

            options.push({
                letter:option[1],
                label:option[2]
            });

            i++;
            continue;

        }


        /* CONSEQUENCE */

        var consequence = line.match(
            /^\s*\*?\s*\[CONSEQUENCE:([A-Z])\]\s*$/
        );

        if(consequence){

            current = {
                letter:consequence[1],
                lines:[]
            };

            branches.push(current);

            i++;
            continue;

        }


        /* BRANCH CONTENT */

        if(current){

            current.lines.push(line);

        }

        i++;

    }


    /* BUILD CHOICE */

    var html =
        '<div class="story-choice" ' +
        'data-choice="' + escapeAttr(id) + '">' +

        '<div class="story-choice-title">' +
        'What do you do?' +
        '</div>';


    for(var j=0;j<options.length;j++){

        html +=
            '<button type="button" ' +
            'class="story-choice-button" ' +
            'data-choice="' + escapeAttr(id) + '" ' +
            'data-letter="' + options[j].letter + '">' +

            escapeHtml(
                options[j].letter +
                " — " +
                options[j].label
            ) +

            '</button>';

    }

    html += "</div>";


    /* BUILD BRANCHES */

    for(var k=0;k<branches.length;k++){

        var branch = branches[k];

        html +=
            '<div class="story-branch story-hidden" ' +
            'data-choice="' + escapeAttr(id) + '" ' +
            'data-letter="' + branch.letter + '">' +

            renderStory(branch.lines.join("\n")) +

            '</div>';

    }


    return {
        html:html,
        next:i
    };

}


/* =========================================================
   15 — ACTIVATE CHOICE BUTTONS
   ========================================================= */

function activateChoices(){

    var buttons =
        content.getElementsByClassName(
            "story-choice-button"
        );

    for(var i=0;i<buttons.length;i++){

        buttons[i].onclick = function(){

            var id =
                this.getAttribute("data-choice");

            var letter =
                this.getAttribute("data-letter");

            choose(id,letter);

        };

    }

}


/* =========================================================
   16 — MAKE CHOICE
   ========================================================= */

function choose(id,letter){

    saveChoice(id,letter);

    showBranch(id,letter);

}


/* =========================================================
   17 — SAVE CHOICE
   ========================================================= */

function saveChoice(id,letter){

    var choices = getChoices();

    choices[id] = letter;

    try{

        localStorage.setItem(
            storageKey,
            JSON.stringify(choices)
        );

    }catch(e){}

}


/* =========================================================
   18 — GET SAVED CHOICES
   ========================================================= */

function getChoices(){

    try{

        var saved =
            localStorage.getItem(storageKey);

        return saved
            ? JSON.parse(saved)
            : {};

    }catch(e){

        return {};

    }

}


/* =========================================================
   19 — SHOW SELECTED CONSEQUENCE
   ========================================================= */

function showBranch(id,letter){

    var choices =
        content.getElementsByClassName(
            "story-choice"
        );

    var branches =
        content.getElementsByClassName(
            "story-branch"
        );

    var i;


    /* Hide buttons */

    for(i=0;i<choices.length;i++){

        if(
            choices[i].getAttribute("data-choice")
            === id
        ){

            choices[i].style.display = "none";

        }

    }


    /* Hide branches */

    for(i=0;i<branches.length;i++){

        if(
            branches[i].getAttribute("data-choice")
            === id
        ){

            branches[i].className =
                "story-branch story-hidden";

        }

    }


    /* Show selected branch */

    for(i=0;i<branches.length;i++){

        if(
            branches[i].getAttribute("data-choice")
            === id
            &&
            branches[i].getAttribute("data-letter")
            === letter
        ){

            branches[i].className =
                "story-branch";

        }

    }

}


/* =========================================================
   20 — RESTORE CHOICES
   ========================================================= */

function restoreChoices(){

    var choices = getChoices();

    for(var id in choices){

        if(choices.hasOwnProperty(id)){

            showBranch(
                id,
                choices[id]
            );

        }

    }

}


/* =========================================================
   21 — DOES STORY HAVE CHOICES?
   ========================================================= */

function hasChoices(){

    return content.getElementsByClassName(
        "story-choice"
    ).length > 0;

}


/* =========================================================
   22 — RESET STORY
   ========================================================= */

reset.onclick = function(){

    try{

        localStorage.removeItem(storageKey);

    }catch(e){}

    loadStory();

    window.scrollTo(0,0);

};


/* =========================================================
   23 — MEDIA PATH
   ========================================================= */

function mediaPath(src){

    if(!src){
        return "";
    }

    src = src.trim();

    if(
        /^https?:\/\//i.test(src) ||
        /^data:/i.test(src) ||
        src.charAt(0) === "/"
    ){

        return src;

    }

    while(src.indexOf("../") === 0){
        src = src.substring(3);
    }

    while(src.indexOf("./") === 0){
        src = src.substring(2);
    }

    if(src.indexOf("content/") === 0){
        return "/" + src;
    }

    return "/content/images/" + src;

}


/* =========================================================
   24 — FIX INLINE MEDIA
   ========================================================= */

function fixMedia(){

    var images =
        content.getElementsByTagName("img");

    var videos =
        content.getElementsByTagName("video");

    var audios =
        content.getElementsByTagName("audio");

    var i;


    for(i=0;i<images.length;i++){

        images[i].src =
            mediaPath(images[i].getAttribute("src"));

        images[i].setAttribute("loading","lazy");

    }


    for(i=0;i<videos.length;i++){

        videos[i].src =
            mediaPath(videos[i].getAttribute("src"));

        videos[i].controls = true;

    }


    for(i=0;i<audios.length;i++){

        audios[i].src =
            mediaPath(audios[i].getAttribute("src"));

        audios[i].controls = true;

    }

}


/* =========================================================
   25 — EXTRA MEDIA FROM FRONTMATTER
   ========================================================= */

function renderExtraMedia(data){

    var html = "";

    if(data.video){

        html +=
            '<h2>Video</h2>' +
            '<video controls preload="metadata">' +
            '<source src="' +
            escapeAttr(mediaPath(data.video)) +
            '">' +
            '</video>';

    }

    if(data.audio){

        html +=
            '<h2>Audio</h2>' +
            '<audio controls preload="metadata">' +
            '<source src="' +
            escapeAttr(mediaPath(data.audio)) +
            '">' +
            '</audio>';

    }

    media.innerHTML = html;

}


/* =========================================================
   26 — PATH CLEANING
   ========================================================= */

function cleanPath(path){

    path = String(path)
        .replace(/\\/g,"/")
        .replace(/^\/+/,"");

    var parts = path.split("/");
    var clean = [];

    for(var i=0;i<parts.length;i++){

        if(
            parts[i] &&
            parts[i] !== "." &&
            parts[i] !== ".."
        ){

            clean.push(parts[i]);

        }

    }

    return clean.join("/");

}


/* =========================================================
   27 — ESCAPING
   ========================================================= */

function escapeHtml(value){

    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#39;");

}


function escapeAttr(value){

    return escapeHtml(value);

}

</script>

</body>
</html>
