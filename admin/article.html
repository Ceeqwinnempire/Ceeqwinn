<!DOCTYPE html>
<html lang="en">

<head>

<title>CEEQWINN Reader</title>

<style>

body{
    max-width:800px;
    margin:auto;
    padding:35px 18px;
    font-family:Arial,sans-serif;
    line-height:1.8;
    background:#fafafa;
    color:#222;
}

h1{
    font-size:2.2rem;
    margin-bottom:20px;
}

h2{
    margin-top:35px;
}

#cover{
    display:none;
    max-width:100%;
    height:auto;
    margin:0 auto 30px;
    border-radius:12px;
}

#credits{
    color:#666;
    margin-bottom:25px;
}

#status{
    color:#777;
}

#content{
    overflow-wrap:break-word;
}

#content img{
    display:block;
    max-width:100%;
    height:auto;
    margin:25px auto;
    border-radius:12px;
}

#content video,
#content audio{
    display:block;
    width:100%;
    max-width:100%;
    margin:25px auto;
}

#content blockquote{
    margin:25px 0;
    padding:10px 18px;
    border-left:4px solid #999;
    background:#f0f0f0;
}

#content table{
    width:100%;
    border-collapse:collapse;
    margin:25px 0;
}

#content th,
#content td{
    padding:8px;
    border:1px solid #ccc;
}


/* =========================================================
   VISUAL STORY MODE
   ========================================================= */

#theatre{
    display:none;
    margin:0 0 35px;
}

#theatre.theatre-visible{
    display:block;
}

.theatre-frame{
    position:relative;
    width:100%;
    overflow:hidden;
    background:#111;
    border-radius:14px;
    border:1px solid #ddd;
}

.theatre-stage{
    position:relative;
    width:100%;
    aspect-ratio:16 / 9;
    min-height:220px;
    overflow:hidden;
    background:#111;
}

.theatre-stage-layer{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    display:block;
    object-fit:cover;
    object-position:center center;
    opacity:0;
    transform:scale(1);
    transition:
        opacity .45s ease,
        transform .55s ease,
        object-position .35s ease;
    will-change:opacity,transform;
}

.theatre-stage-layer.active{
    opacity:1;
}

.theatre-stage-layer.theatre-settle{
    transform:scale(1.015);
}

.theatre-empty{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:25px;
    box-sizing:border-box;
    text-align:center;
    color:#ddd;
    background:#151515;
    font-size:.9rem;
}

.theatre-empty.hidden{
    display:none;
}

.theatre-caption{
    padding:10px 14px;
    background:#181818;
    color:#ddd;
    font-size:.78rem;
    letter-spacing:.04em;
    text-align:center;
    min-height:20px;
}

.theatre-caption:empty{
    display:none;
}

.theatre-caption strong{
    color:#fff;
}

.theatre-frame.theatre-focus-left .theatre-stage-layer{
    object-position:35% center;
}

.theatre-frame.theatre-focus-center .theatre-stage-layer{
    object-position:50% center;
}

.theatre-frame.theatre-focus-right .theatre-stage-layer{
    object-position:65% center;
}


/* SHOTS */

.theatre-frame.theatre-shot-full .theatre-stage-layer{
    object-fit:cover;
    transform:scale(1);
}

.theatre-frame.theatre-shot-medium .theatre-stage-layer{
    object-fit:cover;
    transform:scale(1.08);
}

.theatre-frame.theatre-shot-close .theatre-stage-layer{
    object-fit:cover;
    transform:scale(1.18);
}

.theatre-frame.theatre-shot-medium .theatre-stage-layer.theatre-settle{
    transform:scale(1.095);
}

.theatre-frame.theatre-shot-close .theatre-stage-layer.theatre-settle{
    transform:scale(1.205);
}


/* LIGHTWEIGHT TRANSITIONS */

.theatre-frame.theatre-transition-cut .theatre-stage-layer{
    transition:none;
}

.theatre-frame.theatre-transition-fade .theatre-stage-layer{
    transition:opacity .55s ease;
}

.theatre-frame.theatre-transition-crossfade .theatre-stage-layer{
    transition:
        opacity .55s ease,
        transform .55s ease,
        object-position .35s ease;
}

.theatre-frame.theatre-transition-soft-rise .theatre-stage-layer{
    transition:
        opacity .55s ease,
        transform .65s ease;
}

.theatre-frame.theatre-transition-slide .theatre-stage-layer{
    transition:
        opacity .45s ease,
        transform .55s ease;
}


/* BEATS */

.theatre-frame.theatre-beat-arrival{
    border-color:#c9b47a;
}

.theatre-frame.theatre-beat-announcement{
    border-color:#bda96e;
}

.theatre-frame.theatre-beat-blackout{
    background:#000;
}

.theatre-frame.theatre-beat-blackout .theatre-stage-layer{
    opacity:.22 !important;
}

.theatre-frame.theatre-beat-door-opened{
    border-color:#8d8d8d;
}


/* READING PANEL */

#content.theatre-reading{
    position:relative;
}

#content.theatre-reading::before{
    content:"";
    display:block;
    height:1px;
    margin-bottom:25px;
    background:#ddd;
}


/* DIALOGUE */

#content blockquote{
    position:relative;
}

#content blockquote p:last-child{
    margin-bottom:0;
}


/* THEATRE MODES */

body.theatre-mode-choice .story-choice{
    margin-top:30px;
}

body.theatre-mode-choice .story-choice-title{
    text-align:center;
    font-size:1.2rem;
    letter-spacing:.03em;
}

body.theatre-mode-game .story-game{
    margin-top:30px;
}

body.theatre-mode-result .story-next{
    margin-top:40px;
}


/* =========================================================
   STORY ENGINE
   ========================================================= */

.story-choice{
    margin:45px 0;
    padding:20px 0;
}

.story-choice-title{
    font-weight:bold;
    font-size:1.1rem;
    margin-bottom:15px;
}

.story-choice-button{
    display:block;
    width:100%;
    box-sizing:border-box;
    margin:10px 0;
    padding:15px;
    font:16px Arial,sans-serif;
    text-align:left;
    background:#fff;
    color:#222;
    border:1px solid #ccc;
    border-radius:8px;
    cursor:pointer;
}

.story-choice-button:hover{
    background:#f2f2f2;
}

.story-choice-button:disabled{
    cursor:default;
    opacity:.7;
}

.story-branch{
    margin-top:25px;
}

.story-choice-result{
    margin-top:25px;
}

.story-resume-anchor{
    display:block;
    width:100%;
    height:1px;
    margin:0;
    padding:0;
}


/* =========================================================
   NEXT CHAPTER
   ========================================================= */

.story-next{
    margin:55px 0 25px;
    padding:25px 0;
    text-align:center;
}

.story-next-text{
    margin-bottom:18px;
    color:#555;
    font-size:1rem;
}

.story-next-button{
    display:inline-block;
    padding:14px 22px;
    font:16px Arial,sans-serif;
    background:#222;
    color:#fff;
    border:none;
    border-radius:8px;
    cursor:pointer;
}

.story-next-button:hover{
    opacity:.85;
}


/* =========================================================
   GAME BRIDGE
   ========================================================= */

.story-game{
    margin:45px 0;
    padding:25px 0;
    text-align:center;
}

.story-game-title{
    font-weight:bold;
    font-size:1.15rem;
    margin-bottom:10px;
}

.story-game-text{
    color:#666;
    margin-bottom:18px;
}

.story-game-button{
    display:inline-block;
    padding:15px 24px;
    font:16px Arial,sans-serif;
    background:#222;
    color:#fff;
    border:none;
    border-radius:8px;
    cursor:pointer;
}

.story-game-button:hover{
    opacity:.85;
}

.story-game-complete{
    margin:30px 0;
    padding:15px;
    text-align:center;
    color:#666;
}


/* =========================================================
   SHOW OUTFIT
   ========================================================= */

.story-outfit{
    margin:35px 0;
    text-align:center;
}

.story-outfit img{
    display:block;
    width:100%;
    max-width:420px;
    height:auto;
    margin:0 auto;
    border-radius:12px;
}


/* =========================================================
   RESET
   ========================================================= */

#storyReset{
    display:none;
    width:100%;
    margin:35px 0;
    padding:12px;
    background:#f7f7f7;
    color:#555;
    border:1px dashed #aaa;
    border-radius:8px;
    cursor:pointer;
}

#storyReset:hover{
    background:#eeeeee;
}


/* =========================================================
   MOBILE
   ========================================================= */

@media(max-width:600px){

    body{
        padding:25px 15px;
    }

    h1{
        font-size:1.8rem;
    }

    .theatre-stage{
        aspect-ratio:4 / 3;
        min-height:180px;
    }

    .theatre-caption{
        font-size:.72rem;
        padding:8px 10px;
    }

    .story-choice-button{
        font-size:16px;
        padding:15px;
    }

    .story-next-button{
        width:100%;
        box-sizing:border-box;
    }

    .story-game-button{
        width:100%;
        box-sizing:border-box;
    }

}


/* =========================================================
   REDUCED MOTION
   ========================================================= */

@media(prefers-reduced-motion:reduce){

    .theatre-stage-layer{
        transition:none !important;
        transform:none !important;
    }

    html{
        scroll-behavior:auto;
    }

}

</style>

/* =========================================================

/* =========================================================

};


/* =========================================================
   ARTICLE FILE
   ========================================================= */

var params =
    new URLSearchParams(
        window.location.search
    );

var file =
    params.get("file") || "";

var returnGame =
    params.get("return") || "";

file =
    cleanPath(file);

returnGame =

/* =========================================================
   STORY ID
   ========================================================= */

var storyId =
    getStoryId(file);


/* =========================================================
   SHARED STORY STORAGE
   ========================================================= */

var storageKey =
    "ceeqwinn_story_history_" +
    storyId;


/* =========================================================
   STORY STATE
   ========================================================= */

var storyNodes = [];

var resumeAfterGameId = "";


/* =========================================================
   START
   ========================================================= */

if(!file){

    title.textContent =
        "Article not found";

    status.textContent =
        "No article was selected.";

}else{

    loadStory();

}


/* =========================================================
   LOAD MARKDOWN
   ========================================================= */

function loadStory(){

    status.textContent =
        "Loading...";

    content.innerHTML = "";

    media.innerHTML = "";

    cover.style.display =
        "none";

    resetTheatre();


    var xhr =
        new XMLHttpRequest();


    xhr.open(
        "GET",
        "../content/articles/" +
        encodeURIComponent(file) +
        ".md",
        true
    );


    xhr.onload =
        function(){

            if(
                xhr.status !== 200 &&
                xhr.status !== 0
            ){

                title.textContent =
                    "Unable to load article";

                status.textContent =
                    "The article could not be loaded.";

                return;

            }


            buildStory(
                xhr.responseText
            );

        };


    xhr.onerror =
        function(){

            title.textContent =
                "Unable to load article";

            status.textContent =
                "The article could not be loaded.";

        };


    xhr.send();

}


/* =========================================================
   BUILD STORY
   ========================================================= */

function buildStory(text){

    var data =
        parseFrontmatter(text);


    title.textContent =
        data.title || file;


    credits.innerHTML =
        data.credits
        ? "<strong>Credits:</strong> " +
          escapeHtml(data.credits)
        : "";


    if(data.cover){

        cover.src =
            mediaPath(data.cover);

        cover.alt =
            data.title || file;

        cover.style.display =
            "block";


        cover.onerror =
            function(){

                cover.style.display =
                    "none";

            };

    }


    storyNodes =
        parseStoryNodes(
            data.body.split(/\r?\n/)
        );


    if(returnGame){

        resumeAfterGameId =
            returnGame;

        returnGame = "";

    }


    renderProgress();

    fixMedia();

    renderExtraMedia(data);

    status.textContent = "";

}


/* =========================================================
   FRONTMATTER
   ========================================================= */

function parseFrontmatter(text){

    var data = {
        title:"",
        cover:"",
        credits:"",
        video:"",
        audio:"",
        body:text
    };


    text =
        String(text || "")
        .replace(/^\uFEFF/, "")
        .replace(/\r\n/g, "\n")
        .replace(/\r/g, "\n");


    var match =
        text.match(
            /^---[ \t]*\n([\s\S]*?)\n---[ \t]*(?:\n|$)/
        );


    if(!match){

        data.body =
            cleanLeadingArticleMetadata(text);

        return data;

    }


    var front =
        match[1];


    data.body =
        text.substring(
            match[0].length
        );


    data.title =
        frontValue(
            front,
            "title"
        );

    data.cover =
        frontValue(
            front,
            "cover"
        );

    data.credits =
        frontValue(
            front,
            "credits"
        );

    data.video =
        frontValue(
            front,
            "video"
        );

    data.audio =
        frontValue(
            front,
            "audio"
        );


    data.body =
        cleanLeadingArticleMetadata(
            data.body
        );


    return data;

}


/* =========================================================
   CLEAN LEADING ARTICLE METADATA
   ========================================================= */

function cleanLeadingArticleMetadata(text){

    var body =
        String(text || "")
        .replace(/^\uFEFF/, "")
        .replace(/\r\n/g, "\n")
        .replace(/\r/g, "\n");


    body =
        body.replace(
            /^\s*\n/,
            ""
        );


    var changed = true;


    while(changed){

        changed = false;


        var duplicateFront =
            body.match(
                /^---[ \t]*\n([\s\S]*?)\n---[ \t]*(?:\n|$)/
            );


        if(duplicateFront){

            var possibleMeta =
                duplicateFront[1];


            if(
                /^\s*(title|cover|credits|video|audio)\s*:/mi.test(
                    possibleMeta
                )
            ){

                body =
                    body.substring(
                        duplicateFront[0].length
                    );


                body =
                    body.replace(
                        /^\s*\n/,
                        ""
                    );


                changed = true;

            }

        }

    }


    body =
        body.replace(
            /^##[ \t]+title\s*:[^\n]*\n+/i,
            ""
        );


    body =
        body.replace(
            /^\s*\n/,
            ""
        );


    return body;

}


/* =========================================================
   FRONTMATTER VALUE
   ========================================================= */

function frontValue(
    text,
    key
){

    var re =
        new RegExp(
            "^" +
            key +
            "\\s*:\\s*[\"']?(.*?)[\"']?$",
            "mi"
        );


    var match =
        text.match(re);


    return match
        ? match[1].trim()
        : "";

}


/* =========================================================
   CLEAN CONTROL LINE
   ========================================================= */

function cleanControlLine(line){

    return String(line || "")
        .trim()
        .replace(/^\*+\s*/, "")
        .replace(/\s*\*+$/, "")
        .trim();

}


/* =========================================================
   MARKER TESTS
   ========================================================= */

function isGameMarker(line){

    return /^\[GAME:\s*[A-Z0-9_-]+\s*\]$/i.test(
        cleanControlLine(line)
    );

}


function isChoiceStart(line){

    return /^\[CHOICE:\s*[\w-]+\s*\]$/i.test(
        cleanControlLine(line)
    );

}


function isShowOutfitMarker(line){

    return /^\[SHOWOUTFIT\]$/i.test(
        cleanControlLine(line)
    );

}


function isNextMarker(line){

    return /^\[NEXT:\s*[^|\]]+(?:\|[^\]]+)?\s*\]$/i.test(
        cleanControlLine(line)
    );

}


function isIfMarker(line){

    return /^\[IF:\s*[\w-]+\s*=\s*[A-Z]\s*\]$/i.test(
        cleanControlLine(line)
    );

}


function isElseMarker(line){

    return /^\[ELSE\]$/i.test(
        cleanControlLine(line)
    );

}


function isEndIfMarker(line){

    return /^\[ENDIF\]$/i.test(
        cleanControlLine(line)
    );

}


function isEndChoiceMarker(line){

    return /^\[ENDCHOICE\]$/i.test(
        cleanControlLine(line)
    );

}


/* =========================================================
   VISUAL STORY MARKER TESTS
   ========================================================= */

function isSceneMarker(line){

    return /^\[SCENE:\s*[^|\]]+(?:\|[^\]]+)?\s*\]$/i.test(
        cleanControlLine(line)
    );

}


function isFocusMarker(line){

    return /^\[FOCUS:\s*[^|\]]+\s*\]$/i.test(
        cleanControlLine(line)
    );

}


function isShotMarker(line){

    return /^\[SHOT:\s*(FULL|MEDIUM|CLOSE)\s*\]$/i.test(
        cleanControlLine(line)
    );

}


function isTransitionMarker(line){

    return /^\[TRANSITION:\s*(CUT|FADE|CROSSFADE|SOFT-RISE|SLIDE)\s*\]$/i.test(
        cleanControlLine(line)
    );

}


function isBeatMarker(line){

    return /^\[BEAT:\s*[^|\]]+\s*\]$/i.test(
        cleanControlLine(line)
    );

}


/* =========================================================
   GET GAME ID
   ========================================================= */

function getGameId(line){

    var match =
        cleanControlLine(line).match(
            /^\[GAME:\s*([A-Z0-9_-]+)\s*\]$/i
        );


    return match
        ? match[1].toUpperCase()
        : "";

}


/* =========================================================
   GET VISUAL MARKER DATA
   ========================================================= */

function getSceneMarker(line){

    var match =
        cleanControlLine(line).match(
            /^\[SCENE:\s*([^|\]]+?)(?:\|([^\]]+?))?\s*\]$/i
        );


    if(!match){

        return null;

    }


    return {

        id:
            match[1].trim(),

        image:
            match[2]
            ? match[2].trim()
            : ""

    };

}


function getFocusMarker(line){

    var match =
        cleanControlLine(line).match(
            /^\[FOCUS:\s*([^|\]]+)\s*\]$/i
        );


    return match
        ? match[1].trim()
        : "";

}


function getShotMarker(line){

    var match =
        cleanControlLine(line).match(
            /^\[SHOT:\s*(FULL|MEDIUM|CLOSE)\s*\]$/i
        );


    return match
        ? match[1].toUpperCase()
        : "";

}


function getTransitionMarker(line){

    var match =
        cleanControlLine(line).match(
            /^\[TRANSITION:\s*(CUT|FADE|CROSSFADE|SOFT-RISE|SLIDE)\s*\]$/i
        );


    return match
        ? match[1].toUpperCase()
        : "";

}


function getBeatMarker(line){

    var match =
        cleanControlLine(line).match(
            /^\[BEAT:\s*([^|\]]+)\s*\]$/i
        );


    return match
        ? match[1].trim()
        : "";

}


/* =========================================================
   PARSE COMPLETE STORY INTO NODES
   ========================================================= */

function parseStoryNodes(lines){

    var result = [];

    var normal = [];

    var i = 0;


    function flushNormal(){

        if(normal.length){

            result.push({
                type:"markdown",
                text:normal.join("\n")
            });

            normal = [];

        }

    }


    while(i < lines.length){

        var line =
            lines[i];


        /* CONDITIONAL */

        if(isIfMarker(line)){

            flushNormal();


            var conditional =
                parseConditionalNode(
                    lines,
                    i
                );


            result.push(
                conditional.node
            );


            i =
                conditional.next;

            continue;

        }


        /* CHOICE */

        if(isChoiceStart(line)){

            flushNormal();


            var choice =
                parseChoiceNode(
                    lines,
                    i
                );


            result.push(
                choice.node
            );


            i =
                choice.next;

            continue;

        }


        /* GAME */

        if(isGameMarker(line)){

            flushNormal();


            result.push({
                type:"game",
                id:getGameId(line)
            });


            i++;

            continue;

        }


        /* SHOW OUTFIT */

        if(isShowOutfitMarker(line)){

            flushNormal();


            result.push({
                type:"outfit"
            });


            i++;

            continue;

        }


        /* NEXT CHAPTER */

        if(isNextMarker(line)){

            flushNormal();


            result.push({
                type:"next",
                line:cleanControlLine(line)
            });


            i++;

            continue;

        }


        /* =================================================
           VISUAL STORY DIRECTIVES
           ================================================= */

        if(isSceneMarker(line)){

            flushNormal();


            var scene =
                getSceneMarker(line);


            result.push({

                type:"theatre",

                directive:"scene",

                id:
                    scene.id,

                image:
                    scene.image

            });


            i++;

            continue;

        }


        if(isFocusMarker(line)){

            flushNormal();


            result.push({

                type:"theatre",

                directive:"focus",

                value:
                    getFocusMarker(line)

            });


            i++;

            continue;

        }


        if(isShotMarker(line)){

            flushNormal();


            result.push({

                type:"theatre",

                directive:"shot",

                value:
                    getShotMarker(line)

            });


            i++;

            continue;

        }


        if(isTransitionMarker(line)){

            flushNormal();


            result.push({

                type:"theatre",

                directive:"transition",

                value:
                    getTransitionMarker(line)

            });


            i++;

            continue;

        }


        if(isBeatMarker(line)){

            flushNormal();


            result.push({

                type:"theatre",

                directive:"beat",

                value:
                    getBeatMarker(line)

            });


            i++;

            continue;

        }


        /*
         * These markers belong to a structure already
         * being parsed.
         */

        if(
            isElseMarker(line) ||
            isEndIfMarker(line) ||
            isEndChoiceMarker(line)
        ){

            i++;

            continue;

        }


        normal.push(line);

        i++;

    }


    flushNormal();


    return result;

}


/* =========================================================
   PARSE CHOICE NODE
   ========================================================= */

function parseChoiceNode(
    lines,
    start
){

    var match =
        cleanControlLine(
            lines[start]
        ).match(
            /^\[CHOICE:\s*([\w-]+)\s*\]$/i
        );


    if(!match){

        return {

            node:{
                type:"markdown",
                text:""
            },

            next:start + 1

        };

    }


    var id =
        match[1];

    var options = [];

    var branches = {};

    var currentLetter =
        null;

    var currentLines = [];

    var i =
        start + 1;

    var choiceStarted =
        false;


    function saveBranch(){

        if(
            currentLetter !== null
        ){

            branches[
                currentLetter
            ] =
                parseStoryNodes(
                    currentLines
                );

            choiceStarted =
                true;

        }


        currentLines = [];

    }


    while(i < lines.length){

        var line =
            lines[i];

        var cleaned =
            cleanControlLine(line);


        var consequence =
            cleaned.match(
                /^\[CONSEQUENCE:\s*([A-Z])\s*\]$/i
            );


        if(consequence){

            saveBranch();


            currentLetter =
                consequence[1].toUpperCase();


            currentLines = [];

            i++;

            continue;

        }


        if(isEndChoiceMarker(line)){

            saveBranch();


            currentLetter =
                null;

            currentLines = [];

            i++;

            continue;

        }


        var option =
            cleaned.match(
                /^\[([A-Z])\]\s*(.+?)\s*$/i
            );


        if(
            option &&
            !choiceStarted &&
            currentLetter === null
        ){

            options.push({

                letter:
                    option[1].toUpperCase(),

                label:
                    option[2]

            });


            i++;

            continue;

        }


        if(
            currentLetter === null &&
            choiceStarted
        ){

            if(cleaned === ""){

                i++;

                continue;

            }


            if(
                isChoiceStart(line) ||
                isGameMarker(line) ||
                isShowOutfitMarker(line) ||
                isNextMarker(line) ||
                isIfMarker(line) ||
                isSceneMarker(line)
            ){

                break;

            }


            break;

        }


        if(
            currentLetter !== null
        ){

            currentLines.push(line);

        }


        i++;

    }


    saveBranch();


    return {

        node:{

            type:"choice",

            id:id,

            options:options,

            branches:branches

        },

        next:i

    };

}


/* =========================================================
   PARSE CONDITIONAL NODE
   ========================================================= */

function parseConditionalNode(
    lines,
    start
){

    var first =
        cleanControlLine(
            lines[start]
        ).match(
            /^\[IF:\s*([\w-]+)\s*=\s*([A-Z])\s*\]$/i
        );


    if(!first){

        return {

            node:{
                type:"markdown",
                text:""
            },

            next:start + 1

        };

    }


    var id =
        first[1];

    var letter =
        first[2].toUpperCase();


    var thenLines = [];

    var elseLines = [];

    var current =
        thenLines;

    var depth = 1;

    var i =
        start + 1;


    while(i < lines.length){

        var line =
            lines[i];


        if(isIfMarker(line)){

            depth++;

            current.push(line);

            i++;

            continue;

        }


        if(isEndIfMarker(line)){

            depth--;


            if(depth === 0){

                i++;

                break;

            }


            current.push(line);

            i++;

            continue;

        }


        if(
            depth === 1 &&
            isElseMarker(line)
        ){

            current =
                elseLines;

            i++;

            continue;

        }


        current.push(line);

        i++;

    }


    return {

        node:{

            type:"conditional",

            id:id,

            letter:letter,

            thenNodes:
                parseStoryNodes(
                    thenLines
                ),

            elseNodes:
                parseStoryNodes(
                    elseLines
                )

        },

        next:i

    };

}


/* =========================================================
   RENDER PROGRESS
   ========================================================= */

function renderProgress(){

    content.innerHTML = "";

    content.classList.add(
        "theatre-reading"
    );


    var result =
        executeNodes(
            storyNodes,
            content
        );


    if(result.hasProgress){

        reset.style.display =
            "block";

    }else{

        reset.style.display =
            "none";

    }


    fixMedia();


    if(resumeAfterGameId){

        var gameAnchor =
            content.querySelector(
                '[data-resume-game="' +
                cssEscape(
                    resumeAfterGameId
                ) +
                '"]'
            );


        resumeAfterGameId = "";


        if(gameAnchor){

            scrollToElement(
                gameAnchor
            );

        }

    }

}


/* =========================================================
   EXECUTE STORY NODES
   ========================================================= */

function executeNodes(
    nodes,
    target
){

    var result = {

        stopped:false,

        hasProgress:false

    };


    for(
        var i = 0;
        i < nodes.length;
        i++
    ){

        var node =
            nodes[i];


        /* MARKDOWN */

        if(
            node.type ===
            "markdown"
        ){

            if(node.text.trim()){

                if(resumeAfterGameId){

                    target.insertAdjacentHTML(

                        "beforeend",

                        '<span class="story-resume-anchor" ' +
                        'data-resume-game="' +
                        escapeAttr(
                            resumeAfterGameId
                        ) +
                        '"></span>'

                    );


                    resumeAfterGameId = "";


                    target.insertAdjacentHTML(

                        "beforeend",

                        marked(node.text)

                    );

                }else{

                    target.insertAdjacentHTML(

                        "beforeend",

                        marked(node.text)

                    );

                }

            }


            continue;

        }


        /* VISUAL STORY */

        if(
            node.type ===
            "theatre"
        ){

            applyTheatreDirective(
                node
            );

            continue;

        }


        /* SHOW OUTFIT */

        if(
            node.type ===
            "outfit"
        ){

            target.insertAdjacentHTML(

                "beforeend",

                renderShowOutfit()

            );

            continue;

        }


        /* CONDITIONAL */

        if(
            node.type ===
            "conditional"
        ){

            var choices =
                getChoices();


            var selected =
                normalizeChoiceLetter(
                    choices[node.id]
                );


            if(
                selected ===
                node.letter
            ){

                var branchResult =
                    executeNodes(

                        node.thenNodes,

                        target

                    );


                if(branchResult.stopped){

                    result.stopped =
                        true;

                    result.hasProgress =
                        true;

                    return result;

                }

            }else{

                var elseResult =
                    executeNodes(

                        node.elseNodes,

                        target

                    );


                if(elseResult.stopped){

                    result.stopped =
                        true;

                    result.hasProgress =
                        true;

                    return result;

                }

            }


            continue;

        }


        /* CHOICE */

        if(
            node.type ===
            "choice"
        ){

            result.hasProgress =
                true;


            var savedChoices =
                getChoices();


            var savedLetter =
                normalizeChoiceLetter(
                    savedChoices[node.id]
                );


            if(savedLetter){

                var savedBranch =
                    node.branches[
                        savedLetter
                    ] || [];


                var branchTarget =
                    document.createElement(
                        "div"
                    );


                branchTarget.className =
                    "story-choice-result";


                branchTarget.setAttribute(
                    "data-choice-result",
                    node.id
                );


                target.appendChild(
                    branchTarget
                );


                var branchResult =
                    executeNodes(

                        savedBranch,

                        branchTarget

                    );


                if(branchResult.stopped){

                    result.stopped =
                        true;

                    return result;

                }


                continue;

            }


            setTheatreMode(
                "choice"
            );


            target.insertAdjacentHTML(

                "beforeend",

                renderChoice(node)

            );


            result.stopped =
                true;


            return result;

        }


        /* GAME */

        if(
            node.type ===
            "game"
        ){

            result.hasProgress =
                true;


            var completedGames =
                getCompletedGames();


            if(
                completedGames[
                    node.id
                ]
            ){

                continue;

            }


            setTheatreMode(
                "game"
            );


            target.insertAdjacentHTML(

                "beforeend",

                renderGame(
                    node.id
                )

            );


            result.stopped =
                true;


            return result;

        }


        /* NEXT */

        if(
            node.type ===
            "next"
        ){

            result.hasProgress =
                true;


            setTheatreMode(
                "result"
            );


            target.insertAdjacentHTML(

                "beforeend",

                renderNext(
                    node.line
                )

            );


            result.stopped =
                true;


            return result;

        }

    }


    setTheatreMode(
        "reading"
    );


    return result;

}


/* =========================================================
   VISUAL STORY DIRECTIVE ENGINE
   ========================================================= */

function applyTheatreDirective(node){

    if(!node){

        return;

    }


    if(
        node.directive ===
        "scene"
    ){

        setTheatreScene(
            node.id,
            node.image
        );

        return;

    }


    if(
        node.directive ===
        "focus"
    ){

        setTheatreFocus(
            node.value
        );

        return;

    }


    if(
        node.directive ===
        "shot"
    ){

        setTheatreShot(
            node.value
        );

        return;

    }


    if(
        node.directive ===
        "transition"
    ){

        setTheatreTransition(
            node.value
        );

        return;

    }


    if(
        node.directive ===
        "beat"
    ){

        setTheatreBeat(
            node.value
        );

        return;

    }

}


/* =========================================================
   SET THEATRE SCENE
   ========================================================= */

function setTheatreScene(
    sceneId,
    explicitImage
){

    sceneId =
        String(
            sceneId || ""
        ).trim();


    if(!sceneId){

        return;

    }


    theatreState.sceneId =
        sceneId;


    theatre.classList.add(
        "theatre-visible"
    );


    var imageValue =
        explicitImage ||
        THEATRE_SCENE_ASSETS[
            sceneId
        ] ||
        "";


    var sceneName =
        THEATRE_SCENE_NAMES[
            sceneId
        ] ||
        humanizeSceneName(
            sceneId
        );


    if(!imageValue){

        theatreEmpty.textContent =
            sceneName;

        theatreEmpty.classList.remove(
            "hidden"
        );


        theatreCaption.textContent =
            sceneName;


        return;

    }


    var src =
        resolveTheatreAsset(
            imageValue
        );


    if(!src){

        theatreEmpty.textContent =
            sceneName;

        theatreEmpty.classList.remove(
            "hidden"
        );


        theatreCaption.textContent =
            sceneName;


        return;

    }


    theatreCaption.textContent =
        sceneName;


    setTheatreVisual(
        src,
        sceneName
    );

}


/* =========================================================
   RESOLVE VISUAL ASSET
   ========================================================= */

function resolveTheatreAsset(
    value
){

    value =
        String(
            value || ""
        ).trim();


    if(!value){

        return "";

    }


    if(
        THEATRE_ASSETS[
            value
        ]
    ){

        return THEATRE_ASSETS[
            value
        ];

    }


    if(
        THEATRE_SCENE_ASSETS[
            value
        ]
    ){

        return resolveTheatreAsset(
            THEATRE_SCENE_ASSETS[
                value
            ]
        );

    }


    return mediaPath(
        value
    );

}


/* =========================================================
   SET THEATRE VISUAL
   ========================================================= */

function setTheatreVisual(
    src,
    altText
){

    var image =
        new Image();


    image.onload =
        function(){

            var nextLayer;


            if(
                theatreState.activeLayer ===
                "A"
            ){

                nextLayer =
                    theatreLayerB;

                theatreState.activeLayer =
                    "B";

            }else{

                nextLayer =
                    theatreLayerA;

                theatreState.activeLayer =
                    "A";

            }


            nextLayer.src =
                src;

            nextLayer.alt =
                altText || "Story scene";


            theatreLayerA.classList.remove(
                "active",
                "theatre-settle"
            );

            theatreLayerB.classList.remove(
                "active",
                "theatre-settle"
            );


            /*
             * CUT means immediate replacement.
             */

            if(
                theatreState.transition ===
                "CUT"
            ){

                nextLayer.classList.add(
                    "active"
                );

            }else{

                requestAnimationFrame(
                    function(){

                        nextLayer.classList.add(
                            "active"
                        );

                    }
                );

            }


            theatreEmpty.classList.add(
                "hidden"
            );


            theatreState.imageSrc =
                src;


            setTimeout(
                function(){

                    nextLayer.classList.add(
                        "theatre-settle"
                    );

                },
                40
            );

        };


    image.onerror =
        function(){

            theatreEmpty.textContent =
                "Visual unavailable — the story continues.";

            theatreEmpty.classList.remove(
                "hidden"
            );


            theatreCaption.textContent =
                THEATRE_SCENE_NAMES[
                    theatreState.sceneId
                ] ||
                humanizeSceneName(
                    theatreState.sceneId
                );

        };


    image.src =
        src;

}


/* =========================================================
   SET THEATRE SHOT
   ========================================================= */

function setTheatreShot(
    mode
){

    mode =
        String(
            mode || "FULL"
        ).toUpperCase();


    if(
        mode !== "FULL" &&
        mode !== "MEDIUM" &&
        mode !== "CLOSE"
    ){

        mode =
            "FULL";

    }


    theatreState.shot =
        mode;


    theatreFrame.classList.remove(
        "theatre-shot-full",
        "theatre-shot-medium",
        "theatre-shot-close"
    );


    theatreFrame.classList.add(
        "theatre-shot-" +
        mode.toLowerCase()
    );

}


/* =========================================================
   SET THEATRE FOCUS
   ========================================================= */

function setTheatreFocus(
    focus
){

    focus =
        String(
            focus || ""
        ).trim().toLowerCase();


    theatreState.focus =
        focus;


    theatreFrame.classList.remove(
        "theatre-focus-left",
        "theatre-focus-center",
        "theatre-focus-right"
    );


    /*
     * These are presentation hints rather than
     * character logic.
     */

    if(
        focus === "woman-green" ||
        focus === "archive" ||
        focus === "file"
    ){

        theatreFrame.classList.add(
            "theatre-focus-right"
        );

    }else if(
        focus === "key" ||
        focus === "photograph" ||
        focus === "phone"
    ){

        theatreFrame.classList.add(
            "theatre-focus-center"
        );

    }else{

        theatreFrame.classList.add(
            "theatre-focus-center"
        );

    }


    var label =
        THEATRE_FOCUS_NAMES[
            focus
        ];


    if(
        label &&
        theatreState.sceneId
    ){

        var sceneName =
            THEATRE_SCENE_NAMES[
                theatreState.sceneId
            ] ||
            humanizeSceneName(
                theatreState.sceneId
            );


        theatreCaption.textContent =
            sceneName +
            " · " +
            label;

    }

}


/* =========================================================
   SET THEATRE TRANSITION
   ========================================================= */

function setTheatreTransition(
    transition
){

    transition =
        String(
            transition || "CROSSFADE"
        ).toUpperCase();


    if(
        transition !== "CUT" &&
        transition !== "FADE" &&
        transition !== "CROSSFADE" &&
        transition !== "SOFT-RISE" &&
        transition !== "SLIDE"
    ){

        transition =
            "CROSSFADE";

    }


    theatreState.transition =
        transition;


    theatreFrame.classList.remove(
        "theatre-transition-cut",
        "theatre-transition-fade",
        "theatre-transition-crossfade",
        "theatre-transition-soft-rise",
        "theatre-transition-slide"
    );


    theatreFrame.classList.add(
        "theatre-transition-" +
        transition.toLowerCase()
    );

}


/* =========================================================
   SET THEATRE BEAT
   ========================================================= */

function setTheatreBeat(
    beat
){

    beat =
        String(
            beat || ""
        ).trim().toLowerCase();


    theatreState.beat =
        beat;


    var classes =
        [];


    if(
        beat.indexOf("arrival") !== -1
    ){

        classes.push(
            "theatre-beat-arrival"
        );

    }


    if(
        beat.indexOf("announcement") !== -1 ||
        beat.indexOf("heir") !== -1
    ){

        classes.push(
            "theatre-beat-announcement"
        );

    }


    if(
        beat.indexOf("blackout") !== -1
    ){

        classes.push(
            "theatre-beat-blackout"
        );

    }


    if(
        beat.indexOf("door-opened") !== -1 ||
        beat.indexOf("door") !== -1
    ){

        classes.push(
            "theatre-beat-door-opened"
        );

    }


    theatreFrame.classList.remove(
        "theatre-beat-arrival",
        "theatre-beat-announcement",
        "theatre-beat-blackout",
        "theatre-beat-door-opened"
    );


    for(
        var i = 0;
        i < classes.length;
        i++
    ){

        theatreFrame.classList.add(
            classes[i]
        );

    }

}


/* =========================================================
   THEATRE MODE
   ========================================================= */

function setTheatreMode(
    mode
){

    document.body.classList.remove(
        "theatre-mode-reading",
        "theatre-mode-choice",
        "theatre-mode-game",
        "theatre-mode-result"
    );


    if(
        mode === "choice"
    ){

        document.body.classList.add(
            "theatre-mode-choice"
        );

        return;

    }


    if(
        mode === "game"
    ){

        document.body.classList.add(
            "theatre-mode-game"
        );

        return;

    }


    if(
        mode === "result"
    ){

        document.body.classList.add(
            "theatre-mode-result"
        );

        return;

    }


    document.body.classList.add(
        "theatre-mode-reading"
    );

}

){

/* =========================================================
   RENDER CHOICE
   ========================================================= */

function renderChoice(node){

    var html =
        '<div class="story-choice" ' +
        'data-choice="' +
        escapeAttr(node.id) +
        '">' +

        '<div class="story-choice-title">' +
        'What do you do?' +
        '</div>';


    for(
        var i = 0;
        i < node.options.length;
        i++
    ){

        var option =
            node.options[i];


        html +=
            '<button ' +
            'type="button" ' +
            'class="story-choice-button" ' +
            'data-choice="' +
            escapeAttr(node.id) +
            '" ' +
            'data-letter="' +
            escapeAttr(option.letter) +
            '">' +

            escapeHtml(
                option.letter +
                " — " +
                option.label
            ) +

            '</button>';

    }


    html +=
        '</div>';


    return html;

}


/* =========================================================
   CHOICE CLICK
   ========================================================= */

document.addEventListener(
    "click",
    function(event){

        var target =
            event.target;


        if(
            !target.classList.contains(
                "story-choice-button"
            )
        ){

            return;

        }


        var id =
            target.getAttribute(
                "data-choice"
            );


        var letter =
            normalizeChoiceLetter(
                target.getAttribute(
                    "data-letter"
                )
            );


        if(
            !id ||
            !letter
        ){

            return;

        }


        var previousTop =
            window.pageYOffset ||
            document.documentElement.scrollTop ||
            document.body.scrollTop ||
            0;


        saveChoice(
            id,
            letter
        );


        renderProgress();


        setTimeout(
            function(){

                var branchResult =
                    content.querySelector(
                        '[data-choice-result="' +
                        cssEscape(id) +
                        '"]'
                    );


                if(branchResult){

                    scrollToElement(
                        branchResult
                    );

                    return;

                }


                try{

                    window.scrollTo(
                        0,
                        previousTop
                    );

                }catch(e){}

            },
            60
        );

    }
);


/* =========================================================
   SAVE CHOICE
   ========================================================= */

function saveChoice(
    id,
    letter
){

    var choices =
        getChoices();


    choices[id] =
        normalizeChoiceLetter(
            letter
        );


    try{

        localStorage.setItem(
            storageKey,
            JSON.stringify(
                choices
            )
        );

    }catch(e){}

}


/* =========================================================
   NORMALIZE CHOICE LETTER
   ========================================================= */

function normalizeChoiceLetter(value){

    if(
        value === null ||
        value === undefined
    ){

        return "";

    }


    return String(value)
        .trim()
        .toUpperCase();

}


/* =========================================================
   GET CHOICES
   ========================================================= */

function getChoices(){

    try{

        var saved =
            localStorage.getItem(
                storageKey
            );


        if(!saved){

            return {};

        }


        var parsed =
            JSON.parse(
                saved
            );


        if(
            parsed &&
            typeof parsed === "object" &&
            !Array.isArray(parsed)
        ){

            return parsed;

        }


        return {};

    }catch(e){

        return {};

    }

}

/* =========================================================
   SCROLL TO ELEMENT
   ========================================================= */

function scrollToElement(element){

    if(!element){

        return;

    }


    setTimeout(
        function(){

            try{

                element.scrollIntoView({
                    behavior:"smooth",
                    block:"start"
                });

            }catch(e){

                try{

                    window.scrollTo(
                        0,
                        Math.max(
                            0,
                            element.getBoundingClientRect().top +
                            (
                                window.pageYOffset ||
                                document.documentElement.scrollTop ||
                                document.body.scrollTop ||
                                0
                            ) -
                            20
                        )
                    );

                }catch(ignore){}

            }

        },
        100
    );

}

/* =========================================================
   NEXT CHAPTER
   ========================================================= */

function renderNext(line){

    var cleaned =
        cleanControlLine(line);


    var match =
        cleaned.match(
            /^\[NEXT:\s*([^|\]]+?)\s*(?:\|\s*([^\]]+?)\s*)?\]$/i
        );


    if(!match){

        return "";

    }


    var nextFile =
        cleanPath(
            match[1]
        );


    nextFile =
        nextFile.replace(
            /\.md$/i,
            ""
        );


    var label =
        match[2]
        ? match[2].trim()
        : "Enter the next chapter";


    if(!nextFile){

        return "";

    }


    return (

        '<div class="story-next">' +

            '<div class="story-next-text">' +
                'The story continues...' +
            '</div>' +

            '<button ' +
                'type="button" ' +
                'class="story-next-button" ' +
                'data-next="' +
                escapeAttr(nextFile) +
                '">' +

                escapeHtml(label) +

            '</button>' +

        '</div>'

    );

}

/* =========================================================
   STORY ID
   ========================================================= */

function getStoryId(path){

    path =
        String(path || "");


    path =
        path.replace(
            /\.md$/i,
            ""
        );


    path =
        path.replace(
            /-chapter-\d+$/i,
            ""
        );


    return path;

}


/* =========================================================
   MEDIA PATH
   ========================================================= */

function mediaPath(src){

    if(!src){

        return "";

    }


    src =
        src.trim();


    if(
        /^https?:\/\//i.test(src) ||
        /^data:/i.test(src) ||
        src.charAt(0) === "/"
    ){

        return src;

    }


    while(
        src.indexOf("../") === 0
    ){

        src =
            src.substring(3);

    }


    while(
        src.indexOf("./") === 0
    ){

        src =
            src.substring(2);

    }


    if(
        src.indexOf("content/") === 0
    ){

        return "/" + src;

    }


    return "/content/images/" + src;

}


/* =========================================================
   FIX MEDIA
   ========================================================= */

function fixMedia(){

    var images =
        content.getElementsByTagName(
            "img"
        );

    var videos =
        content.getElementsByTagName(
            "video"
        );

    var audios =
        content.getElementsByTagName(
            "audio"
        );


    var i;


    for(
        i = 0;
        i < images.length;
        i++
    ){

        var imageSrc =
            images[i].getAttribute(
                "src"
            );


        if(imageSrc){

            images[i].src =
                mediaPath(
                    imageSrc
                );

        }


        images[i].setAttribute(
            "loading",
            "lazy"
        );

    }


    for(
        i = 0;
        i < videos.length;
        i++
    ){

        var videoSrc =
            videos[i].getAttribute(
                "src"
            );


        if(videoSrc){

            videos[i].src =
                mediaPath(
                    videoSrc
                );

        }


        videos[i].controls =
            true;

    }


    for(
        i = 0;
        i < audios.length;
        i++
    ){

        var audioSrc =
            audios[i].getAttribute(
                "src"
            );


        if(audioSrc){

            audios[i].src =
                mediaPath(
                    audioSrc
                );

        }


        audios[i].controls =
            true;

    }

}

function renderExtraMedia(data){

                    ) +
                '">' +

}


/* =========================================================
   CLEAN PATH
   ========================================================= */

function cleanPath(path){

    path =
        String(path || "")
        .replace(
            /\\/g,
            "/"
        )
        .replace(
            /^\/+/,
            ""
        );


    var parts =
        path.split("/");


    var clean = [];


    for(
        var i = 0;
        i < parts.length;
        i++
    ){

        if(
            parts[i] &&
            parts[i] !== "." &&
            parts[i] !== ".."
        ){

            clean.push(
                parts[i]
            );

        }

    }


    return clean.join("/");

}


/* =========================================================
   HTML ESCAPING
   ========================================================= */

function escapeHtml(value){

    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#39;"
        );

}


function escapeAttr(value){

    return escapeHtml(
        value
    );

}


/* =========================================================
   SIMPLE CSS ESCAPE
   ========================================================= */

function cssEscape(value){

    return String(value)

        .replace(
            /\\/g,
            "\\\\"
        )

        .replace(
            /"/g,
            '\\"'
        );

}
