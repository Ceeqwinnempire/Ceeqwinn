<div id="media"></div>

<script src="https://cdn.jsdelivr.net/npm/marked@0.3.19/marked.min.js"></script>

<script>

var search = window.location.search;
var file = "";

if(search){

    file = search
        .replace(/^\?/, "")
        .split("&")[0]
        .replace(/^file=/, "");

    try{
        file = decodeURIComponent(file);
    }catch(e){}

}

var title = document.getElementById("title");
var status = document.getElementById("status");
var content = document.getElementById("content");
var cover = document.getElementById("cover");
var credits = document.getElementById("credits");
var media = document.getElementById("media");


/* =========================================================
   INTERACTIVE STORY MAP
   =========================================================

   This is the ONLY place where we currently tell the
   reader where a choice should go.

   Example:

   choice-01 + A
       -> choice-01-a.md

   choice-01 + B
       -> choice-01-b.md

   choice-01 + C
       -> choice-01-c.md

   ========================================================= */

var storyChoices = {

    "choice-01": {

        "A": "choice-01-a",
        "B": "choice-01-b",
        "C": "choice-01-c"

    },

    "choice-02": {

        "A": "choice-02-a",
        "B": "choice-02-b"

    }

};


/* =========================================================
   CURRENT STORY FILE
   ========================================================= */

var currentStoryFile = file;


/* =========================================================
   LOAD STORY
   ========================================================= */

if(!file){

    title.innerHTML = "Article not found";
    status.innerHTML = "No article was selected.";

}else{

    loadStory(file);

}


/* =========================================================
   MAIN STORY LOADER
   ========================================================= */

function loadStory(storyFile){

    storyFile = cleanArticlePath(storyFile);

    if(!storyFile){

        title.innerHTML = "Article not found";
        status.innerHTML =
            "The article path is invalid.";

        return;

    }

    currentStoryFile = storyFile;

    status.innerHTML = "Loading...";

    var xhr = new XMLHttpRequest();

    xhr.open(
        "GET",
        articlePath(storyFile),
        true
    );

    xhr.onreadystatechange = function(){

        if(xhr.readyState !== 4){
            return;
        }

        if(xhr.status !== 200 && xhr.status !== 0){

            title.innerHTML =
                "Unable to load article";

            status.innerHTML =
                "The article could not be loaded.";

            return;

        }

        var text = xhr.responseText;

        var frontData =
            parseFrontmatter(text);

        var articleTitle =
            frontData.title || getFileName(storyFile);

        title.innerHTML =
            escapeHtml(articleTitle);


        /* =================================================
           COVER
           ================================================= */

        cover.style.display = "none";

        if(frontData.cover){

            cover.src =
                mediaPath(frontData.cover);

            cover.alt =
                articleTitle;

            cover.style.display =
                "block";

            prepareImage(cover);

            cover.onerror = function(){

                cover.style.display =
                    "none";

            };

        }


        /* =================================================
           CREDITS
           ================================================= */

        credits.innerHTML = "";

        if(frontData.credits){

            credits.innerHTML =
                "<strong>Credits:</strong> " +
                escapeHtml(frontData.credits);

        }


        /* =================================================
           RENDER MARKDOWN
           ================================================= */

        content.innerHTML =
            marked(frontData.body);


        /* =================================================
           FIX NORMAL MEDIA
           ================================================= */

        fixInlineImages();
        fixInlineVideos();
        fixInlineAudios();

        renderExtraMedia(frontData);


        /* =================================================
           FIND AND BUILD STORY CHOICES
           ================================================= */

        renderStoryChoices();


        status.innerHTML = "";

    };


    xhr.onerror = function(){

        title.innerHTML =
            "Unable to load article";

        status.innerHTML =
            "The article could not be loaded.";

    };


    xhr.send(null);

}


/* =========================================================
   FIND [CHOICE:choice-name]
   ========================================================= */

function renderStoryChoices(){

    var textNodes = [];

    collectTextNodes(content, textNodes);

    var i;
    var node;
    var text;
    var match;

    for(i=0; i<textNodes.length; i++){

        node = textNodes[i];

        text = node.nodeValue;

        match =
            text.match(
                /^\s*\[CHOICE:([a-zA-Z0-9_-]+)\]\s*$/
            );

        if(match){

            createChoiceInterface(
                node,
                match[1]
            );

        }

    }

}


/* =========================================================
   FIND TEXT NODES
   ========================================================= */

function collectTextNodes(element, list){

    var i;
    var child;

    for(i=0; i<element.childNodes.length; i++){

        child =
            element.childNodes[i];

        if(child.nodeType === 3){

            list.push(child);

        }else if(child.nodeType === 1){

            collectTextNodes(
                child,
                list
            );

        }

    }

}


/* =========================================================
   CREATE CHOICE BUTTONS
   ========================================================= */

function createChoiceInterface(
    textNode,
    choiceId
){

    var choices =
        storyChoices[choiceId];

    if(!choices){

        textNode.nodeValue =
            "[Choice not configured: " +
            choiceId +
            "]";

        return;

    }


    var wrapper =
        document.createElement("div");

    wrapper.className =
        "story-choice";


    var heading =
        document.createElement("div");

    heading.className =
        "story-choice-title";

    heading.innerHTML =
        "What does Lexis do?";


    wrapper.appendChild(heading);


    var keys = [];

    var key;

    for(key in choices){

        if(
            choices.hasOwnProperty(key)
        ){

            keys.push(key);

        }

    }


    var i;

    for(i=0; i<keys.length; i++){

        createChoiceButton(
            wrapper,
            choiceId,
            keys[i],
            choices[keys[i]]
        );

    }


    var choiceStatus =
        document.createElement("div");

    choiceStatus.className =
        "story-choice-status";

    choiceStatus.id =
        "choice-status-" + choiceId;

    wrapper.appendChild(
        choiceStatus
    );


    /*
       Replace the original marker
       with our choice interface.
    */

    var parent =
        textNode.parentNode;

    parent.replaceChild(
        wrapper,
        textNode
    );

}


/* =========================================================
   CREATE ONE BUTTON
   ========================================================= */

function createChoiceButton(
    wrapper,
    choiceId,
    letter,
    destination
){

    var button =
        document.createElement("button");

    button.type = "button";

    button.className =
        "story-choice-button";

    button.innerHTML =
        escapeHtml(
            letter +
            " — " +
            getChoiceLabel(
                choiceId,
                letter
            )
        );


    button.onclick = function(){

        selectStoryChoice(
            choiceId,
            letter,
            destination,
            wrapper
        );

    };


    wrapper.appendChild(button);

}


/* =========================================================
   CHOICE WORDING
   =========================================================

   This is temporary test wording.

   Later the story can supply its own
   choice wording.

   ========================================================= */

function getChoiceLabel(
    choiceId,
    letter
){

    if(
        choiceId === "choice-01"
    ){

        if(letter === "A"){
            return "Accept the request.";
        }

        if(letter === "B"){
            return "Reject it.";
        }

        if(letter === "C"){
            return "Screenshot it and investigate first.";
        }

    }


    if(
        choiceId === "choice-02"
    ){

        if(letter === "A"){
            return "Investigate the hidden compartment.";
        }

        if(letter === "B"){
            return "Go to the Okoye residence.";
        }

    }


    return "Continue.";

}


/* =========================================================
   WHEN A CHOICE IS SELECTED
   ========================================================= */

function selectStoryChoice(
    choiceId,
    letter,
    destination,
    wrapper
){

    /*
       Prevent double tapping.
    */

    var buttons =
        wrapper.getElementsByTagName(
            "button"
        );

    var i;

    for(i=0; i<buttons.length; i++){

        buttons[i].disabled = true;

    }


    /*
       Save the choice.
    */

    try{

        localStorage.setItem(
            "ceeqwinn_" + choiceId,
            letter
        );

    }catch(e){}


    /*
       Show a tiny transition message.
    */

    var choiceStatus =
        document.getElementById(
            "choice-status-" + choiceId
        );

    if(choiceStatus){

        choiceStatus.innerHTML =
            "Continuing...";

    }


    /*
       Load the next story state
       without reloading the webpage.
    */

    loadStory(destination);

}


/* =========================================================
   KEEP FOLDERS AND NORMAL FILE NAMES
   ========================================================= */

function cleanArticlePath(path){

    path =
        path.replace(/\\/g,"/");

    path =
        path.replace(/^\/+/,"");

    var parts =
        path.split("/");

    var clean = [];

    var i;
    var part;

    for(i=0; i<parts.length; i++){

        part =
            parts[i].trim();

        if(!part){
            continue;
        }

        if(
            part === "." ||
            part === ".."
        ){

            return "";

        }

        clean.push(part);

    }

    if(!clean.length){
        return "";

    }

    return clean.join("/");

}


/* =========================================================
   BUILD MARKDOWN ARTICLE URL
   ========================================================= */

function articlePath(path){

    var parts =
        path.split("/");

    var encoded = [];

    var i;

    for(i=0; i<parts.length; i++){

        encoded.push(
            encodeURIComponent(
                parts[i]
            )
        );

    }

    return (
        "../content/articles/" +
        encoded.join("/") +
        ".md"
    );

}


/* =========================================================
   READ YAML FRONTMATTER
   ========================================================= */

function parseFrontmatter(text){

    var result = {

        title:"",
        cover:"",
        credits:"",
        video:"",
        audio:"",
        downloads:[],
        body:text

    };


    var match =
        text.match(
            /^---\s*([\s\S]*?)\s*---\s*/
        );


    if(!match){
        return result;
    }


    var front =
        match[1];


    result.body =
        text.replace(
            /^---\s*[\s\S]*?\s*---\s*/,
            ""
        );


    var titleMatch =
        front.match(
            /^title:\s*["']?(.*?)["']?\s*$/m
        );


    if(titleMatch){

        result.title =
            cleanValue(
                titleMatch[1]
            );

    }


    var coverMatch =
        front.match(
            /^cover:\s*["']?(.*?)["']?\s*$/m
        );


    if(coverMatch){

        result.cover =
            cleanValue(
                coverMatch[1]
            );

    }


    var creditsMatch =
        front.match(
            /^credits:\s*["']?(.*?)["']?\s*$/m
        );


    if(creditsMatch){

        result.credits =
            cleanValue(
                creditsMatch[1]
            );

    }


    var videoMatch =
        front.match(
            /^video:\s*["']?(.*?)["']?\s*$/m
        );


    if(videoMatch){

        result.video =
            cleanValue(
                videoMatch[1]
            );

    }


    var audioMatch =
        front.match(
            /^audio:\s*["']?(.*?)["']?\s*$/m
        );


    if(audioMatch){

        result.audio =
            cleanValue(
                audioMatch[1]
            );

    }


    var downloadsMatch =
        front.match(
            /^downloads:\s*([\s\S]*?)(?=^[a-zA-Z0-9_-]+\s*:|$)/m
        );


    if(downloadsMatch){

        var lines =
            downloadsMatch[1].split("\n");

        var i;
        var line;
        var value;


        for(i=0; i<lines.length; i++){

            line =
                lines[i]
                    .replace(/^\s*-\s*/,"")
                    .trim();


            if(line){

                value =
                    cleanValue(line);


                if(value){

                    result.downloads.push(
                        value
                    );

                }

            }

        }

    }


    return result;

}


/* =========================================================
   REMOVE SIMPLE YAML QUOTES
   ========================================================= */

function cleanValue(value){

    value =
        value.replace(/^\s+/,"");

    value =
        value.replace(/\s+$/,"");


    if(
        value.length >= 2 &&
        (
            (
                value.charAt(0) === '"' &&
                value.charAt(
                    value.length - 1
                ) === '"'
            )
            ||
            (
                value.charAt(0) === "'" &&
                value.charAt(
                    value.length - 1
                ) === "'"
            )
        )
    ){

        value =
            value.substring(
                1,
                value.length - 1
            );

    }


    return value;

}


/* =========================================================
   FIX INLINE IMAGES
   ========================================================= */

function fixInlineImages(){

    var images =
        content.getElementsByTagName(
            "img"
        );

    var i;
    var src;


    for(i=0; i<images.length; i++){

        src =
            images[i].getAttribute(
                "src"
            );


        if(src){

            images[i].src =
                mediaPath(src);

            prepareImage(
                images[i]
            );


            images[i].onerror =
                function(){

                    this.alt =
                        "Image could not be loaded.";

                    this.style.opacity =
                        "0.6";

                };

        }

    }

}


/* =========================================================
   FIX INLINE VIDEOS
   ========================================================= */

function fixInlineVideos(){

    var videos =
        content.getElementsByTagName(
            "video"
        );

    var i;
    var src;


    for(i=0; i<videos.length; i++){

        src =
            videos[i].getAttribute(
                "src"
            );


        if(src){

            videos[i].src =
                mediaPath(src);

        }


        videos[i].controls =
            true;

    }

}


/* =========================================================
   FIX INLINE AUDIO
   ========================================================= */

function fixInlineAudios(){

    var audios =
        content.getElementsByTagName(
            "audio"
        );

    var i;
    var src;


    for(i=0; i<audios.length; i++){

        src =
            audios[i].getAttribute(
                "src"
            );


        if(src){

            audios[i].src =
                mediaPath(src);

        }


        audios[i].controls =
            true;

    }

}


/* =========================================================
   RENDER UPLOADED MEDIA
   ========================================================= */

function renderExtraMedia(data){

    var html = "";


    if(data.video){

        html +=
            '<div class="media-box">' +
            '<h2 class="media-title">Video</h2>' +
            '<video controls preload="metadata" width="100%">' +
            '<source src="' +
            escapeAttribute(
                mediaPath(data.video)
            ) +
            '">' +
            'Your browser cannot play this video.' +
            '</video>' +
            '</div>';

    }


    if(data.audio){

        html +=
            '<div class="media-box">' +
            '<h2 class="media-title">Audio</h2>' +
            '<audio controls preload="metadata">' +
            '<source src="' +
            escapeAttribute(
                mediaPath(data.audio)
            ) +
            '">' +
            'Your browser cannot play this audio.' +
            '</audio>' +
            '</div>';

    }


    if(data.downloads.length){

        html +=
            '<div class="media-box">' +
            '<h2 class="media-title">Downloads</h2>';


        var i;


        for(i=0; i<data.downloads.length; i++){

            html +=
                '<p>' +
                '<a href="' +
                escapeAttribute(
                    mediaPath(
                        data.downloads[i]
                    )
                ) +
                '" download>' +
                'Download file ' +
                (i + 1) +
                '</a>' +
                '</p>';

        }


        html +=
            '</div>';

    }


    media.innerHTML =
        html;

}


/* =========================================================
   LOW-SPEC IMAGE HANDLING
   ========================================================= */

function prepareImage(image){

    try{

        image.setAttribute(
            "loading",
            "lazy"
        );

    }catch(e){}


    try{

        image.setAttribute(
            "decoding",
            "async"
        );

    }catch(e){}

}


/* =========================================================
   CONVERT PAGES CMS MEDIA PATHS
   ========================================================= */

function mediaPath(src){

    if(!src){
        return "";
    }


    src =
        src.replace(/^<|>$/g,"");


    if(
        src.indexOf("http://") === 0 ||
        src.indexOf("https://") === 0 ||
        src.indexOf("data:") === 0 ||
        src.charAt(0) === "/"
    ){

        return src;

    }


    while(
        src.indexOf("../") === 0
    ){

        src =
            src.substring(3);

    }


    while(
        src.indexOf("./") === 0
    ){

        src =
            src.substring(2);

    }


    if(
        src.indexOf("content/") === 0
    ){

        return "/" + src;

    }


    return "/content/images/" + src;

}


/* =========================================================
   GET FILE NAME
   ========================================================= */

function getFileName(path){

    var parts =
        path.split("/");


    return parts[
        parts.length - 1
    ];

}


/* =========================================================
   HTML ESCAPING
   ========================================================= */

function escapeHtml(value){

    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#39;"
        );

}


/* =========================================================
   ATTRIBUTE ESCAPING
   ========================================================= */

function escapeAttribute(value){

    return escapeHtml(value);

}
