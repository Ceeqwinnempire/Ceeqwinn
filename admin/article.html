/* =========================================================
   CEEQWINN UNIVERSAL READER
   SEQUENCE READER — CODE 01

   CORE IDEA:

   One reader.

   article

   Existing Markdown files remain compatible.

/* =========================================================
   RESET / BASE
   ========================================================= */

*{
    box-sizing:border-box;
}


html{
    margin:0;

body{

}

.hidden{

   STORY MODE

.story-choice{

    padding:15px 16px;

}

}


.story-next-chapter{

/* =========================================================
   STORY RESET

.story-reset{

    display:none;

   MOODBOARD MODE

}


.moodboard-card{

    background:#fff;

}

}


.moodboard-card-content p{

/* =========================================================
   FEED MODE

.mode-feed{

}


.mode-feed .reader-inner{

}


.feed-item{

<script src="https://cdn.jsdelivr.net/npm/marked@0.3.19/marked.min.js"></script>


<script>

/* =========================================================
   CEEQWINN UNIVERSAL READER
   SEQUENCE READER — CODE 01
   JAVASCRIPT ENGINE
   ========================================================= */


/* =========================================================
   DOM REFERENCES
   ========================================================= */

var title =
    document.getElementById("title");

var status =
    document.getElementById("status");

var content =
    document.getElementById("content");

var cover =
    document.getElementById("cover");

var credits =
    document.getElementById("credits");

var media =
    document.getElementById("media");

var storyReset =
    document.getElementById("storyReset");

var reader =
    document.getElementById("reader");


/* =========================================================
   GET FILE FROM URL
   ========================================================= */

var file = "";

var search =
    window.location.search;


if(search){

    file =
        search
            .replace(/^\?/,"")
            .split("&")[0]
            .replace(/^file=/,"");


    try{

        file =
            decodeURIComponent(file);

    }catch(e){}

}


/* =========================================================
   CURRENT STORAGE KEY
   ========================================================= */

var currentStoryKey =
    "ceeqwinn_reader_" +
    cleanStorageKey(file);


/* =========================================================
   START
   ========================================================= */

if(!file){

    showError(
        "Article not found",
        "No article was selected."
    );

}else{

    loadDocument(file);

}


/* =========================================================
   RESET BUTTON
   ========================================================= */

storyReset.onclick =
    function(){

        resetCurrentStory();

    };


/* =========================================================
   LOAD DOCUMENT
   ========================================================= */

function loadDocument(storyFile){

    storyFile =
        cleanArticlePath(storyFile);


    if(!storyFile){

        showError(
            "Article not found",
            "The article path is invalid."
        );

        return;

    }


    currentStoryKey =
        "ceeqwinn_reader_" +
        cleanStorageKey(storyFile);


    status.innerHTML =
        "Loading...";


    storyReset.style.display =
        "none";


    var xhr =
        new XMLHttpRequest();


    xhr.open(
        "GET",
        articlePath(storyFile),
        true
    );


    xhr.onreadystatechange =
        function(){

            if(xhr.readyState !== 4){

                return;

            }


            if(
                xhr.status !== 200 &&
                xhr.status !== 0
            ){

                showError(
                    "Unable to load article",
                    "The article could not be loaded."
                );

                return;

            }


            var text =
                xhr.responseText;


            var data =
                parseFrontmatter(text);


            applyReaderMode(
                data.reader
            );


            renderHeader(
                data,
                storyFile
            );


            renderByMode(
                data,
                storyFile
            );


            status.innerHTML =
                "";

        };


    xhr.onerror =
        function(){

            showError(
                "Unable to load article",
                "The article could not be loaded."
            );

        };


    xhr.send(null);

}


/* =========================================================
   READER MODE
   ========================================================= */

function normalizeReaderMode(value){

    if(!value){

        return "article";

    }


    value =
        String(value)
            .toLowerCase()
            .replace(
                /["']/g,
                ""
            )
            .replace(
                /\s+/g,
                ""
            );


    if(
        value === "story" ||
        value === "interactive"
    ){

        return "story";

    }


    if(
        value === "moodboard" ||
        value === "mood-board"
    ){

        return "moodboard";

    }


    if(
        value === "feed" ||
        value === "social"
    ){

        return "feed";

    }


    return "article";

}


/* =========================================================
   APPLY READER MODE
   ========================================================= */

function applyReaderMode(mode){

    mode =
        normalizeReaderMode(mode);


    reader.className =
        "mode-" + mode;

}


/* =========================================================
   RENDER HEADER
   ========================================================= */

function renderHeader(
    data,
    storyFile
){

    var articleTitle =
        data.title ||
        getFileName(storyFile);


    title.innerHTML =
        escapeHtml(articleTitle);


    credits.innerHTML =
        "";


    if(data.credits){

        credits.innerHTML =
            "<strong>Credits:</strong> " +
            escapeHtml(
                data.credits
            );

    }


    cover.style.display =
        "none";


    if(data.cover){

        cover.src =
            mediaPath(
                data.cover
            );

        cover.alt =
            articleTitle;

        cover.style.display =
            "block";


        prepareImage(
            cover
        );


        cover.onerror =
            function(){

                cover.style.display =
                    "none";

            };

    }

}


/* =========================================================
   RENDER BY MODE
   ========================================================= */

function renderByMode(
    data,
    storyFile
){

    var mode =
        normalizeReaderMode(
            data.reader
        );


    content.innerHTML =
        "";

    media.innerHTML =
        "";


    if(mode === "story"){

        renderStoryMode(
            data
        );

    }

    else if(mode === "moodboard"){

        renderMoodboardMode(
            data
        );

    }

    else if(mode === "feed"){

        renderFeedMode(
            data
        );

    }

    else{

        renderArticleMode(
            data
        );

    }


    fixInlineImages();

    fixInlineVideos();

    fixInlineAudios();

    renderExtraMedia(
        data
    );

}


/* =========================================================
   ARTICLE MODE
   ========================================================= */

function renderArticleMode(data){

    content.innerHTML =
        marked(
            processNextChapterMarkers(
                data.body
            )
        );

}


/* =========================================================
   STORY MODE
   ========================================================= */

function renderStoryMode(data){

    content.innerHTML =
        renderInteractiveStory(
            data.body
        );


    activateStoryChoices();


    if(
        content.getElementsByClassName(
            "story-choice"
        ).length > 0
    ){

        storyReset.style.display =
            "block";

    }

}


/* =========================================================
   MOODBOARD MODE
   =========================================================

   The Markdown itself remains the source.

   A normal Markdown image:

   ![caption](image.jpg)

   becomes a moodboard card.

   Text between images remains ordinary
   Markdown content.

   ========================================================= */

function renderMoodboardMode(data){

    var html =
        marked(
            data.body
        );


    var temporary =
        document.createElement("div");


    temporary.innerHTML =
        html;


    var images =
        temporary.getElementsByTagName(
            "img"
        );


    if(!images.length){

        content.innerHTML =
            html;

        return;

    }


    var grid =
        document.createElement("div");


    grid.className =
        "moodboard-grid";


    var i;


    for(i=0; i<images.length; i++){

        var image =
            images[i];


        var card =
            document.createElement("div");


        card.className =
            "moodboard-card";


        card.appendChild(
            image.cloneNode(true)
        );


        var caption =
            image.getAttribute("alt");


        if(caption){

            var cardText =
                document.createElement("div");


            cardText.className =
                "moodboard-card-content";


            cardText.innerHTML =
                "<p>" +
                escapeHtml(caption) +
                "</p>";


            card.appendChild(
                cardText
            );

        }


        grid.appendChild(
            card
        );

    }


    content.innerHTML =
        "";


    content.appendChild(
        grid
    );


    /*
       Preserve ordinary text below
       the image collection.
    */

    var textOnly =
        temporary.cloneNode(true);


    var textImages =
        textOnly.getElementsByTagName(
            "img"
        );


    while(textImages.length){

        textImages[0].parentNode.removeChild(
            textImages[0]
        );

    }


    var remaining =
        textOnly.innerHTML;


    if(
        remaining &&
        remaining.replace(/\s/g,"")
    ){

        var textBlock =
            document.createElement("div");


        textBlock.innerHTML =
            remaining;


        content.appendChild(
            textBlock
        );

    }

}


/* =========================================================
   FEED MODE
   ========================================================= */

function renderFeedMode(data){

    var temporary =
        document.createElement("div");


    temporary.innerHTML =
        marked(
            data.body
        );


    var paragraphs =
        temporary.getElementsByTagName(
            "p"
        );


    if(!paragraphs.length){

        content.innerHTML =
            temporary.innerHTML;

        return;

    }


    var feed =
        document.createElement("div");


    var i;


    for(i=0; i<paragraphs.length; i++){

        var item =
            document.createElement("div");


        item.className =
            "feed-item";


        item.innerHTML =
            paragraphs[i].outerHTML;


        feed.appendChild(
            item
        );

    }


    content.innerHTML =
        "";


    content.appendChild(
        feed
    );

}


/* =========================================================
   INTERACTIVE STORY ENGINE
   ========================================================= */

function renderInteractiveStory(body){

    var result =
        parseStorySegment(
            body,
            0
        );


    return result.html;

}


/* =========================================================
   PARSE STORY SEGMENT
   ========================================================= */

function parseStorySegment(
    text,
    startIndex
){

    var lines =
        text.split(/\r?\n/);

    var html = "";

    var normalLines = [];

    var i =
        startIndex || 0;


    while(i < lines.length){

        if(
            /^\s*\[CHOICE:[a-zA-Z0-9_-]+\]\s*$/.test(
                lines[i]
            )
        ){

            if(normalLines.length){

                html +=
                    marked(
                        processNextChapterMarkers(
                            normalLines.join("\n")
                        )
                    );

                normalLines = [];

            }


            var choiceResult =
                parseChoiceBlock(
                    lines,
                    i
                );


            html +=
                choiceResult.html;


            i =
                choiceResult.nextIndex;


            continue;

        }


        normalLines.push(
            lines[i]
        );

        i++;

    }


    if(normalLines.length){

        html +=
            marked(
                processNextChapterMarkers(
                    normalLines.join("\n")
                )
            );

    }


    return {

        html:html,

        nextIndex:i

    };

}


/* =========================================================
   NEXT CHAPTER
   ========================================================= */

function processNextChapterMarkers(text){

    var pattern =
        /\[NEXTCHAPTER:([a-zA-Z0-9_-]+)\]/g;


    return text.replace(
        pattern,
        function(
            match,
            chapterFile
        ){

            return (
                '<a class="story-next-chapter" href="' +
                escapeAttribute(
                    chapterUrl(
                        chapterFile
                    )
                ) +
                '">' +
                'Continue to next chapter' +
                '</a>'
            );

        }
    );

}


/* =========================================================
   CHAPTER URL
   ========================================================= */

function chapterUrl(chapterFile){

    return (
        "article.html?file=" +
        encodeURIComponent(
            cleanArticlePath(
                chapterFile
            )
        )
    );

}


/* =========================================================
   PARSE CHOICE BLOCK
   ========================================================= */

function parseChoiceBlock(
    lines,
    startIndex
){

    var firstLine =
        lines[startIndex];


    var match =
        firstLine.match(
            /^\s*\[CHOICE:([a-zA-Z0-9_-]+)\]\s*$/
        );


    if(!match){

        return {

            html:"",
            nextIndex:startIndex + 1

        };

    }


    var choiceId =
        match[1];


    var options = [];

    var branches = [];

    var currentBranch =
        null;


    var i =
        startIndex + 1;


    while(i < lines.length){

        var line =
            lines[i];


        if(
            /^\s*\[ENDCHOICE\]\s*$/.test(
                line
            )
        ){

            break;

        }


        var optionMatch =
            line.match(
                /^\s*\[([A-Z])\]\s*(.+?)\s*$/
            );


        if(
            optionMatch &&
            currentBranch === null
        ){

            options.push({

                letter:
                    optionMatch[1],

                label:
                    optionMatch[2]

            });


            i++;

            continue;

        }


        var consequenceMatch =
            line.match(
                /^\s*\[CONSEQUENCE:([A-Z])\]\s*$/
            );


        if(consequenceMatch){

            currentBranch = {

                letter:
                    consequenceMatch[1],

                lines:[]

            };


            branches.push(
                currentBranch
            );


            i++;

            continue;

        }


        if(currentBranch){

            currentBranch.lines.push(
                line
            );

        }


        i++;

    }


    var html =
        '<div class="story-choice" ' +
        'data-choice-id="' +
        escapeAttribute(
            choiceId
        ) +
        '">' +


        '<div class="story-choice-title">' +
        'What does Lexis do?' +
        '</div>';


    var j;


    for(j=0; j<options.length; j++){

        html +=
            '<button ' +
            'type="button" ' +
            'class="story-choice-button" ' +
            'data-choice-id="' +
            escapeAttribute(
                choiceId
            ) +
            '" ' +
            'data-choice-letter="' +
            escapeAttribute(
                options[j].letter
            ) +
            '">' +

            escapeHtml(
                options[j].letter +
                " — " +
                options[j].label
            ) +

            '</button>';

    }


    html +=
        '</div>';


    for(j=0; j<branches.length; j++){

        var branch =
            branches[j];


        var branchResult =
            parseStorySegment(
                branch.lines.join("\n"),
                0
            );


        html +=
            '<div ' +
            'class="story-branch story-hidden" ' +
            'data-choice-id="' +
            escapeAttribute(
                choiceId
            ) +
            '" ' +
            'data-choice-letter="' +
            escapeAttribute(
                branch.letter
            ) +
            '">' +

            branchResult.html +

            '</div>';

    }


    if(i < lines.length){

        i++;

    }


    return {

        html:html,

        nextIndex:i

    };

}


/* =========================================================
   ACTIVATE STORY CHOICES
   ========================================================= */

function activateStoryChoices(){

    var buttons =
        content.getElementsByClassName(
            "story-choice-button"
        );


    var i;


    for(i=0; i<buttons.length; i++){

        activateChoiceButton(
            buttons[i]
        );

    }


    restoreSavedChoices();

}


/* =========================================================
   ONE CHOICE BUTTON
   ========================================================= */

function activateChoiceButton(button){

    button.onclick =
        function(){

            var choiceId =
                button.getAttribute(
                    "data-choice-id"
                );


            var letter =
                button.getAttribute(
                    "data-choice-letter"
                );


            selectStoryChoice(
                choiceId,
                letter
            );

        };

}


/* =========================================================
   SELECT
   ========================================================= */

function selectStoryChoice(
    choiceId,
    letter
){

    saveStoryChoice(
        choiceId,
        letter
    );


    showSelectedBranch(
        choiceId,
        letter
    );

}


/* =========================================================
   SAVE
   ========================================================= */

function saveStoryChoice(
    choiceId,
    letter
){

    try{

        var saved =
            localStorage.getItem(
                currentStoryKey
            );


        var choices = {};


        if(saved){

            try{

                choices =
                    JSON.parse(saved);

            }catch(e){

                choices = {};

            }

        }


        choices[choiceId] =
            letter;


        localStorage.setItem(
            currentStoryKey,
            JSON.stringify(
                choices
            )
        );

    }catch(e){}

}


/* =========================================================
   GET SAVED
   ========================================================= */

function getSavedStoryChoice(
    choiceId
){

    try{

        var saved =
            localStorage.getItem(
                currentStoryKey
            );


        if(!saved){

            return null;

        }


        var choices =
            JSON.parse(saved);


        if(
            choices &&
            choices[choiceId]
        ){

            return choices[choiceId];

        }

    }catch(e){}


    return null;

}


/* =========================================================
   SHOW BRANCH
   ========================================================= */

function showSelectedBranch(
    choiceId,
    letter
){

    var choices =
        content.getElementsByClassName(
            "story-choice"
        );


    var branches =
        content.getElementsByClassName(
            "story-branch"
        );


    var i;


    for(i=0; i<choices.length; i++){

        if(
            choices[i].getAttribute(
                "data-choice-id"
            ) === choiceId
        ){

            choices[i].style.display =
                "none";

        }

    }


    for(i=0; i<branches.length; i++){

        if(
            branches[i].getAttribute(
                "data-choice-id"
            ) === choiceId
        ){

            branches[i].className =
                "story-branch story-hidden";

        }

    }


    for(i=0; i<branches.length; i++){

        if(
            branches[i].getAttribute(
                "data-choice-id"
            ) === choiceId &&

            branches[i].getAttribute(
                "data-choice-letter"
            ) === letter
        ){

            branches[i].className =
                "story-branch";

        }

    }

}


/* =========================================================
   RESTORE SAVED
   ========================================================= */

function restoreSavedChoices(){

    var choices =
        content.getElementsByClassName(
            "story-choice"
        );


    var i;


    for(i=0; i<choices.length; i++){

        var choiceId =
            choices[i].getAttribute(
                "data-choice-id"
            );


        var savedLetter =
            getSavedStoryChoice(
                choiceId
            );


        if(savedLetter){

            showSelectedBranch(
                choiceId,
                savedLetter
            );

        }

    }

}


/* =========================================================
   RESET CURRENT STORY

function resetCurrentStory(){

    try{

        localStorage.removeItem(

        );

    }catch(e){}


    loadDocument(file);

            0,

        );

}


/* =========================================================
   EXTRA MEDIA
   ========================================================= */

function renderExtraMedia(data){

    var html = "";


    if(data.video){

        html +=
            '<div class="media-box">' +

            '<h2 class="media-title">' +
            'Video' +
            '</h2>' +

            '<video controls preload="metadata">' +

            '<source src="' +

            escapeAttribute(
                mediaPath(
                    data.video
                )
            ) +

            '">' +

            'Your browser cannot play this video.' +

            '</video>' +

            '</div>';

    }


    if(data.audio){

        html +=
            '<div class="media-box">' +

            '<h2 class="media-title">' +
            'Audio' +
            '</h2>' +

            '<audio controls preload="metadata">' +

            '<source src="' +

            escapeAttribute(
                mediaPath(
                    data.audio
                )
            ) +

            '">' +

            'Your browser cannot play this audio.' +

            '</audio>' +

            '</div>';

    }


    if(data.downloads.length){

        html +=
            '<div class="media-box">' +

            '<h2 class="media-title">' +
            'Downloads' +
            '</h2>';


        var i;


        for(i=0; i<data.downloads.length; i++){

            html +=
                '<p>' +

                '<a href="' +

                escapeAttribute(
                    mediaPath(
                        data.downloads[i]
                    )
                ) +

                '" download>' +

                'Download file ' +
                (i + 1) +

                '</a>' +

                '</p>';

        }


        html +=
            '</div>';

    }


    media.innerHTML =
        html;

}


/* =========================================================
   INLINE IMAGES
   ========================================================= */

function fixInlineImages(){

    var images =
        content.getElementsByTagName(

        );

    for(i=0; i<images.length; i++){

/* =========================================================
   LOW-SPEC IMAGE PREPARATION
   ========================================================= */

function prepareImage(image){

    try{

        image.setAttribute(
            "loading",
            "lazy"
        );

    }catch(e){}


    try{

        image.setAttribute(
            "decoding",
            "async"
        );

    }catch(e){}

}


/* =========================================================
   MEDIA PATH
   ========================================================= */

function mediaPath(src){

    if(!src){

        return "";

    }


    src =
        src.replace(
            /^<|>$/g,
            ""
        );


    if(
        src.indexOf("http://") === 0 ||
        src.indexOf("https://") === 0 ||
        src.indexOf("data:") === 0 ||
        src.charAt(0) === "/"
    ){

        return src;

    }


    while(
        src.indexOf("../") === 0
    ){

        src =
            src.substring(3);

    }


    while(
        src.indexOf("./") === 0
    ){

        src =
            src.substring(2);

    }


    if(
        src.indexOf("content/") === 0
    ){

        return "/" + src;

    }


    return "/content/images/" + src;

}


/* =========================================================
   ARTICLE PATH
   ========================================================= */

function articlePath(path){

    var parts =
        path.split("/");


    var encoded = [];


    var i;


    for(i=0; i<parts.length; i++){

        encoded.push(
            encodeURIComponent(
                parts[i]
            )
        );

    }


    return (
        "/content/articles/" +
        encoded.join("/") +
        ".md"
    );

}


/* =========================================================
   CLEAN ARTICLE PATH
   ========================================================= */

function cleanArticlePath(path){

    path =
        path.replace(
            /\\/g,
            "/"
        );


    path =
        path.replace(
            /^\/+/,
            ""
        );


    var parts =
        path.split("/");


    var clean = [];


    var i;


    for(i=0; i<parts.length; i++){

        var part =
            parts[i].trim();


        if(!part){

            continue;

        }


        if(
            part === "." ||
            part === ".."
        ){

            return "";

        }


        clean.push(
            part
        );

    }


    if(!clean.length){

        return "";

    }


    return clean.join("/");

}


/* =========================================================
   FRONTMATTER
   ========================================================= */

function parseFrontmatter(text){

    var result = {

        title:"",

        cover:"",

        credits:"",

        reader:"article",

        video:"",

        audio:"",

        downloads:[],

        body:text

    };


    var match =
        text.match(
            /^---\s*([\s\S]*?)\s*---\s*/
        );


    if(!match){

        return result;

    }


    var front =
        match[1];


    result.body =
        text.replace(
            /^---\s*[\s\S]*?\s*---\s*/,
            ""
        );


    var titleMatch =
        front.match(
            /^title:\s*["']?(.*?)["']?\s*$/m
        );


    if(titleMatch){

        result.title =
            cleanValue(
                titleMatch[1]
            );

    }


    var coverMatch =
        front.match(
            /^cover:\s*["']?(.*?)["']?\s*$/m
        );


    if(coverMatch){

        result.cover =
            cleanValue(
                coverMatch[1]
            );

    }


    var creditsMatch =
        front.match(
            /^credits:\s*["']?(.*?)["']?\s*$/m
        );


    if(creditsMatch){

        result.credits =
            cleanValue(
                creditsMatch[1]
            );

    }


    var readerMatch =
        front.match(
            /^reader:\s*["']?(.*?)["']?\s*$/m
        );


    if(readerMatch){

        result.reader =
            cleanValue(
                readerMatch[1]
            );

    }


    var videoMatch =
        front.match(
            /^video:\s*["']?(.*?)["']?\s*$/m
        );


    if(videoMatch){

        result.video =
            cleanValue(
                videoMatch[1]
            );

    }


    var audioMatch =
        front.match(
            /^audio:\s*["']?(.*?)["']?\s*$/m
        );


    if(audioMatch){

        result.audio =
            cleanValue(
                audioMatch[1]
            );

    }


    var downloadsMatch =
        front.match(
            /^downloads:\s*([\s\S]*?)(?=^[a-zA-Z0-9_-]+\s*:|$)/m
        );


    if(downloadsMatch){

        var lines =
            downloadsMatch[1].split("\n");


        var i;


        for(i=0; i<lines.length; i++){

            var line =
                lines[i]
                    .replace(
                        /^\s*-\s*/,
                        ""
                    )
                    .trim();


            if(line){

                var value =
                    cleanValue(
                        line
                    );


                if(value){

                    result.downloads.push(
                        value
                    );

                }

            }

        }

    }


    return result;

}


/* =========================================================
   CLEAN FRONTMATTER VALUE
   ========================================================= */

function cleanValue(value){

    value =
        value.replace(
            /^\s+/,
            ""
        );


    value =
        value.replace(
            /\s+$/,
            ""
        );


    if(
        value.length >= 2 &&
        (
            (
                value.charAt(0) === '"' &&
                value.charAt(
                    value.length - 1
                ) === '"'
            )
            ||
            (
                value.charAt(0) === "'" &&
                value.charAt(
                    value.length - 1
                ) === "'"
            )
        )
    ){

        value =
            value.substring(
                1,
                value.length - 1
            );

    }


    return value;

}


/* =========================================================
   FILE NAME
   ========================================================= */

function getFileName(path){

    var parts =
        path.split("/");


    return parts[
        parts.length - 1
    ];

}


/* =========================================================
   STORAGE KEY
   ========================================================= */

function cleanStorageKey(value){

    if(!value){

        return "article";

    }


    return String(value)
        .replace(
            /[^a-zA-Z0-9_-]/g,
            "_"
        );

}


/* =========================================================
   ERROR
   ========================================================= */

function showError(
    heading,
    message
){

    title.innerHTML =
        escapeHtml(
            heading
        );


    status.innerHTML =
        escapeHtml(
            message
        );


    content.innerHTML =
        "";


    cover.style.display =
        "none";

}


/* =========================================================
   HTML ESCAPE
   ========================================================= */

function escapeHtml(value){

    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#39;"
        );

}


/* =========================================================
   ATTRIBUTE ESCAPE
   ========================================================= */

function escapeAttribute(value){

    return escapeHtml(
        value
    );

}
