<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CEEQWINN Reader</title>

<style>

body{
    max-width:800px;
    margin:auto;
    padding:35px 18px;
    font-family:Arial,sans-serif;
    line-height:1.8;
    background:#fafafa;
    color:#222;
}

h1{
    font-size:2.2rem;
    margin-bottom:20px;
}

h2{
    margin-top:35px;
}

#cover{
    display:none;
    max-width:100%;
    height:auto;
    margin:0 auto 30px;
    border-radius:12px;
}

#credits{
    color:#666;
    margin-bottom:25px;
}

#status{
    color:#777;
}

#content{
    overflow-wrap:break-word;
}

#content img{
    display:block;
    max-width:100%;
    height:auto;
    margin:25px auto;
    border-radius:12px;
}

#content video,
#content audio{
    display:block;
    width:100%;
    max-width:100%;
    margin:25px auto;
}

#content blockquote{
    margin:25px 0;
    padding:10px 18px;
    border-left:4px solid #999;
    background:#f0f0f0;
}

#content table{
    width:100%;
    border-collapse:collapse;
    margin:25px 0;
}

#content th,
#content td{
    padding:8px;
    border:1px solid #ccc;
}


/* =========================================================
   STORY ENGINE
   ========================================================= */

.story-choice{
    margin:45px 0;
    padding:20px 0;
}

.story-choice-title{
    font-weight:bold;
    font-size:1.1rem;
    margin-bottom:15px;
}

.story-choice-button{
    display:block;
    width:100%;
    box-sizing:border-box;
    margin:10px 0;
    padding:15px;
    font:16px Arial,sans-serif;
    text-align:left;
    background:#fff;
    color:#222;
    border:1px solid #ccc;
    border-radius:8px;
    cursor:pointer;
}

.story-choice-button:hover{
    background:#f2f2f2;
}

.story-choice-button:disabled{
    cursor:default;
    opacity:.7;
}

.story-branch{
    margin-top:25px;
}

.story-next{
    margin:55px 0 25px;
    padding:25px 0;
    text-align:center;
}

.story-next-text{
    margin-bottom:18px;
    color:#555;
    font-size:1rem;
}

.story-next-button{
    display:inline-block;
    padding:14px 22px;
    font:16px Arial,sans-serif;
    background:#222;
    color:#fff;
    border:none;
    border-radius:8px;
    cursor:pointer;
}

.story-next-button:hover{
    opacity:.85;
}


/* =========================================================
   GAME BRIDGE
   ========================================================= */

.story-game{
    margin:45px 0;
    padding:25px 0;
    text-align:center;
}

.story-game-title{
    font-weight:bold;
    font-size:1.15rem;
    margin-bottom:10px;
}

.story-game-text{
    color:#666;
    margin-bottom:18px;
}

.story-game-button{
    display:inline-block;
    padding:15px 24px;
    font:16px Arial,sans-serif;
    background:#222;
    color:#fff;
    border:none;
    border-radius:8px;
    cursor:pointer;
}

.story-game-button:hover{
    opacity:.85;
}

.story-game-complete{
    margin:30px 0;
    padding:15px;
    text-align:center;
    color:#666;
}


/* =========================================================
   SHOW OUTFIT
   ========================================================= */

.story-outfit{
    margin:35px 0;
    text-align:center;
}

.story-outfit img{
    display:block;
    width:100%;
    max-width:420px;
    height:auto;
    margin:0 auto;
    border-radius:12px;
}


/* =========================================================
   RESET
   ========================================================= */

#storyReset{
    display:none;
    width:100%;
    margin:35px 0;
    padding:12px;
    background:#f7f7f7;
    color:#555;
    border:1px dashed #aaa;
    border-radius:8px;
    cursor:pointer;
}

#storyReset:hover{
    background:#eeeeee;
}


/* =========================================================
   MOBILE
   ========================================================= */

@media(max-width:600px){

    body{
        padding:25px 15px;
    }

    h1{
        font-size:1.8rem;
    }

    .story-choice-button{
        font-size:16px;
        padding:15px;
    }

    .story-next-button{
        width:100%;
        box-sizing:border-box;
    }

    .story-game-button{
        width:100%;
        box-sizing:border-box;
    }

}

</style>

</head>


<body>

<img id="cover" alt="">

<h1 id="title">Loading...</h1>

<div id="credits"></div>

<div id="status"></div>

<div id="content"></div>

<button id="storyReset" type="button">
    ↺ Reset Story
</button>

<div id="media"></div>


<script src="https://cdn.jsdelivr.net/npm/marked@0.3.19/marked.min.js"></script>


<script>

/* =========================================================
   BASIC ELEMENTS
   ========================================================= */

var title =
    document.getElementById("title");

var credits =
    document.getElementById("credits");

var status =
    document.getElementById("status");

var content =
    document.getElementById("content");

var cover =
    document.getElementById("cover");

var media =
    document.getElementById("media");

var reset =
    document.getElementById("storyReset");


/* =========================================================
   ARTICLE FILE
   ========================================================= */

var params =
    new URLSearchParams(
        window.location.search
    );

var file =
    params.get("file") || "";

var returnGame =
    params.get("return") || "";

returnGame =
    String(returnGame).trim();

file =
    cleanPath(file);


/* =========================================================
   STORY ID
   ========================================================= */

var storyId =
    getStoryId(file);


/* =========================================================
   STORY STORAGE
   ========================================================= */

var storageKey =
    "ceeqwinn_story_history_" +
    storyId;


/* =========================================================
   START
   ========================================================= */

if(!file){

    title.textContent =
        "Article not found";

    status.textContent =
        "No article was selected.";

}else{

    loadStory();

}


/* =========================================================
   LOAD MARKDOWN
   ========================================================= */

function loadStory(){

    status.textContent =
        "Loading...";

    content.innerHTML = "";

    media.innerHTML = "";

    cover.style.display =
        "none";

    var xhr =
        new XMLHttpRequest();

    xhr.open(
        "GET",
        "../content/articles/" +
        encodeURIComponent(file) +
        ".md",
        true
    );

    xhr.onload =
        function(){

            if(
                xhr.status !== 200 &&
                xhr.status !== 0
            ){

                title.textContent =
                    "Unable to load article";

                status.textContent =
                    "The article could not be loaded.";

                return;
            }

            buildStory(
                xhr.responseText
            );

        };

    xhr.onerror =
        function(){

            title.textContent =
                "Unable to load article";

            status.textContent =
                "The article could not be loaded.";

        };

    xhr.send();

}


/* =========================================================
   BUILD STORY
   ========================================================= */

function buildStory(text){

    var data =
        parseFrontmatter(text);


    title.textContent =
        data.title || file;


    credits.innerHTML =
        data.credits
        ? "<strong>Credits:</strong> " +
          escapeHtml(data.credits)
        : "";


    if(data.cover){

        cover.src =
            mediaPath(data.cover);

        cover.alt =
            data.title || file;

        cover.style.display =
            "block";

        cover.onerror =
            function(){

                cover.style.display =
                    "none";

            };

    }


    /*
     * Parse the chapter ONCE into a
     * sequential story structure.
     *
     * The engine no longer renders
     * the entire future story into
     * hidden containers.
     */

    storyNodes =
        parseStoryNodes(
            data.body.split(/\r?\n/)
        );


    /*
     * Render only the story that is
     * currently reachable.
     */

    renderProgress();


    fixMedia();

    renderExtraMedia(data);

    status.textContent = "";

}


/* =========================================================
   FRONTMATTER
   ========================================================= */

function parseFrontmatter(text){

    var data = {
        title:"",
        cover:"",
        credits:"",
        video:"",
        audio:"",
        body:text
    };


    var match =
        text.match(
            /^---\s*\n([\s\S]*?)\n---\s*\n?/
        );


    if(!match){
        return data;
    }


    var front =
        match[1];


    data.body =
        text.substring(
            match[0].length
        );


    data.title =
        frontValue(
            front,
            "title"
        );

    data.cover =
        frontValue(
            front,
            "cover"
        );

    data.credits =
        frontValue(
            front,
            "credits"
        );

    data.video =
        frontValue(
            front,
            "video"
        );

    data.audio =
        frontValue(
            front,
            "audio"
        );


    return data;

}


/* =========================================================
   FRONTMATTER VALUE
   ========================================================= */

function frontValue(
    text,
    key
){

    var re =
        new RegExp(
            "^" +
            key +
            "\\s*:\\s*[\"']?(.*?)[\"']?$",
            "m"
        );

    var match =
        text.match(re);


    return match
        ? match[1].trim()
        : "";

}


/* =========================================================
   STORY STATE
   ========================================================= */

var storyNodes = [];


/* =========================================================
   MARKER TESTS
   ========================================================= */

function isGameMarker(line){

    return /^\s*\*?\s*\[GAME:[A-Z0-9_-]+\]\s*$/.test(
        line
    );

}


function isChoiceStart(line){

    return /^\s*\*?\s*\[CHOICE:[\w-]+\]\s*$/.test(
        line
    );

}


function isShowOutfitMarker(line){

    return /^\s*\*?\s*\[SHOWOUTFIT\]\s*$/.test(
        line
    );

}


function isNextMarker(line){

    return /^\s*\*?\s*\[NEXT:[^\]]+\]\s*$/.test(
        line
    );

}


function isIfMarker(line){

    return /^\s*\*?\s*\[IF:[\w-]+=[A-Z]\]\s*$/.test(
        line
    );

}


function isElseMarker(line){

    return /^\s*\*?\s*\[ELSE\]\s*$/.test(
        line
    );

}


function isEndIfMarker(line){

    return /^\s*\*?\s*\[ENDIF\]\s*$/.test(
        line
    );

}


function isEndChoiceMarker(line){

    return /^\s*\*?\s*\[ENDCHOICE\]\s*$/.test(
        line
    );

}


/* =========================================================
   GET GAME ID
   ========================================================= */

function getGameId(line){

    var match =
        line.match(
            /^\s*\*?\s*\[GAME:([A-Z0-9_-]+)\]\s*$/
        );

    return match
        ? match[1]
        : "";

}


/* =========================================================
   PARSE COMPLETE STORY INTO NODES
   ========================================================= */

function parseStoryNodes(lines){

    var result = [];
    var normal = [];
    var i = 0;


    function flushNormal(){

        if(normal.length){

            result.push({
                type:"markdown",
                text:normal.join("\n")
            });

            normal = [];

        }

    }


    while(i < lines.length){

        var line =
            lines[i];


        /*
         * CONDITIONAL
         */

        if(isIfMarker(line)){

            flushNormal();

            var conditional =
                parseConditionalNode(
                    lines,
                    i
                );

            result.push(
                conditional.node
            );

            i =
                conditional.next;

            continue;

        }


        /*
         * CHOICE
         */

        if(isChoiceStart(line)){

            flushNormal();

            var choice =
                parseChoiceNode(
                    lines,
                    i
                );

            result.push(
                choice.node
            );

            i =
                choice.next;

            continue;

        }


        /*
         * GAME
         */

        if(isGameMarker(line)){

            flushNormal();

            result.push({
                type:"game",
                id:getGameId(line)
            });

            i++;

            continue;

        }


        /*
         * SHOW OUTFIT
         */

        if(isShowOutfitMarker(line)){

            flushNormal();

            result.push({
                type:"outfit"
            });

            i++;

            continue;

        }


        /*
         * NEXT
         */

        if(isNextMarker(line)){

            flushNormal();

            result.push({
                type:"next",
                line:line
            });

            i++;

            continue;

        }


        /*
         * Stray control markers are ignored.
         */

        if(
            isElseMarker(line) ||
            isEndIfMarker(line) ||
            isEndChoiceMarker(line)
        ){

            i++;
            continue;

        }


        normal.push(line);

        i++;

    }


    flushNormal();

    return result;

}


/* =========================================================
   PARSE CHOICE NODE
   ========================================================= */

function parseChoiceNode(
    lines,
    start
){

    var match =
        lines[start].match(
            /^\s*\*?\s*\[CHOICE:([\w-]+)\]\s*$/
        );


    if(!match){

        return {
            node:{
                type:"markdown",
                text:""
            },
            next:start + 1
        };

    }


    var id =
        match[1];


    var options = [];
    var branches = {};

    var currentLetter =
        null;

    var currentLines = [];

    var i =
        start + 1;


    function saveBranch(){

        if(
            currentLetter !== null
        ){

            branches[currentLetter] =
                parseStoryNodes(
                    currentLines
                );

        }

        currentLines = [];

    }


    while(i < lines.length){

        var line =
            lines[i];


        /*
         * ENDCHOICE
         */

        if(isEndChoiceMarker(line)){

            saveBranch();

            i++;

            break;

        }


        /*
         * OPTION
         */

        var option =
            line.match(
                /^\s*\*?\s*\[([A-Z])\]\s*(.+?)\s*$/
            );


        if(
            option &&
            currentLetter === null
        ){

            options.push({
                letter:option[1],
                label:option[2]
            });

            i++;

            continue;

        }


        /*
         * CONSEQUENCE
         */

        var consequence =
            line.match(
                /^\s*\*?\s*\[CONSEQUENCE:([A-Z])\]\s*$/
            );


        if(consequence){

            saveBranch();

            currentLetter =
                consequence[1];

            i++;

            continue;

        }


        /*
         * Branch content
         */

        if(currentLetter !== null){

            currentLines.push(line);

        }

        i++;

    }


    saveBranch();


    return {

        node:{
            type:"choice",
            id:id,
            options:options,
            branches:branches
        },

        next:i

    };

}


/* =========================================================
   PARSE CONDITIONAL NODE
   ========================================================= */

function parseConditionalNode(
    lines,
    start
){

    var first =
        lines[start].match(
            /^\s*\*?\s*\[IF:([\w-]+)=([A-Z])\]\s*$/
        );


    if(!first){

        return {
            node:{
                type:"markdown",
                text:""
            },
            next:start + 1
        };

    }


    var id =
        first[1];

    var letter =
        first[2];


    var thenLines = [];
    var elseLines = [];

    var current =
        thenLines;

    var depth = 1;
    var i =
        start + 1;


    while(i < lines.length){

        var line =
            lines[i];


        /*
         * Nested IF
         */

        if(isIfMarker(line)){

            depth++;

            current.push(line);

            i++;

            continue;

        }


        /*
         * ENDIF
         */

        if(isEndIfMarker(line)){

            depth--;

            if(depth === 0){

                i++;

                break;

            }

            current.push(line);

            i++;

            continue;

        }


        /*
         * ELSE belonging to
         * this IF.
         */

        if(
            depth === 1 &&
            isElseMarker(line)
        ){

            current =
                elseLines;

            i++;

            continue;

        }


        current.push(line);

        i++;

    }


    return {

        node:{
            type:"conditional",
            id:id,
            letter:letter,
            thenNodes:
                parseStoryNodes(
                    thenLines
                ),
            elseNodes:
                parseStoryNodes(
                    elseLines
                )
        },

        next:i

    };

}


/* =========================================================
   RENDER PROGRESS
   =========================================================

   THIS IS THE MAIN FIX.

   The engine walks through the story
   from the beginning.

   It renders normal story.

   If it encounters a completed choice,
   it follows that choice.

   If it encounters an incomplete choice,
   it renders that choice and STOPS.

   If it encounters a completed game,
   it passes through the game and
   continues.

   If it encounters an incomplete game,
   it renders the game gate and STOPS.

   If it encounters NEXT,
   it renders NEXT and STOPS.

   Therefore the reader never renders
   unreachable future story into hidden
   containers.
   ========================================================= */

function renderProgress(){

    content.innerHTML = "";

    var result =
        executeNodes(
            storyNodes,
            content
        );


    /*
     * Show reset whenever this chapter
     * contains story progression controls.
     */

    if(
        result.hasProgress
    ){

        reset.style.display =
            "block";

    }else{

        reset.style.display =
            "none";

    }


    fixMedia();


    /*
     * If we returned from a game,
     * move the reader to the newly
     * unlocked continuation.
     */

    if(returnGame){

        scrollToGameContinuation();

        /*
         * Only use the return marker
         * once during this page load.
         */

        returnGame = "";

    }

}


/* =========================================================
   EXECUTE STORY NODES
   ========================================================= */

function executeNodes(
    nodes,
    target
){

    var result = {
        stopped:false,
        hasProgress:false
    };


    for(
        var i = 0;
        i < nodes.length;
        i++
    ){

        var node =
            nodes[i];


        /*
         * MARKDOWN
         */

        if(
            node.type ===
            "markdown"
        ){

            if(
                node.text.trim()
            ){

                target.insertAdjacentHTML(
                    "beforeend",
                    marked(node.text)
                );

            }

            continue;

        }


        /*
         * SHOW OUTFIT
         */

        if(
            node.type ===
            "outfit"
        ){

            target.insertAdjacentHTML(
                "beforeend",
                renderShowOutfit()
            );

            continue;

        }


        /*
         * CONDITIONAL
         */

        if(
            node.type ===
            "conditional"
        ){

            var choices =
                getChoices();

            var selected =
                choices[node.id];


            if(
                selected ===
                node.letter
            ){

                var branchResult =
                    executeNodes(
                        node.thenNodes,
                        target
                    );

                if(
                    branchResult.stopped
                ){

                    result.stopped =
                        true;

                    result.hasProgress =
                        true;

                    return result;

                }

            }else{

                var elseResult =
                    executeNodes(
                        node.elseNodes,
                        target
                    );

                if(
                    elseResult.stopped
                ){

                    result.stopped =
                        true;

                    result.hasProgress =
                        true;

                    return result;

                }

            }

            continue;

        }


        /*
         * CHOICE
         */

        if(
            node.type ===
            "choice"
        ){

            result.hasProgress =
                true;


            var savedChoices =
                getChoices();

            var savedLetter =
                savedChoices[node.id];


            /*
             * Choice already completed.
             *
             * Execute ONLY the selected
             * consequence and then continue
             * with the story after the choice.
             */

            if(savedLetter){

                var savedBranch =
                    node.branches[
                        savedLetter
                    ] || [];


                var branchResult =
                    executeNodes(
                        savedBranch,
                        target
                    );


                if(
                    branchResult.stopped
                ){

                    result.stopped =
                        true;

                    return result;

                }


                continue;

            }


            /*
             * Choice has not been made.
             *
             * This is the current gate.
             */

            target.insertAdjacentHTML(
                "beforeend",
                renderChoice(node)
            );


            result.stopped =
                true;

            return result;

        }


        /*
         * GAME
         */

        if(
            node.type ===
            "game"
        ){

            result.hasProgress =
                true;


            var completedGames =
                getCompletedGames();


            /*
             * GAME ALREADY COMPLETED
             *
             * This is the crucial
             * bridge behavior.
             *
             * We simply PASS THROUGH
             * the game and continue with
             * the story after it.
             */

            if(
                completedGames[
                    node.id
                ]
            ){

                continue;

            }


            /*
             * GAME NOT COMPLETED
             *
             * Stop the story here.
             */

            target.insertAdjacentHTML(
                "beforeend",
                renderGame(
                    node.id
                )
            );


            result.stopped =
                true;

            return result;

        }


        /*
         * NEXT CHAPTER
         */

        if(
            node.type ===
            "next"
        ){

            result.hasProgress =
                true;


            target.insertAdjacentHTML(
                "beforeend",
                renderNext(
                    node.line
                )
            );


            result.stopped =
                true;

            return result;

        }

    }


    return result;

}


/* =========================================================
   RENDER CHOICE
   ========================================================= */

function renderChoice(node){

    var html =
        '<div class="story-choice" ' +
        'data-choice="' +
        escapeAttr(node.id) +
        '">' +

        '<div class="story-choice-title">' +
        'What do you do?' +
        '</div>';


    for(
        var i = 0;
        i < node.options.length;
        i++
    ){

        var option =
            node.options[i];


        html +=
            '<button ' +
            'type="button" ' +
            'class="story-choice-button" ' +
            'data-choice="' +
            escapeAttr(node.id) +
            '" ' +
            'data-letter="' +
            escapeAttr(option.letter) +
            '">' +

            escapeHtml(
                option.letter +
                " — " +
                option.label
            ) +

            '</button>';

    }


    html +=
        '</div>';


    return html;

}


/* =========================================================
   CHOICE CLICK
   ========================================================= */

document.addEventListener(
    "click",
    function(event){

        var target =
            event.target;


        if(
            !target.classList.contains(
                "story-choice-button"
            )
        ){

            return;

        }


        var id =
            target.getAttribute(
                "data-choice"
            );

        var letter =
            target.getAttribute(
                "data-letter"
            );


        if(
            !id ||
            !letter
        ){

            return;

        }


        saveChoice(
            id,
            letter
        );


        /*
         * Rebuild the reachable story.
         *
         * Because the choice is now
         * saved, the engine passes through
         * it, renders its selected
         * consequence, and keeps going
         * until the NEXT unresolved gate.
         */

        renderProgress();


        /*
         * Put the newly rendered
         * continuation into view.
         */

        setTimeout(
            function(){

                var firstChoice =
                    content.querySelector(
                        '.story-choice[data-choice="' +
                        cssEscape(id) +
                        '"]'
                    );

                if(firstChoice){

                    firstChoice.scrollIntoView({
                        behavior:"smooth",
                        block:"start"
                    });

                }

            },
            50
        );

    }
);


/* =========================================================
   SAVE CHOICE
   ========================================================= */

function saveChoice(
    id,
    letter
){

    var choices =
        getChoices();


    choices[id] =
        letter;


    try{

        localStorage.setItem(
            storageKey,
            JSON.stringify(
                choices
            )
        );

    }catch(e){}

}


/* =========================================================
   GET CHOICES
   ========================================================= */

    try{

    }catch(e){

}

/* =========================================================
   GAME RETURN SCROLL
   ========================================================= */

function scrollToGameContinuation(){

    var targetGame =
        String(returnGame)
        .trim()
        .toUpperCase();


    if(!targetGame){

        return;

    }


    /*
     * There is no hidden continuation
     * anymore.
     *
     * The story has already resumed
     * after the completed game.
     *
     * Find a useful point near the
     * resumed content instead.
     */

    var outfit =
        content.querySelector(
            ".story-outfit"
        );


    var choice =
        content.querySelector(
            ".story-choice"
        );


    var next =
        content.querySelector(
            ".story-next"
        );


    var target =
        outfit ||
        choice ||
        next;


    if(!target){

        return;

    }


    setTimeout(
        function(){

            try{

                target.scrollIntoView({
                    behavior:"smooth",
                    block:"start"
                });

            }catch(e){

                try{

                    window.scrollTo(
                        0,
                        Math.max(
                            0,
                            target.getBoundingClientRect().top +
                            (
                                window.pageYOffset ||
                                document.documentElement.scrollTop ||
                                document.body.scrollTop ||
                                0
                            ) -
                            20
                        )
                    );

                }catch(ignore){}

            }

        },
        150
    );

}


/* =========================================================
   SHOW OUTFIT
   ========================================================= */

function renderShowOutfit(){

    var outfit =
        "lexis_default";


    try{

        var saved =
            localStorage.getItem(
                "ceeqwinn_player_state"
            );


        if(saved){

            var state =
                JSON.parse(
                    saved
                );


            if(
                state &&
                state.characters &&
                state.characters.lexis &&
                state.characters.lexis.currentOutfit
            ){

                outfit =
                    state.characters.lexis.currentOutfit;

            }

        }

    }catch(e){}


    var images = {

        lexis_default:
            "/content/images/characters/lexis/outfits/lexis_default.png.jpeg",

        lexis_red_dress:
            "/content/images/characters/lexis/outfits/lexis_red_dress.png.jpeg",

        lexis_black_dress:
            "/content/images/characters/lexis/outfits/lexis_black_dress.png.jpeg"

    };


    var src =
        images[outfit] ||
        images.lexis_default;


    return (

        '<div class="story-outfit">' +

            '<img ' +
                'src="' +
                escapeAttr(src) +
                '" ' +
                'alt="Lexis outfit" ' +
                'loading="lazy">' +

        '</div>'

    );

}


/* =========================================================
   NEXT CHAPTER
   ========================================================= */

function renderNext(line){

    var match =
        line.match(
            /^\s*\*?\s*\[NEXT:([^]|]+)(?:\|([^\]]+))?\]\s*$/
        );


    if(!match){

        return "";

    }


    var nextFile =
        cleanPath(
            match[1]
        );


    nextFile =
        nextFile.replace(
            /\.md$/i,
            ""
        );


    var label =
        match[2]
        ? match[2].trim()
        : "Enter the next chapter";


    return (

        '<div class="story-next">' +

            '<div class="story-next-text">' +
                'The story continues...' +
            '</div>' +

            '<button ' +
                'type="button" ' +
                'class="story-next-button" ' +
                'data-next="' +
                escapeAttr(nextFile) +
                '">' +

                escapeHtml(label) +

            '</button>' +

        '</div>'

    );

}


/* =========================================================
   NEXT CHAPTER CLICK
   ========================================================= */

document.addEventListener(
    "click",
    function(event){

        var target =
            event.target;


        if(
            !target.classList.contains(
                "story-next-button"
            )
        ){

            return;

        }


        if(
            target.disabled
        ){

            return;

        }


        var nextFile =
            target.getAttribute(
                "data-next"
            );


        if(!nextFile){

            return;

        }


        nextFile =
            cleanPath(
                nextFile
            );


        nextFile =
            nextFile.replace(
                /\.md$/i,
                ""
            );


        window.location.href =
            "article.html?file=" +
            encodeURIComponent(
                nextFile
            );

    }
);

/* =========================================================
   STORY ID
   ========================================================= */

function getStoryId(path){

    path =
        String(path);


    path =
        path.replace(
            /\.md$/i,
            ""
        );


    /*
     * Chapter-specific files share the
     * same base story history.
     */

    path =
        path.replace(
            /-chapter-\d+$/i,
            ""
        );


    return path;

}


/* =========================================================
   MEDIA PATH
   ========================================================= */

function mediaPath(src){

    if(!src){

        return "";

    }


    src =
        src.trim();


    if(
        /^https?:\/\//i.test(src) ||
        /^data:/i.test(src) ||
        src.charAt(0) === "/"
    ){

        return src;

    }


    while(
        src.indexOf("../") === 0
    ){

        src =
            src.substring(3);

    }


    while(
        src.indexOf("./") === 0
    ){

        src =
            src.substring(2);

    }


    if(
        src.indexOf("content/") === 0
    ){

        return "/" + src;

    }


    return "/content/images/" + src;

}


/* =========================================================
   FIX MEDIA
   ========================================================= */

function fixMedia(){

    var images =
        content.getElementsByTagName(
            "img"
        );

    var videos =
        content.getElementsByTagName(
            "video"
        );

    var audios =
        content.getElementsByTagName(
            "audio"
        );

    var i;


    for(
        i = 0;
        i < images.length;
        i++
    ){

        var imageSrc =
            images[i].getAttribute(
                "src"
            );


        if(imageSrc){

            images[i].src =
                mediaPath(
                    imageSrc
                );

        }


        images[i].setAttribute(
            "loading",
            "lazy"
        );

    }


    for(
        i = 0;
        i < videos.length;
        i++
    ){

        var videoSrc =
            videos[i].getAttribute(
                "src"
            );


        if(videoSrc){

            videos[i].src =
                mediaPath(
                    videoSrc
                );

        }


        videos[i].controls =
            true;

    }


    for(
        i = 0;
        i < audios.length;
        i++
    ){

        var audioSrc =
            audios[i].getAttribute(
                "src"
            );


        if(audioSrc){

            audios[i].src =
                mediaPath(
                    audioSrc
                );

        }


        audios[i].controls =
            true;

    }

}


/* =========================================================
   EXTRA MEDIA
   ========================================================= */

function renderExtraMedia(data){

    var html = "";


    if(data.video){

        html +=

            '<h2>Video</h2>' +

            '<video ' +
                'controls ' +
                'preload="metadata">' +

                '<source src="' +
                    escapeAttr(
                        mediaPath(
                            data.video
                        )
                    ) +
                '">' +

            '</video>';

    }


    if(data.audio){

        html +=

            '<h2>Audio</h2>' +

            '<audio ' +
                'controls ' +
                'preload="metadata">' +

                '<source src="' +
                    escapeAttr(
                        mediaPath(
                            data.audio
                        )
                    ) +
                '">' +

            '</audio>';

    }


    media.innerHTML =
        html;

}


/* =========================================================
   CLEAN PATH
   ========================================================= */

function cleanPath(path){

    path =
        String(path)
        .replace(
            /\\/g,
            "/"
        )
        .replace(
            /^\/+/,
            ""
        );


    var parts =
        path.split("/");


    var clean = [];


    for(
        var i = 0;
        i < parts.length;
        i++
    ){

        if(
            parts[i] &&
            parts[i] !== "." &&
            parts[i] !== ".."
        ){

            clean.push(
                parts[i]
            );

        }

    }


    return clean.join("/");

}


/* =========================================================
   HTML ESCAPING
   ========================================================= */

function escapeHtml(value){

    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#39;"
        );

}


function escapeAttr(value){

    return escapeHtml(
        value
    );

}


/* =========================================================
   SIMPLE CSS ESCAPE
   ========================================================= */

function cssEscape(value){

    return String(value)

        .replace(
            /\\/g,
            "\\\\"
        )

        .replace(
            /"/g,
            '\\"'
        );

}
