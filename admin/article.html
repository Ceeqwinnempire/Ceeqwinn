<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CEEQWINN Reader</title>

<style>

body{
    max-width:800px;
    margin:auto;
    padding:40px 20px;
    font-family:Arial,sans-serif;
    line-height:1.8;
    background:#fafafa;
    color:#222;
}

h1{
    font-size:2.2rem;
    margin-bottom:20px;
}

#content{
    word-wrap:break-word;
}

#content img{
    display:block;
    max-width:100%;
    height:auto;
    margin:24px auto;
    border-radius:12px;
}

#content video{
    display:block;
    width:100%;
    max-width:100%;
    margin:24px auto;
}

#content audio{
    display:block;
    width:100%;
    margin:24px 0;
}

#content h2,
#content h3{
    margin-top:30px;
}

#content blockquote{
    margin:24px 0;
    padding:10px 20px;
    border-left:4px solid #999;
    background:#f0f0f0;
}

#content table{
    width:100%;
    border-collapse:collapse;
    margin:24px 0;
}

#content th,
#content td{
    padding:10px;
    border:1px solid #ccc;
}

#status{
    color:#666;
}

</style>

</head>

<body>

<h1 id="title">Loading...</h1>

<div id="status">Loading article...</div>

<div id="content"></div>

<script src="https://cdn.jsdelivr.net/npm/marked@0.3.19/marked.min.js"></script>

<script>

var search = window.location.search;
var file = "";

if(search){

    file = search
        .replace(/^\?/, "")
        .split("&")[0]
        .replace(/^file=/, "");

    try{
        file = decodeURIComponent(file);
    }catch(e){}

}

var title = document.getElementById("title");
var status = document.getElementById("status");
var content = document.getElementById("content");

if(!file){

    title.innerHTML = "Article not found";
    status.innerHTML = "No article was selected.";

}else{

    file = file.replace(/[^a-zA-Z0-9_-]/g,"");

    var xhr = new XMLHttpRequest();

    xhr.open(
        "GET",
        "../content/articles/" + file + ".md",
        true
    );

    xhr.onreadystatechange = function(){

        if(xhr.readyState !== 4){
            return;
        }

        if(xhr.status !== 200 && xhr.status !== 0){

            title.innerHTML = "Unable to load article";
            status.innerHTML = "The article could not be loaded.";
            return;

        }

        var text = xhr.responseText;
        var markdown = text;
        var articleTitle = file;

        var front = text.match(
            /^---\s*([\s\S]*?)\s*---\s*/
        );

        if(front){

            var titleMatch = front[1].match(
                /^title:\s*["']?(.*?)["']?\s*$/m
            );

            if(titleMatch){
                articleTitle = titleMatch[1];
            }

            markdown = text.replace(
                /^---\s*[\s\S]*?\s*---\s*/,
                ""
            );

        }

        title.innerHTML = articleTitle;

        /*
        Normalize Pages CMS image links.

        Pages CMS may save some image paths like:

        ![image](</content/images/example (1).jpeg>)

        Older versions of Marked can have trouble
        parsing this form.

        Convert it to:

        ![image](/content/images/example (1).jpeg)
        */

        markdown = markdown.replace(
            /\]\(<([^>]+)>\)/g,
            "]($1)"
        );

        /*
        Render the article text immediately.

        Images are NOT waited for here.
        */

        content.innerHTML = marked(markdown);

        /*
        Fix media paths and make images
        as lightweight as possible for
        browsers that support these hints.
        */

        var images = content.getElementsByTagName("img");
        var videos = content.getElementsByTagName("video");
        var audios = content.getElementsByTagName("audio");

        var i;
        var src;

        for(i=0; i<images.length; i++){

            src = images[i].getAttribute("src");

            if(src){

                images[i].src = mediaPath(src);

                /*
                These are optional browser hints.
                Older browsers simply ignore them.
                */

                images[i].setAttribute(
                    "loading",
                    "lazy"
                );

                images[i].setAttribute(
                    "decoding",
                    "async"
                );

            }

        }

        for(i=0; i<videos.length; i++){

            src = videos[i].getAttribute("src");

            if(src){
                videos[i].src = mediaPath(src);
            }

            videos[i].controls = true;

        }

        for(i=0; i<audios.length; i++){

            src = audios[i].getAttribute("src");

            if(src){
                audios[i].src = mediaPath(src);
            }

            audios[i].controls = true;

        }

        /*
        The Markdown has loaded and the article
        is now visible.

        Do NOT wait for images, GIFs, video,
        or audio before clearing this message.
        */

        status.innerHTML = "";

    };

    xhr.onerror = function(){

        title.innerHTML = "Unable to load article";
        status.innerHTML = "The article could not be loaded.";

    };

    xhr.send(null);

}


/*
Convert Pages CMS media paths
into website-root paths.
*/

function mediaPath(src){

    if(
        src.indexOf("http://") === 0 ||
        src.indexOf("https://") === 0 ||
        src.indexOf("data:") === 0 ||
        src.charAt(0) === "/"
    ){
        return src;
    }

    while(src.indexOf("../") === 0){
        src = src.substring(3);
    }

    while(src.indexOf("./") === 0){
        src = src.substring(2);
    }

    if(src.indexOf("content/") === 0){
        return "/" + src;
    }

    return "/content/images/" + src;

}

</script>

</body>

</html>
