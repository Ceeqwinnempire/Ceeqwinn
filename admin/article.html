<script>


/* =========================================================
   GET ARTICLE FILE
   ========================================================= */

var search = window.location.search;
var file = "";

if(search){

    file = search
        .replace(/^\?/, "")
        .split("&")[0]
        .replace(/^file=/, "");

    try{

        file = decodeURIComponent(file);

    }catch(e){}

}


var title =
    document.getElementById("title");

var status =
    document.getElementById("status");

var content =
    document.getElementById("content");

var cover =
    document.getElementById("cover");

var credits =
    document.getElementById("credits");

var media =
    document.getElementById("media");


if(!file){

    title.innerHTML =
        "Article not found";

    status.innerHTML =
        "No article was selected.";

}else{

    loadStory(file);

}


/* =========================================================
   LOAD STORY
   ========================================================= */

function loadStory(storyFile){

    storyFile =
        cleanArticlePath(storyFile);

    if(!storyFile){

        title.innerHTML =
            "Article not found";

        status.innerHTML =
            "The article path is invalid.";

        return;

    }


    status.innerHTML =
        "Loading...";


    var xhr =
        new XMLHttpRequest();


    xhr.open(
        "GET",
        articlePath(storyFile),
        true
    );


    xhr.onreadystatechange =
        function(){

            if(xhr.readyState !== 4){
                return;
            }


            if(
                xhr.status !== 200 &&
                xhr.status !== 0
            ){

                title.innerHTML =
                    "Unable to load article";

                status.innerHTML =
                    "The article could not be loaded.";

                return;

            }


            var text =
                xhr.responseText;


            var frontData =
                parseFrontmatter(text);


            var articleTitle =
                frontData.title ||
                getFileName(storyFile);


            title.innerHTML =
                escapeHtml(articleTitle);


            /* COVER */

            cover.style.display =
                "none";


            if(frontData.cover){

                cover.src =
                    mediaPath(
                        frontData.cover
                    );

                cover.alt =
                    articleTitle;

                cover.style.display =
                    "block";

                prepareImage(cover);

                cover.onerror =
                    function(){

                        cover.style.display =
                            "none";

                    };

            }


            /* CREDITS */

            credits.innerHTML =
                "";


            if(frontData.credits){

                credits.innerHTML =
                    "<strong>Credits:</strong> " +
                    escapeHtml(
                        frontData.credits
                    );

            }


            /*
               FIRST PROCESS THE INTERACTIVE
               STORY MARKUP.
            */

            var storyBody =
                prepareInteractiveStory(
                    frontData.body
                );


            /*
               THEN LET MARKED RENDER
               THE NORMAL STORY.
            */

            content.innerHTML =
                marked(storyBody);


            /*
               BUILD THE CHOICES.
            */

            renderStoryChoices();


            /*
               FIX NORMAL MEDIA.
            */

            fixInlineImages();

            fixInlineVideos();

            fixInlineAudios();

            renderExtraMedia(frontData);


            status.innerHTML =
                "";

        };


    xhr.onerror =
        function(){

            title.innerHTML =
                "Unable to load article";

            status.innerHTML =
                "The article could not be loaded.";

        };


    xhr.send(null);

}


/* =========================================================
   PREPARE INTERACTIVE STORY
   =========================================================

   The CMS article can contain:

   [CHOICE:choice-01]

   [A] Accept the request.
   [B] Reject it.
   [C] Investigate first.

   [CONSEQUENCE:A]

   Text for A.

   [CONSEQUENCE:B]

   Text for B.

   [CONSEQUENCE:C]

   Text for C.

   [ENDCHOICE]

   The engine hides the consequence
   sections until a choice is selected.

   ========================================================= */

function prepareInteractiveStory(body){

    var lines =
        body.split(/\r?\n/);

    var output = [];

    var insideChoice =
        false;

    var currentChoice =
        null;

    var choiceNumber =
        0;

    var i;
    var line;
    var match;


    for(i=0; i<lines.length; i++){

        line =
            lines[i];


        /*
           START CHOICE
        */

        match =
            line.match(
                /^\s*\[CHOICE:([a-zA-Z0-9_-]+)\]\s*$/
            );


        if(match){

            insideChoice = true;

            currentChoice =
                match[1];

            choiceNumber++;

            output.push(
                "[[CHOICESTART:" +
                currentChoice +
                "]]"
            );

            continue;

        }


        /*
           CHOICE OPTION
        */

        if(insideChoice){

            match =
                line.match(
                    /^\s*\[([A-Z])\]\s*(.+?)\s*$/
                );


            if(match){

                output.push(
                    "[[CHOICEOPTION:" +
                    currentChoice +
                    ":" +
                    match[1] +
                    ":" +
                    encodeChoiceText(
                        match[2]
                    ) +
                    "]]"
                );

                continue;

            }


            /*
               CONSEQUENCE
            */

            match =
                line.match(
                    /^\s*\[CONSEQUENCE:([A-Z])\]\s*$/
                );


            if(match){

                output.push(
                    "[[CONSEQUENCESTART:" +
                    currentChoice +
                    ":" +
                    match[1] +
                    "]]"
                );

                continue;

            }


            /*
               END CHOICE
            */

            if(
                /^\s*\[ENDCHOICE\]\s*$/.test(
                    line
                )
            ){

                output.push(
                    "[[CHOICEEND:" +
                    currentChoice +
                    "]]"
                );

                insideChoice =
                    false;

                currentChoice =
                    null;

                continue;

            }

        }


        /*
           NORMAL STORY LINE
        */

        output.push(line);

    }


    return output.join("\n");

}


/* =========================================================
   TEMPORARY ENCODING FOR CHOICE TEXT
   ========================================================= */

function encodeChoiceText(text){

    return encodeURIComponent(
        text
    );

}


/* =========================================================
   FIND CHOICE MARKERS AFTER MARKDOWN
   ========================================================= */

function renderStoryChoices(){

    var elements =
        content.getElementsByTagName("p");

    var i;
    var element;
    var text;


    /*
       We scan paragraph elements because
       marked turns our temporary markers
       into paragraphs.
    */

    for(i=elements.length - 1; i>=0; i--){

        element =
            elements[i];

        text =
            element.textContent.trim();


        /*
           CHOICE START
        */

        if(
            text.indexOf(
                "[[CHOICESTART:"
            ) === 0
        ){

            var choiceId =
                text
                    .replace(
                        "[[CHOICESTART:",
                        ""
                    )
                    .replace(
                        "]]",
                        ""
                    );

            createChoiceContainer(
                element,
                choiceId
            );

        }

    }


    /*
       Now process all remaining
       temporary markers.
    */

    processChoiceSections();

}


/* =========================================================
   CREATE CHOICE CONTAINER
   ========================================================= */

function createChoiceContainer(
    element,
    choiceId
){

    var wrapper =
        document.createElement(
            "div"
        );

    wrapper.className =
        "story-choice";

    wrapper.setAttribute(
        "data-choice-id",
        choiceId
    );


    var heading =
        document.createElement(
            "div"
        );

    heading.className =
        "story-choice-title";

    heading.innerHTML =
        "What does Lexis do?";


    wrapper.appendChild(
        heading
    );


    var parent =
        element.parentNode;


    parent.replaceChild(
        wrapper,
        element
    );


    /*
       Store the container so options
       can be inserted into it.
    */

    wrapper.setAttribute(
        "data-ready",
        "true"
    );

}


/* =========================================================
   PROCESS CHOICE OPTIONS + CONSEQUENCES
   ========================================================= */

function processChoiceSections(){

    var paragraphs =
        content.getElementsByTagName("p");

    var i;

    var p;
    var text;

    var activeChoice =
        null;

    var activeConsequence =
        null;


    for(i=0; i<paragraphs.length; i++){

        p =
            paragraphs[i];

        text =
            p.textContent.trim();


        /*
           OPTION
        */

        if(
            text.indexOf(
                "[[CHOICEOPTION:"
            ) === 0
        ){

            var optionData =
                text
                    .replace(
                        "[[CHOICEOPTION:",
                        ""
                    )
                    .replace(
                        "]]",
                        ""
                    );

            var optionParts =
                optionData.split(":");

            var choiceId =
                optionParts[0];

            var letter =
                optionParts[1];

            var encoded =
                optionParts.slice(2).join(":");

            var label =
                decodeURIComponent(
                    encoded
                );


            var container =
                findChoiceContainer(
                    choiceId
                );


            if(container){

                createChoiceButton(
                    container,
                    choiceId,
                    letter,
                    label
                );

            }


            p.parentNode.removeChild(p);

            i--;

            continue;

        }


        /*
           CONSEQUENCE START
        */

        if(
            text.indexOf(
                "[[CONSEQUENCESTART:"
            ) === 0
        ){

            var consequenceData =
                text
                    .replace(
                        "[[CONSEQUENCESTART:",
                        ""
                    )
                    .replace(
                        "]]",
                        ""
                    );

            var consequenceParts =
                consequenceData.split(":");

            activeChoice =
                consequenceParts[0];

            activeConsequence =
                consequenceParts[1];


            p.className =
                "story-consequence story-hidden";

            p.setAttribute(
                "data-choice",
                activeChoice
            );

            p.setAttribute(
                "data-consequence",
                activeConsequence
            );


            continue;

        }


        /*
           END CHOICE
        */

        if(
            text.indexOf(
                "[[CHOICEEND:"
            ) === 0
        ){

            activeChoice =
                null;

            activeConsequence =
                null;


            p.parentNode.removeChild(p);

            i--;

            continue;

        }


        /*
           Any normal paragraph inside
           a consequence belongs to
           that consequence.
        */

        if(
            activeChoice &&
            activeConsequence
        ){

            p.className =
                "story-consequence story-hidden";

            p.setAttribute(
                "data-choice",
                activeChoice
            );

            p.setAttribute(
                "data-consequence",
                activeConsequence
            );

        }

    }

}


/* =========================================================
   FIND CHOICE CONTAINER
   ========================================================= */

function findChoiceContainer(
    choiceId
){

    var containers =
        content.getElementsByClassName(
            "story-choice"
        );

    var i;

    for(i=0; i<containers.length; i++){

        if(
            containers[i].getAttribute(
                "data-choice-id"
            ) === choiceId
        ){

            return containers[i];

        }

    }

    return null;

}


/* =========================================================
   CREATE CHOICE BUTTON
   ========================================================= */

function createChoiceButton(
    wrapper,
    choiceId,
    letter,
    label
){

    var button =
        document.createElement(
            "button"
        );

    button.type =
        "button";

    button.className =
        "story-choice-button";


    button.innerHTML =
        escapeHtml(
            letter +
            " — " +
            label
        );


    button.onclick =
        function(){

            selectStoryChoice(
                choiceId,
                letter,
                wrapper
            );

        };


    wrapper.appendChild(
        button
    );

}


/* =========================================================
   SELECT CHOICE
   ========================================================= */

function selectStoryChoice(
    choiceId,
    letter,
    wrapper
){

    /*
       Prevent double tapping.
    */

    var buttons =
        wrapper.getElementsByTagName(
            "button"
        );

    var i;


    for(i=0; i<buttons.length; i++){

        buttons[i].disabled =
            true;

    }


    /*
       Remember the choice.
    */

    try{

        localStorage.setItem(
            "ceeqwinn_" +
            choiceId,
            letter
        );

    }catch(e){}


    /*
       Hide the choice buttons.
    */

    wrapper.style.display =
        "none";


    /*
       Show only the selected
       consequence.
    */

    var consequences =
        content.getElementsByTagName(
            "p"
        );


    for(i=0; i<consequences.length; i++){

        var p =
            consequences[i];


        if(
            p.getAttribute(
                "data-choice"
            ) === choiceId
        ){

            if(
                p.getAttribute(
                    "data-consequence"
                ) === letter
            ){

                p.className =
                    "story-consequence";

            }

        }

    }

}


/* =========================================================
   ARTICLE PATH CLEANING
   ========================================================= */

function cleanArticlePath(path){

    path =
        path.replace(
            /\\/g,
            "/"
        );

    path =
        path.replace(
            /^\/+/,
            ""
        );


    var parts =
        path.split("/");

    var clean = [];

    var i;
    var part;


    for(i=0; i<parts.length; i++){

        part =
            parts[i].trim();


        if(!part){
            continue;
        }


        if(
            part === "." ||
            part === ".."
        ){

            return "";

        }


        clean.push(part);

    }


    if(!clean.length){

        return "";

    }


    return clean.join("/");

}


/* =========================================================
   ARTICLE URL
   ========================================================= */

function articlePath(path){

    var parts =
        path.split("/");

    var encoded = [];

    var i;


    for(i=0; i<parts.length; i++){

        encoded.push(
            encodeURIComponent(
                parts[i]
            )
        );

    }


    return (
        "../content/articles/" +
        encoded.join("/") +
        ".md"
    );

}


/* =========================================================
   FRONTMATTER
   ========================================================= */

function parseFrontmatter(text){

    var result = {

        title:"",
        cover:"",
        credits:"",
        video:"",
        audio:"",
        downloads:[],
        body:text

    };


    var match =
        text.match(
            /^---\s*([\s\S]*?)\s*---\s*/
        );


    if(!match){

        return result;

    }


    var front =
        match[1];


    result.body =
        text.replace(
            /^---\s*[\s\S]*?\s*---\s*/,
            ""
        );


    var titleMatch =
        front.match(
            /^title:\s*["']?(.*?)["']?\s*$/m
        );


    if(titleMatch){

        result.title =
            cleanValue(
                titleMatch[1]
            );

    }


    var coverMatch =
        front.match(
            /^cover:\s*["']?(.*?)["']?\s*$/m
        );


    if(coverMatch){

        result.cover =
            cleanValue(
                coverMatch[1]
            );

    }


    var creditsMatch =
        front.match(
            /^credits:\s*["']?(.*?)["']?\s*$/m
        );


    if(creditsMatch){

        result.credits =
            cleanValue(
                creditsMatch[1]
            );

    }


    var videoMatch =
        front.match(
            /^video:\s*["']?(.*?)["']?\s*$/m
        );


    if(videoMatch){

        result.video =
            cleanValue(
                videoMatch[1]
            );

    }


    var audioMatch =
        front.match(
            /^audio:\s*["']?(.*?)["']?\s*$/m
        );


    if(audioMatch){

        result.audio =
            cleanValue(
                audioMatch[1]
            );

    }


    var downloadsMatch =
        front.match(
            /^downloads:\s*([\s\S]*?)(?=^[a-zA-Z0-9_-]+\s*:|$)/m
        );


    if(downloadsMatch){

        var lines =
            downloadsMatch[1].split("\n");

        var i;
        var line;
        var value;


        for(i=0; i<lines.length; i++){

            line =
                lines[i]
                    .replace(
                        /^\s*-\s*/,
                        ""
                    )
                    .trim();


            if(line){

                value =
                    cleanValue(line);


                if(value){

                    result.downloads.push(
                        value
                    );

                }

            }

        }

    }


    return result;

}


/* =========================================================
   CLEAN VALUE
   ========================================================= */

function cleanValue(value){

    value =
        value.replace(
            /^\s+/,
            ""
        );

    value =
        value.replace(
            /\s+$/,
            ""
        );


    if(
        value.length >= 2 &&
        (
            (
                value.charAt(0) === '"' &&
                value.charAt(
                    value.length - 1
                ) === '"'
            )
            ||
            (
                value.charAt(0) === "'" &&
                value.charAt(
                    value.length - 1
                ) === "'"
            )
        )
    ){

        value =
            value.substring(
                1,
                value.length - 1
            );

    }


    return value;

}


/* =========================================================
   INLINE IMAGES
   ========================================================= */

function fixInlineImages(){

    var images =
        content.getElementsByTagName(
            "img"
        );

    var i;
    var src;


    for(i=0; i<images.length; i++){

        src =
            images[i].getAttribute(
                "src"
            );


        if(src){

            images[i].src =
                mediaPath(src);

            prepareImage(
                images[i]
            );


            images[i].onerror =
                function(){

                    this.alt =
                        "Image could not be loaded.";

                    this.style.opacity =
                        "0.6";

                };

        }

    }

}


/* =========================================================
   INLINE VIDEOS
   ========================================================= */

function fixInlineVideos(){

    var videos =
        content.getElementsByTagName(
            "video"
        );

    var i;
    var src;


    for(i=0; i<videos.length; i++){

        src =
            videos[i].getAttribute(
                "src"
            );


        if(src){

            videos[i].src =
                mediaPath(src);

        }


        videos[i].controls =
            true;

    }

}


/* =========================================================
   INLINE AUDIO
   ========================================================= */

function fixInlineAudios(){

    var audios =
        content.getElementsByTagName(
            "audio"
        );

    var i;
    var src;


    for(i=0; i<audios.length; i++){

        src =
            audios[i].getAttribute(
                "src"
            );


        if(src){

            audios[i].src =
                mediaPath(src);

        }


        audios[i].controls =
            true;

    }

}


/* =========================================================
   EXTRA MEDIA
   ========================================================= */

function renderExtraMedia(data){

    var html = "";


    if(data.video){

        html +=
            '<div class="media-box">' +
            '<h2 class="media-title">Video</h2>' +
            '<video controls preload="metadata" width="100%">' +
            '<source src="' +
            escapeAttribute(
                mediaPath(
                    data.video
                )
            ) +
            '">' +
            'Your browser cannot play this video.' +
            '</video>' +
            '</div>';

    }


    if(data.audio){

        html +=
            '<div class="media-box">' +
            '<h2 class="media-title">Audio</h2>' +
            '<audio controls preload="metadata">' +
            '<source src="' +
            escapeAttribute(
                mediaPath(
                    data.audio
                )
            ) +
            '">' +
            'Your browser cannot play this audio.' +
            '</audio>' +
            '</div>';

    }


    if(data.downloads.length){

        html +=
            '<div class="media-box">' +
            '<h2 class="media-title">Downloads</h2>';


        var i;


        for(i=0; i<data.downloads.length; i++){

            html +=
                '<p>' +
                '<a href="' +
                escapeAttribute(
                    mediaPath(
                        data.downloads[i]
                    )
                ) +
                '" download>' +
                'Download file ' +
                (i + 1) +
                '</a>' +
                '</p>';

        }


        html +=
            '</div>';

    }


    media.innerHTML =
        html;

}


/* =========================================================
   LOW-SPEC IMAGE HANDLING
   ========================================================= */

function prepareImage(image){

    try{

        image.setAttribute(
            "loading",
            "lazy"
        );

    }catch(e){}


    try{

        image.setAttribute(
            "decoding",
            "async"
        );

    }catch(e){}

}


/* =========================================================
   MEDIA PATH
   ========================================================= */

function mediaPath(src){

    if(!src){

        return "";

    }


    src =
        src.replace(
            /^<|>$/g,
            ""
        );


    if(
        src.indexOf("http://") === 0 ||
        src.indexOf("https://") === 0 ||
        src.indexOf("data:") === 0 ||
        src.charAt(0) === "/"
    ){

        return src;

    }


    while(
        src.indexOf("../") === 0
    ){

        src =
            src.substring(3);

    }


    while(
        src.indexOf("./") === 0
    ){

        src =
            src.substring(2);

    }


    if(
        src.indexOf("content/") === 0
    ){

        return "/" + src;

    }


    return "/content/images/" + src;

}


/* =========================================================
   FILE NAME
   ========================================================= */

function getFileName(path){

    var parts =
        path.split("/");


    return parts[
        parts.length - 1
    ];

}


/* =========================================================
   HTML ESCAPING
   ========================================================= */

function escapeHtml(value){

    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#39;"
        );

}


/* =========================================================
   ATTRIBUTE ESCAPING
   ========================================================= */

function escapeAttribute(value){

    return escapeHtml(value);

}
