<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CEEQWINN Reader</title>

<style>

body{
    max-width:800px;
    margin:auto;
    padding:40px 20px;
    font-family:Arial,sans-serif;
    line-height:1.8;
    background:#fafafa;
    color:#222;
}

h1{
    font-size:2.2rem;
    margin-bottom:20px;
}

#cover{
    display:none;
    max-width:100%;
    height:auto;
    margin:0 auto 30px auto;
    border-radius:12px;
}

#credits{
    color:#666;
    margin:0 0 25px 0;
}

#content{
    word-wrap:break-word;
    overflow-wrap:break-word;
}

#content img{
    display:block;
    max-width:100%;
    height:auto;
    margin:24px auto;
    border-radius:12px;
}

#content video{
    display:block;
    width:100%;
    max-width:100%;
    margin:24px auto;
}

#content audio{
    display:block;
    width:100%;
    max-width:100%;
    margin:24px 0;
}

#content h2,
#content h3{
    margin-top:30px;
}

#content blockquote{
    margin:24px 0;
    padding:10px 20px;
    border-left:4px solid #999;
    background:#f0f0f0;
}

#content table{
    width:100%;
    border-collapse:collapse;
    margin:24px 0;
}

#content th,
#content td{
    padding:10px;
    border:1px solid #ccc;
}

#status{
    color:#666;
}

#media{
    margin-top:40px;
}

.media-title{
    margin-top:35px;
    margin-bottom:12px;
}

.media-box{
    margin:20px 0;
}

.media-box a{
    word-break:break-word;
}

.image-error{
    color:#777;
    font-size:0.9rem;
    text-align:center;
    margin:20px 0;
}

</style>

</head>

<body>

<img id="cover" alt="">

<h1 id="title">Loading...</h1>

<div id="credits"></div>

<div id="status">Loading article...</div>

<div id="content"></div>

<div id="media"></div>


<script src="https://cdn.jsdelivr.net/npm/marked@0.3.19/marked.min.js"></script>

<script>

var search = window.location.search;
var file = "";

if(search){

    file = search
        .replace(/^\?/, "")
        .split("&")[0]
        .replace(/^file=/, "");

    try{
        file = decodeURIComponent(file);
    }catch(e){}

}

var title = document.getElementById("title");
var status = document.getElementById("status");
var content = document.getElementById("content");
var cover = document.getElementById("cover");
var credits = document.getElementById("credits");
var media = document.getElementById("media");


if(!file){

    title.innerHTML = "Article not found";
    status.innerHTML = "No article was selected.";

}else{

    file = file.replace(/[^a-zA-Z0-9_-]/g,"");

    var xhr = new XMLHttpRequest();

    xhr.open(
        "GET",
        "../content/articles/" + file + ".md",
        true
    );

    xhr.onreadystatechange = function(){

        if(xhr.readyState !== 4){
            return;
        }

        if(xhr.status !== 200 && xhr.status !== 0){

            title.innerHTML = "Unable to load article";
            status.innerHTML = "The article could not be loaded.";
            return;

        }

        var text = xhr.responseText;

        var frontData = parseFrontmatter(text);

        var articleTitle = frontData.title || file;


        /*
        TITLE
        */

        title.innerHTML = escapeHtml(articleTitle);


        /*
        COVER
        */

        if(frontData.cover){

            cover.src = mediaPath(frontData.cover);
            cover.alt = articleTitle;
            cover.style.display = "block";

            prepareImage(cover);

            cover.onerror = function(){

                cover.style.display = "none";

            };

        }


        /*
        CREDITS
        */

        if(frontData.credits){

            credits.innerHTML =
                "<strong>Credits:</strong> " +
                escapeHtml(frontData.credits);

        }


        /*
        IMPORTANT:

        Normalize inline image URLs BEFORE
        sending Markdown to Marked.
        */

        var markdown = normalizeInlineImages(
            frontData.body
        );


        /*
        Render article text immediately.
        */

        content.innerHTML = marked(markdown);


        /*
        Process every resulting image.
        */

        fixInlineImages();

        fixInlineVideos();

        fixInlineAudios();


        /*
        Separate uploaded media.
        */

        renderExtraMedia(frontData);


        /*
        Markdown has loaded.
        Do not wait for images.
        */

        status.innerHTML = "";

    };


    xhr.onerror = function(){

        title.innerHTML = "Unable to load article";
        status.innerHTML = "The article could not be loaded.";

    };


    xhr.send(null);

}


/*
==================================================
FRONTMATTER
==================================================
*/

function parseFrontmatter(text){

    var result = {
        title:"",
        cover:"",
        credits:"",
        video:"",
        audio:"",
        downloads:[],
        body:text
    };

    var match = text.match(
        /^---\s*([\s\S]*?)\s*---\s*/
    );

    if(!match){
        return result;
    }

    var front = match[1];

    result.body = text.replace(
        /^---\s*[\s\S]*?\s*---\s*/,
        ""
    );


    var titleMatch = front.match(
        /^title:\s*["']?(.*?)["']?\s*$/m
    );

    if(titleMatch){
        result.title = cleanValue(titleMatch[1]);
    }


    var coverMatch = front.match(
        /^cover:\s*["']?(.*?)["']?\s*$/m
    );

    if(coverMatch){
        result.cover = cleanValue(coverMatch[1]);
    }


    var creditsMatch = front.match(
        /^credits:\s*["']?(.*?)["']?\s*$/m
    );

    if(creditsMatch){
        result.credits = cleanValue(creditsMatch[1]);
    }


    var videoMatch = front.match(
        /^video:\s*["']?(.*?)["']?\s*$/m
    );

    if(videoMatch){
        result.video = cleanValue(videoMatch[1]);
    }


    var audioMatch = front.match(
        /^audio:\s*["']?(.*?)["']?\s*$/m
    );

    if(audioMatch){
        result.audio = cleanValue(audioMatch[1]);
    }


    /*
    DOWNLOADS
    */

    var downloadsMatch = front.match(
        /^downloads:\s*([\s\S]*?)(?=^[a-zA-Z0-9_-]+\s*:|$)/m
    );

    if(downloadsMatch){

        var lines = downloadsMatch[1].split("\n");

        var i;
        var line;
        var value;

        for(i=0; i<lines.length; i++){

            line = lines[i]
                .replace(/^\s*-\s*/,"")
                .trim();

            if(line){

                value = cleanValue(line);

                if(value){
                    result.downloads.push(value);
                }

            }

        }

    }

    return result;

}


/*
==================================================
CLEAN FRONTMATTER VALUES
==================================================
*/

function cleanValue(value){

    value = value.replace(/^\s+/,"");
    value = value.replace(/\s+$/,"");

    if(
        value.length >= 2 &&
        (
            (
                value.charAt(0) === '"' &&
                value.charAt(value.length - 1) === '"'
            )
            ||
            (
                value.charAt(0) === "'" &&
                value.charAt(value.length - 1) === "'"
            )
        )
    ){

        value = value.substring(
            1,
            value.length - 1
        );

    }

    return value;

}


/*
==================================================
INLINE IMAGE NORMALIZATION
==================================================

This runs BEFORE Marked.

It handles Pages CMS forms such as:

![image](/content/images/photo.jpg)

and:

![image](</content/images/photo (1).jpeg>)

The second form is converted into a normal
Markdown image URL before Marked sees it.
*/

function normalizeInlineImages(markdown){

    var lines = markdown.split("\n");

    var i;
    var line;

    for(i=0; i<lines.length; i++){

        line = lines[i];

        /*
        Match Markdown image syntax where the
        destination is wrapped in < >.
        */

        line = line.replace(
            /(!\[[^\]]*\])\(\s*<([^>]*)>\s*\)/g,
            function(match, label, src){

                return label +
                    "(" +
                    cleanInlineImageURL(src) +
                    ")";

            }
        );


        lines[i] = line;

    }

    return lines.join("\n");

}


/*
==================================================
CLEAN INLINE IMAGE URL
==================================================
*/

function cleanInlineImageURL(src){

    src = String(src);

    src = src.replace(
        /^\s+|\s+$/g,
        ""
    );

    /*
    Remove accidental surrounding angle brackets.
    */

    src = src.replace(
        /^<|>$/g,
        ""
    );

    /*
    Remove accidental quotes.
    */

    if(
        src.length >= 2 &&
        (
            (
                src.charAt(0) === '"' &&
                src.charAt(src.length - 1) === '"'
            )
            ||
            (
                src.charAt(0) === "'" &&
                src.charAt(src.length - 1) === "'"
            )
        )
    ){

        src = src.substring(
            1,
            src.length - 1
        );

    }

    return mediaPath(src);

}


/*
==================================================
INLINE IMAGES
==================================================
*/

function fixInlineImages(){

    var images = content.getElementsByTagName("img");

    var i;
    var src;

    for(i=0; i<images.length; i++){

        src = images[i].getAttribute("src");

        if(!src){
            continue;
        }

        /*
        Normalize again as a safety net.
        */

        src = mediaPath(src);

        images[i].setAttribute(
            "src",
            src
        );

        prepareImage(images[i]);

        /*
        Every image gets its own handler.
        */

        images[i].onerror =
            createImageErrorHandler(
                images[i]
            );

    }

}


/*
==================================================
IMAGE ERROR
==================================================
*/

function createImageErrorHandler(image){

    return function(){

        var parent = image.parentNode;

        if(!parent){
            return;
        }

        var message =
            document.createElement("div");

        message.className =
            "image-error";

        message.innerHTML =
            "Image could not be loaded.";

        parent.insertBefore(
            message,
            image
        );

        image.style.display = "none";

    };

}


/*
==================================================
INLINE VIDEO
==================================================
*/

function fixInlineVideos(){

    var videos =
        content.getElementsByTagName("video");

    var i;
    var src;

    for(i=0; i<videos.length; i++){

        src =
            videos[i].getAttribute("src");

        if(src){

            videos[i].src =
                mediaPath(src);

        }

        videos[i].controls = true;

    }

}


/*
==================================================
INLINE AUDIO
==================================================
*/

function fixInlineAudios(){

    var audios =
        content.getElementsByTagName("audio");

    var i;
    var src;

    for(i=0; i<audios.length; i++){

        src =
            audios[i].getAttribute("src");

        if(src){

            audios[i].src =
                mediaPath(src);

        }

        audios[i].controls = true;

    }

}


/*
==================================================
EXTRA MEDIA
==================================================
*/

function renderExtraMedia(data){

    var html = "";

    if(data.video){

        html +=
            '<div class="media-box">' +
            '<h2 class="media-title">Video</h2>' +
            '<video controls preload="metadata" width="100%">' +
            '<source src="' +
            escapeAttribute(
                mediaPath(data.video)
            ) +
            '">' +
            'Your browser cannot play this video.' +
            '</video>' +
            '</div>';

    }


    if(data.audio){

        html +=
            '<div class="media-box">' +
            '<h2 class="media-title">Audio</h2>' +
            '<audio controls preload="metadata">' +
            '<source src="' +
            escapeAttribute(
                mediaPath(data.audio)
            ) +
            '">' +
            'Your browser cannot play this audio.' +
            '</audio>' +
            '</div>';

    }


    if(data.downloads.length){

        html +=
            '<div class="media-box">' +
            '<h2 class="media-title">Downloads</h2>';

        var i;

        for(i=0; i<data.downloads.length; i++){

            html +=
                '<p>' +
                '<a href="' +
                escapeAttribute(
                    mediaPath(data.downloads[i])
                ) +
                '" download>' +
                'Download file ' +
                (i + 1) +
                '</a>' +
                '</p>';

        }

        html += '</div>';

    }


    media.innerHTML = html;

}


/*
==================================================
IMAGE PERFORMANCE
==================================================
*/

function prepareImage(image){

    try{

        image.setAttribute(
            "loading",
            "lazy"
        );

    }catch(e){}


    try{

        image.setAttribute(
            "decoding",
            "async"
        );

    }catch(e){}

}


/*
==================================================
MEDIA PATH
==================================================
*/

function mediaPath(src){

    if(!src){
        return "";
    }

    src = String(src);

    src = src.replace(
        /^\s+|\s+$/g,
        ""
    );


    /*
    Remove surrounding < >.
    */

    while(
        src.length > 1 &&
        src.charAt(0) === "<" &&
        src.charAt(src.length - 1) === ">"
    ){

        src = src.substring(
            1,
            src.length - 1
        );

        src = src.replace(
            /^\s+|\s+$/g,
            ""
        );

    }


    /*
    Remove quotes.
    */

    if(
        src.length >= 2 &&
        (
            (
                src.charAt(0) === '"' &&
                src.charAt(src.length - 1) === '"'
            )
            ||
            (
                src.charAt(0) === "'" &&
                src.charAt(src.length - 1) === "'"
            )
        )
    ){

        src = src.substring(
            1,
            src.length - 1
        );

    }


    /*
    Absolute web URL.
    */

    if(
        src.indexOf("http://") === 0 ||
        src.indexOf("https://") === 0 ||
        src.indexOf("data:") === 0
    ){

        return encodeURL(src);

    }


    /*
    Remove relative prefixes.
    */

    while(src.indexOf("../") === 0){

        src = src.substring(3);

    }

    while(src.indexOf("./") === 0){

        src = src.substring(2);

    }


    /*
    Already contains content/.
    */

    if(src.indexOf("/content/") === 0){

        return encodeURL(src);

    }


    if(src.indexOf("content/") === 0){

        return encodeURL(
            "/" + src
        );

    }


    /*
    Plain filename.
    */

    return encodeURL(
        "/content/images/" + src
    );

}


/*
==================================================
SAFE URL ENCODING
==================================================
*/

function encodeURL(src){

    try{

        return encodeURI(src);

    }catch(e){

        return src;

    }

}


/*
==================================================
HTML ESCAPING
==================================================
*/

function escapeHtml(value){

    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#39;");

}


/*
==================================================
ATTRIBUTE ESCAPING
==================================================
*/

function escapeAttribute(value){

    return escapeHtml(value);

}

</script>

</body>

</html>
