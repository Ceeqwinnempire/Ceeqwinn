<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CEEQWINN Reader</title>

<style>

body{
    max-width:800px;
    margin:auto;
    padding:35px 18px;
    font-family:Arial,sans-serif;
    line-height:1.8;
    background:#fafafa;
    color:#222;
}

h1{
    font-size:2.2rem;
    margin-bottom:20px;
}

h2{
    margin-top:35px;
}

#cover{
    display:none;
    max-width:100%;
    height:auto;
    margin:0 auto 30px;
    border-radius:12px;
}

#credits{
    color:#666;
    margin-bottom:25px;
}

#status{
    color:#777;
}

#content{
    overflow-wrap:break-word;
}

#content img{
    display:block;
    max-width:100%;
    height:auto;
    margin:25px auto;
    border-radius:12px;
}

#content video,
#content audio{
    display:block;
    width:100%;
    max-width:100%;
    margin:25px auto;
}

#content blockquote{
    margin:25px 0;
    padding:10px 18px;
    border-left:4px solid #999;
    background:#f0f0f0;
}

#content table{
    width:100%;
    border-collapse:collapse;
    margin:25px 0;
}

#content th,
#content td{
    padding:8px;
    border:1px solid #ccc;
}


/* =========================================================
   STORY ENGINE
   ========================================================= */

.story-choice{
    margin:45px 0;
    padding:10px 0;
}

.story-choice-button{
    display:block;
    width:100%;
    box-sizing:border-box;
    margin:12px 0;
    padding:15px 18px;
    font:16px Arial,sans-serif;
    text-align:left;
    background:#fff;
    color:#222;
    border:1px solid #ccc;
    border-radius:8px;
    cursor:pointer;
    transition:background .15s ease,
                border-color .15s ease,
                transform .15s ease;
}

.story-choice-button:hover{
    background:#f5f5f5;
    border-color:#999;
}

.story-choice-button:active{
    transform:translateY(1px);
}

.story-choice-button:disabled{
    cursor:default;
    opacity:.7;
}

.story-hidden{
    display:none !important;
}

.story-branch{
    margin-top:25px;
}

.story-continuation{
    margin-top:25px;
}

.story-next{
    margin:55px 0 25px;
    padding:25px 0;
    text-align:center;
}

.story-next-text{
    margin-bottom:18px;
    color:#555;
    font-size:1rem;
}

.story-next-button{
    display:inline-block;
    padding:14px 22px;
    font:16px Arial,sans-serif;
    background:#222;
    color:#fff;
    border:none;
    border-radius:8px;
    cursor:pointer;
}

.story-next-button:hover{
    opacity:.85;
}

#storyReset{
    display:none;
    width:100%;
    margin:35px 0;
    padding:12px;
    background:#f7f7f7;
    color:#555;
    border:1px dashed #aaa;
    border-radius:8px;
    cursor:pointer;
}

#storyReset:hover{
    background:#eeeeee;
}


/* =========================================================
   MOBILE
   ========================================================= */

@media(max-width:600px){

    body{
        padding:25px 15px;
    }

    h1{
        font-size:1.8rem;
    }

    .story-choice-button{
        font-size:16px;
        padding:15px;
    }

    .story-next-button{
        width:100%;
        box-sizing:border-box;
    }

}

</style>

</head>


<body>

<img id="cover" alt="">

<h1 id="title">Loading...</h1>

<div id="credits"></div>

<div id="status"></div>

<div id="content"></div>

<button id="storyReset" type="button">
    ↺ Reset Story
</button>

<div id="media"></div>


<script src="https://cdn.jsdelivr.net/npm/marked@0.3.19/marked.min.js"></script>


<script>

/* =========================================================
   BASIC ELEMENTS
   ========================================================= */

var title =
    document.getElementById("title");

var credits =
    document.getElementById("credits");

var status =
    document.getElementById("status");

var content =
    document.getElementById("content");

var cover =
    document.getElementById("cover");

var media =
    document.getElementById("media");

var reset =
    document.getElementById("storyReset");


/* =========================================================
   ARTICLE FILE
   ========================================================= */

var params =
    new URLSearchParams(
        window.location.search
    );

var file =
    params.get("file") || "";

file =
    cleanPath(file);


/* =========================================================
   STORY ID
   ========================================================= */

var storyId =
    getStoryId(file);


/* =========================================================
   STORY STORAGE
   ========================================================= */

var storageKey =
    "ceeqwinn_story_history_" +
    storyId;


/* =========================================================
   START
   ========================================================= */

if(!file){

    title.textContent =
        "Article not found";

    status.textContent =
        "No article was selected.";

}else{

    loadStory();

}


/* =========================================================
   LOAD MARKDOWN
   ========================================================= */

function loadStory(){

    status.textContent =
        "Loading...";

    content.innerHTML = "";

    media.innerHTML = "";

    cover.style.display =
        "none";

    var xhr =
        new XMLHttpRequest();

    xhr.open(
        "GET",
        "../content/articles/" +
        encodeURIComponent(file) +
        ".md",
        true
    );

    xhr.onload =
        function(){

            if(
                xhr.status !== 200 &&
                xhr.status !== 0
            ){

                title.textContent =
                    "Unable to load article";

                status.textContent =
                    "The article could not be loaded.";

                return;

            }

            buildStory(
                xhr.responseText
            );

        };

    xhr.onerror =
        function(){

            title.textContent =
                "Unable to load article";

            status.textContent =
                "The article could not be loaded.";

        };

    xhr.send();

}


/* =========================================================
   BUILD STORY
   ========================================================= */

function buildStory(text){

    var data =
        parseFrontmatter(text);


    title.textContent =
        data.title || file;


    credits.innerHTML =
        data.credits
        ? "<strong>Credits:</strong> " +
          escapeHtml(data.credits)
        : "";


    if(data.cover){

        cover.src =
            mediaPath(data.cover);

        cover.alt =
            data.title || file;

        cover.style.display =
            "block";

        cover.onerror =
            function(){

                cover.style.display =
                    "none";

            };

    }


    content.innerHTML =
        renderStory(data.body);


    fixMedia();

    setupStory();


    renderExtraMedia(data);


    status.textContent = "";

}


/* =========================================================
   FRONTMATTER
   ========================================================= */

function parseFrontmatter(text){

    var data = {

        title:"",
        cover:"",
        credits:"",
        video:"",
        audio:"",
        body:text

    };


    var match =
        text.match(
            /^---\s*\n([\s\S]*?)\n---\s*\n?/
        );


    if(!match){

        return data;

    }


    var front =
        match[1];


    data.body =
        text.substring(
            match[0].length
        );


    data.title =
        frontValue(
            front,
            "title"
        );

    data.cover =
        frontValue(
            front,
            "cover"
        );

    data.credits =
        frontValue(
            front,
            "credits"
        );

    data.video =
        frontValue(
            front,
            "video"
        );

    data.audio =
        frontValue(
            front,
            "audio"
        );


    return data;

}


/* =========================================================
   FRONTMATTER VALUE
   ========================================================= */

function frontValue(
    text,
    key
){

    var re =
        new RegExp(
            "^" +
            key +
            "\\s*:\\s*[\"']?(.*?)[\"']?$",
            "m"
        );

    var match =
        text.match(re);


    return match
        ? match[1].trim()
        : "";

}


/* =========================================================
   STORY RENDERER
   ========================================================= */

function renderStory(text){

    var lines =
        text.split(/\r?\n/);

    return renderFlow(
        lines
    );

}


/* =========================================================
   FLOW RENDERER
   ========================================================= */

function renderFlow(lines){

    var output = "";

    var normal = [];

    var i = 0;


    while(i < lines.length){

        /*
         * CONDITIONAL
         */

        if(isIfMarker(lines[i])){

            flushNormal();


            var conditional =
                parseConditional(
                    lines,
                    i
                );


            output +=
                conditional.html;


            i =
                conditional.next;


            continue;

        }


        /*
         * CHOICE
         */

        if(isChoiceStart(lines[i])){

            flushNormal();


            var choice =
                parseChoice(
                    lines,
                    i
                );


            output +=
                choice.html;


            i =
                choice.next;


            continue;

        }


        /*
         * NEXT CHAPTER
         */

        if(isNextMarker(lines[i])){

            flushNormal();


            output +=
                renderNext(
                    lines[i]
                );


            i++;

            continue;

        }


        /*
         * STRAY ENDIF
         */

        if(isEndIfMarker(lines[i])){

            i++;

            continue;

        }


        /*
         * ELSE IS HANDLED INSIDE CONDITIONALS.
         */

        if(
            /^\s*\*?\s*\[ELSE\]\s*$/.test(
                lines[i]
            )
        ){

            flushNormal();

            i++;

            continue;

        }


        normal.push(
            lines[i]
        );

        i++;


        function flushNormal(){

            if(normal.length){

                output +=
                    marked(
                        normal.join("\n")
                    );

                normal = [];

            }

        }

    }


    if(normal.length){

        output +=
            marked(
                normal.join("\n")
            );

    }


    return output;

}


/* =========================================================
   MARKER TESTS
   ========================================================= */

function isChoiceStart(line){

    return /^\s*\*?\s*\[CHOICE:[\w-]+\]\s*$/.test(
        line
    );

}


function isNextMarker(line){

    return /^\s*\*?\s*\[NEXT:[^\]]+\]\s*$/.test(
        line
    );

}


function isIfMarker(line){

    return /^\s*\*?\s*\[IF:[\w-]+=[A-Z]\]\s*$/.test(
        line
    );

}


function isEndIfMarker(line){

    return /^\s*\*?\s*\[ENDIF\]\s*$/.test(
        line
    );

}


/* =========================================================
   CONDITIONAL PARSER
   ========================================================= */

function parseConditional(
    lines,
    start
){

    var first =
        lines[start].match(
            /^\s*\*?\s*\[IF:([\w-]+)=([A-Z])\]\s*$/
        );


    if(!first){

        return {
            html:"",
            next:start + 1
        };

    }


    var blocks = [];

    var current = {

        id:first[1],

        letter:first[2],

        lines:[]

    };


    blocks.push(
        current
    );


    var depth = 1;

    var i =
        start + 1;


    while(i < lines.length){

        var line =
            lines[i];


        /*
         * Nested IF
         */

        if(isIfMarker(line)){

            depth++;

            current.lines.push(
                line
            );

            i++;

            continue;

        }


        /*
         * ENDIF
         */

        if(isEndIfMarker(line)){

            depth--;

            if(depth === 0){

                i++;

                break;

            }

            current.lines.push(
                line
            );

            i++;

            continue;

        }


        /*
         * ELSE belonging to this IF
         */

        if(
            depth === 1 &&
            /^\s*\*?\s*\[ELSE\]\s*$/.test(line)
        ){

            var nextLine =
                lines[i + 1] || "";


            var nextIf =
                nextLine.match(
                    /^\s*\*?\s*\[IF:([\w-]+)=([A-Z])\]\s*$/
                );


            if(nextIf){

                current = {

                    id:nextIf[1],

                    letter:nextIf[2],

                    lines:[]

                };


                blocks.push(
                    current
                );


                i += 2;

                depth++;

                continue;

            }


            current = {

                id:"__ELSE__",

                letter:"ELSE",

                lines:[]

            };


            blocks.push(
                current
            );


            i++;

            continue;

        }


        current.lines.push(
            line
        );

        i++;

    }


    var choices =
        getChoices();


    var selectedHTML = "";


    for(
        var b = 0;
        b < blocks.length;
        b++
    ){

        var block =
            blocks[b];


        if(
            block.id === "__ELSE__"
        ){

            var anyMatched =
                false;


            for(
                var x = 0;
                x < b;
                x++
            ){

                if(
                    choices[blocks[x].id] ===
                    blocks[x].letter
                ){

                    anyMatched =
                        true;

                    break;

                }

            }


            if(
                !anyMatched
            ){

                selectedHTML =
                    renderFlow(
                        block.lines
                    );

            }

            continue;

        }


        if(
            choices[block.id] ===
            block.letter
        ){

            selectedHTML =
                renderFlow(
                    block.lines
                );

            break;

        }

    }


    return {

        html:
            selectedHTML,

        next:i

    };

}


/* =========================================================
   CHOICE PARSER
   ========================================================= */

function parseChoice(
    lines,
    start
){

    var match =
        lines[start].match(
            /^\s*\*?\s*\[CHOICE:([\w-]+)\]\s*$/
        );


    if(!match){

        return {

            html:"",

            next:start + 1

        };

    }


    var id =
        match[1];


    var options = [];

    var branches = [];

    var current = null;

    var i =
        start + 1;


    while(i < lines.length){

        var line =
            lines[i];


        /*
         * END CHOICE
         */

        if(
            /^\s*\*?\s*\[ENDCHOICE\]\s*$/.test(
                line
            )
        ){

            i++;

            break;

        }


        /*
         * OPTION
         */

        var option =
            line.match(
                /^\s*\*?\s*\[([A-Z])\]\s*(.+?)\s*$/
            );


        if(
            option &&
            !current
        ){

            options.push({

                letter:
                    option[1],

                label:
                    option[2]

            });


            i++;

            continue;

        }


        /*
         * CONSEQUENCE
         */

        var consequence =
            line.match(
                /^\s*\*?\s*\[CONSEQUENCE:([A-Z])\]\s*$/
            );


        if(consequence){

            current = {

                letter:
                    consequence[1],

                lines:[]

            };


            branches.push(
                current
            );


            i++;

            continue;

        }


        /*
         * BRANCH CONTENT
         */

        if(current){

            current.lines.push(
                line
            );

        }


        i++;

    }


    /*
     * Everything after this choice becomes
     * the continuation of this choice.
     */

    var continuationLines =
        lines.slice(i);


    var continuationHTML =
        "";


    if(
        continuationLines.length
    ){

        continuationHTML =
            renderFlow(
                continuationLines
            );

    }


    /*
     * CHOICE
     *
     * The engine still stores A/B/C internally.
     * The reader does not display those internal
     * letters to the player.
     */

    var html =

        '<div class="story-choice" ' +
        'data-choice="' +
        escapeAttr(id) +
        '">';


    for(
        var j = 0;
        j < options.length;
        j++
    ){

        html +=

            '<button ' +
            'type="button" ' +
            'class="story-choice-button" ' +
            'data-choice="' +
            escapeAttr(id) +
            '" ' +
            'data-letter="' +
            escapeAttr(
                options[j].letter
            ) +
            '">' +

            escapeHtml(
                options[j].label
            ) +

            '</button>';

    }


    html +=
        '</div>';


    /*
     * CONSEQUENCES
     *
     * Consequence markers remain engine-only.
     * The player sees only the selected story.
     */

    for(
        var k = 0;
        k < branches.length;
        k++
    ){

        var branch =
            branches[k];


        html +=

            '<div ' +
            'class="story-branch story-hidden" ' +
            'data-choice="' +
            escapeAttr(id) +
            '" ' +
            'data-letter="' +
            escapeAttr(
                branch.letter
            ) +
            '">' +

            renderFlow(
                branch.lines
            ) +

            '</div>';

    }


    /*
     * CONTINUATION
     */

    if(continuationHTML){

        html +=

            '<div ' +
            'class="story-continuation story-hidden" ' +
            'data-after-choice="' +
            escapeAttr(id) +
            '">' +

            continuationHTML +

            '</div>';

    }


    return {

        html:html,

        next:lines.length

    };

}


/* =========================================================
   SETUP STORY
   ========================================================= */

function setupStory(){

    var choices =
        content.getElementsByClassName(
            "story-choice"
        );


    if(
        choices.length
    ){

        reset.style.display =
            "block";

    }else{

        reset.style.display =
            "none";

    }


    activateChoices();

    restoreChoices();

    updateNextButtons();

}


/* =========================================================
   ACTIVATE CHOICES
   ========================================================= */

function activateChoices(){

    var buttons =
        content.getElementsByClassName(
            "story-choice-button"
        );


    for(
        var i = 0;
        i < buttons.length;
        i++
    ){

        buttons[i].onclick =
            function(){

                var id =
                    this.getAttribute(
                        "data-choice"
                    );


                var letter =
                    this.getAttribute(
                        "data-letter"
                    );


                choose(
                    id,
                    letter
                );

            };

    }

}


/* =========================================================
   MAKE CHOICE
   ========================================================= */

function choose(
    id,
    letter
){

    saveChoice(
        id,
        letter
    );


    showBranch(
        id,
        letter
    );


    revealContinuation(
        id
    );


    updateNextButtons();


    /*
     * Put the selected story branch into view.
     */

    var selected =
        content.querySelector(
            '.story-branch[data-choice="' +
            cssEscape(id) +
            '"][data-letter="' +
            cssEscape(letter) +
            '"]'
        );


    if(selected){

        setTimeout(
            function(){

                if(
                    selected.scrollIntoView
                ){

                    selected.scrollIntoView({
                        behavior:"smooth",
                        block:"start"
                    });

                }

            },
            50
        );

    }

}


/* =========================================================
   SAVE CHOICE
   ========================================================= */

function saveChoice(
    id,
    letter
){

    var choices =
        getChoices();


    choices[id] =
        letter;


    try{

        localStorage.setItem(
            storageKey,
            JSON.stringify(
                choices
            )
        );

    }catch(e){}

}


/* =========================================================
   GET CHOICES
   ========================================================= */

function getChoices(){

    try{

        var saved =
            localStorage.getItem(
                storageKey
            );


        if(!saved){

            return {};

        }


        var parsed =
            JSON.parse(saved);


        return parsed &&
               typeof parsed === "object"
            ? parsed
            : {};

    }catch(e){

        return {};

    }

}


/* =========================================================
   SHOW BRANCH
   ========================================================= */

function showBranch(
    id,
    letter
){

    var choices =
        content.getElementsByClassName(
            "story-choice"
        );


    var branches =
        content.getElementsByClassName(
            "story-branch"
        );


    var i;


    /*
     * Hide the entire choice interface.
     */

    for(
        i = 0;
        i < choices.length;
        i++
    ){

        if(
            choices[i].getAttribute(
                "data-choice"
            ) === id
        ){

            choices[i].style.display =
                "none";

        }

    }


    /*
     * Hide all branches belonging
     * to this choice.
     */

    for(
        i = 0;
        i < branches.length;
        i++
    ){

        if(
            branches[i].getAttribute(
                "data-choice"
            ) === id
        ){

            branches[i].className =
                "story-branch story-hidden";

        }

    }


    /*
     * Show only the selected branch.
     */

    for(
        i = 0;
        i < branches.length;
        i++
    ){

        if(

            branches[i].getAttribute(
                "data-choice"
            ) === id

            &&

            branches[i].getAttribute(
                "data-letter"
            ) === letter

        ){

            branches[i].className =
                "story-branch";

        }

    }

}


/* =========================================================
   REVEAL CONTINUATION
   ========================================================= */

function revealContinuation(id){

    var continuations =
        content.getElementsByClassName(
            "story-continuation"
        );


    for(
        var i = 0;
        i < continuations.length;
        i++
    ){

        if(
            continuations[i].getAttribute(
                "data-after-choice"
            ) === id
        ){

            continuations[i].className =
                "story-continuation";

        }

    }

}


/* =========================================================
   RESTORE SAVED CHOICES
   ========================================================= */

function restoreChoices(){

    var choices =
        getChoices();


    var ids =
        getChoiceIds();


    /*
     * Restore in the order the choices
     * appear in the current chapter.
     */

    for(
        var i = 0;
        i < ids.length;
        i++
    ){

        var id =
            ids[i];


        if(
            choices[id]
        ){

            showBranch(
                id,
                choices[id]
            );


            revealContinuation(
                id
            );

        }

    }

}


/* =========================================================
   FIND CHOICE IDS
   ========================================================= */

function getChoiceIds(){

    var elements =
        content.getElementsByClassName(
            "story-choice"
        );


    var ids = [];


    for(
        var i = 0;
        i < elements.length;
        i++
    ){

        var id =
            elements[i].getAttribute(
                "data-choice"
            );


        if(
            id &&
            ids.indexOf(id) === -1
        ){

            ids.push(id);

        }

    }


    return ids;

}


/* =========================================================
   NEXT BUTTON CONTROL
   ========================================================= */

function updateNextButtons(){

    var nextButtons =
        content.getElementsByClassName(
            "story-next-button"
        );


    var ids =
        getChoiceIds();


    var choices =
        getChoices();


    var complete =
        true;


    for(
        var i = 0;
        i < ids.length;
        i++
    ){

        if(
            !choices[ids[i]]
        ){

            complete =
                false;

            break;

        }

    }


    for(
        var j = 0;
        j < nextButtons.length;
        j++
    ){

        if(complete){

            nextButtons[j].disabled =
                false;

            nextButtons[j].style.display =
                "";

        }else{

            nextButtons[j].disabled =
                true;

            nextButtons[j].style.display =
                "none";

        }

    }

}


/* =========================================================
   NEXT CHAPTER
   ========================================================= */

function renderNext(line){

    var match =
        line.match(
            /^\s*\*?\s*\[NEXT:([^\]|]+)(?:\|([^\]]+))?\]\s*$/
        );


    if(!match){

        return "";

    }


    var nextFile =
        cleanPath(
            match[1]
        );


    nextFile =
        nextFile.replace(
            /\.md$/i,
            ""
        );


    var label =
        match[2]
        ? match[2].trim()
        : "Enter the next chapter";


    return '<div class="story-next">' +

        '<div class="story-next-text">' +
        'The story continues...' +
        '</div>' +

        '<button ' +
        'type="button" ' +
        'class="story-next-button" ' +
        'data-next="' +
        escapeAttr(nextFile) +
        '">' +

        escapeHtml(label) +

        '</button>' +

        '</div>';

}


/* =========================================================
   NEXT CHAPTER CLICK
   ========================================================= */

document.addEventListener(
    "click",
    function(event){

        var target =
            event.target;


        if(
            !target.classList.contains(
                "story-next-button"
            )
        ){

            return;

        }


        if(target.disabled){

            return;

        }


        var nextFile =
            target.getAttribute(
                "data-next"
            );


        if(!nextFile){

            return;

        }


        nextFile =
            cleanPath(
                nextFile
            );


        nextFile =
            nextFile.replace(
                /\.md$/i,
                ""
            );


        window.location.href =
            "article.html?file=" +
            encodeURIComponent(
                nextFile
            );

    }
);


/* =========================================================
   RESET STORY
   ========================================================= */

reset.onclick =
    function(){

        try{

            localStorage.removeItem(
                storageKey
            );

        }catch(e){}


        window.location.reload();

    };


/* =========================================================
   STORY ID
   ========================================================= */

function getStoryId(path){

    path =
        String(path);


    path =
        path.replace(
            /\.md$/i,
            ""
        );


    path =
        path.replace(
            /-chapter-\d+$/i,
            ""
        );


    return path;

}


/* =========================================================
   MEDIA PATH
   ========================================================= */

function mediaPath(src){

    if(!src){

        return "";

    }


    src =
        src.trim();


    if(

        /^https?:\/\//i.test(src)

        ||

        /^data:/i.test(src)

        ||

        src.charAt(0) === "/"

    ){

        return src;

    }


    while(
        src.indexOf("../") === 0
    ){

        src =
            src.substring(3);

    }


    while(
        src.indexOf("./") === 0
    ){

        src =
            src.substring(2);

    }


    if(
        src.indexOf("content/") === 0
    ){

        return "/" + src;

    }


    return "/content/images/" + src;

}


/* =========================================================
   FIX MEDIA
   ========================================================= */

function fixMedia(){

    var images =
        content.getElementsByTagName(
            "img"
        );


    var videos =
        content.getElementsByTagName(
            "video"
        );


    var audios =
        content.getElementsByTagName(
            "audio"
        );


    var i;


    for(
        i = 0;
        i < images.length;
        i++
    ){

        var imageSrc =
            images[i].getAttribute(
                "src"
            );


        if(imageSrc){

            images[i].src =
                mediaPath(
                    imageSrc
                );

        }


        images[i].setAttribute(
            "loading",
            "lazy"
        );

    }


    for(
        i = 0;
        i < videos.length;
        i++
    ){

        var videoSrc =
            videos[i].getAttribute(
                "src"
            );


        if(videoSrc){

            videos[i].src =
                mediaPath(
                    videoSrc
                );

        }


        videos[i].controls =
            true;

    }


    for(
        i = 0;
        i < audios.length;
        i++
    ){

        var audioSrc =
            audios[i].getAttribute(
                "src"
            );


        if(audioSrc){

            audios[i].src =
                mediaPath(
                    audioSrc
                );

        }


        audios[i].controls =
            true;

    }

}


/* =========================================================
   EXTRA MEDIA
   ========================================================= */

function renderExtraMedia(data){

    var html = "";


    if(data.video){

        html +=

            '<h2>Video</h2>' +

            '<video ' +
            'controls ' +
            'preload="metadata">' +

            '<source src="' +
            escapeAttr(
                mediaPath(
                    data.video
                )
            ) +
            '">' +

            '</video>';

    }


    if(data.audio){

        html +=

            '<h2>Audio</h2>' +

            '<audio ' +
            'controls ' +
            'preload="metadata">' +

            '<source src="' +
            escapeAttr(
                mediaPath(
                    data.audio
                )
            ) +
            '">' +

            '</audio>';

    }


    media.innerHTML =
        html;

}


/* =========================================================
   CLEAN PATH
   ========================================================= */

function cleanPath(path){

    path =
        String(path)
        .replace(
            /\\/g,
            "/"
        )
        .replace(
            /^\/+/,
            ""
        );


    var parts =
        path.split("/");


    var clean = [];


    for(
        var i = 0;
        i < parts.length;
        i++
    ){

        if(

            parts[i]

            &&

            parts[i] !== "."

            &&

            parts[i] !== ".."

        ){

            clean.push(
                parts[i]
            );

        }

    }


    return clean.join("/");

}


/* =========================================================
   HTML ESCAPING
   ========================================================= */

function escapeHtml(value){

    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#39;"
        );

}


function escapeAttr(value){

    return escapeHtml(
        value
    );

}


/* =========================================================
   SIMPLE CSS ESCAPE
   ========================================================= */

function cssEscape(value){

    return String(value)
        .replace(
            /\\/g,
            "\\\\"
        )
        .replace(
            /"/g,
            '\\"'
        );

}
