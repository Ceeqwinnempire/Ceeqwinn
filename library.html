<style>

body{
    font-family:Arial,sans-serif;
    max-width:800px;
    margin:40px auto;
    padding:20px;
}

h1{
    margin-bottom:30px;
}

#articles{
    display:flex;
    flex-direction:column;
    gap:10px;
}

.article-link{
    display:block;
    padding:12px;
    text-decoration:none;
    border:1px solid #ddd;
    border-radius:8px;
    color:#111;
    background:#fff;
}

.article-link:hover{
    background:#f5f5f5;
}

.folder{
    margin-top:25px;
    margin-bottom:5px;
    font-size:1.1rem;
    font-weight:bold;
}

.error{
    color:#666;
}

</style>

</head>

<body>

<h1>Library</h1>

<div id="articles"></div>

<script>

var container = document.getElementById("articles");

var xhr = new XMLHttpRequest();

xhr.open(
    "GET",
    "content/articles/index.json",
    true
);

xhr.onreadystatechange = function(){

    if(xhr.readyState !== 4){
        return;
    }

    if(xhr.status !== 200 && xhr.status !== 0){

        container.innerHTML =
            '<p class="error">' +
            'The library could not be loaded.' +
            '</p>';

        return;

    }

    var articles;

    try{

        articles = JSON.parse(xhr.responseText);

    }catch(e){

        container.innerHTML =
            '<p class="error">' +
            'The library data could not be read.' +
            '</p>';

        return;

    }

    container.innerHTML = "";

    if(!articles || !articles.length){

        container.innerHTML =
            '<p class="error">No articles yet.</p>';

        return;

    }

    var currentFolder = "";

    var i;
    var article;
    var link;
    var path;
    var folder;

    for(i=0; i<articles.length; i++){

        article = articles[i];

        path =
            article.path ||
            article.slug ||
            "";

        folder = getFolder(path);

        if(folder !== currentFolder){

            if(folder){

                var heading =
                    document.createElement("div");

                heading.className = "folder";

                heading.textContent = folder;

                container.appendChild(heading);

            }

            currentFolder = folder;

        }

        link =
            document.createElement("a");

        link.className = "article-link";

        link.href =
            "admin/article.html?file=" +
            encodeURIComponent(path);

        link.textContent =
            article.title ||
            article.slug ||
            path;

        container.appendChild(link);

    }

};

xhr.onerror = function(){

    container.innerHTML =
        '<p class="error">' +
        'The library could not be loaded.' +
        '</p>';

};

xhr.send(null);


/*
Find the folder portion of an article path.
*/

function getFolder(path){

    var slash = path.lastIndexOf("/");

    if(slash === -1){
        return "";
    }

    return path.substring(0,slash);

}

</script>

</body>

</html>
