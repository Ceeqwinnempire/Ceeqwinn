<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CEEQWINN Library</title>

<style>
body{
    font-family:Arial,sans-serif;
    max-width:800px;
    margin:40px auto;
    padding:20px;
}

h1{
    margin-bottom:30px;
}

a{
    display:block;
    padding:12px;
    margin-bottom:10px;
    text-decoration:none;
    border:1px solid #ddd;
    border-radius:8px;
    color:#111;
}

a:hover{
    background:#f5f5f5;
}
</style>

</head>
<body>

<h1>Library</h1>

<div id="articles"></div>

<script>

const articles=[

{
title:"Welcome to CEEQWINN",
slug:"welcome-to-ceeqwinn"
}

];

const container=document.getElementById("articles");

articles.forEach(article=>{

container.innerHTML+=`
<a href="article.html?file=${article.slug}">
${article.title}
</a>
`;

});

</script>

</body>
</html>
